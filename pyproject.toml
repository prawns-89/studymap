[project]
name = "studymap"
version = "0.1.0"
description = "Turn a folder of course material into an exam-focused, offline study site."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "playwright>=1.45",
]

[project.scripts]
studymap = "studymap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studymap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright Chromium (deselect with -m 'not browser')"]
