the first Sangam) was lost for ever; the <b>Tolkappiyam<\/b> survived from the second and guided the third.","tags":[]},{"h":"<b>Third<\/b>: the historical city of <b>Madurai<\/b>. All surviving works come from it, except the Tolkappiyam.","tags":[]}],"refs":[{"s":"s1","n":74,"id":"s1-74"},{"s":"s2","n":40,"id":"s2-40"},{"s":"s2","n":41,"id":"s2-41"},{"s":"s3","n":41,"id":"s3-41"},{"s":"s4","n":41,"id":"s4-41"}]},{"id":"akam_puram","title":"Akam and Puram","plain":"Akam and Puram","label":"Akam & Puram","c":"F","tier":1,"vis":1,"x":-379.4,"y":197.1,"side":-1,"facts":[{"h":"The two major forms of Tamil Sangam poetics, set out in the Tolkappiyam (past-paper answer \"'Akam' and 'Puram'\"; distractors pair them with Cankam or Corkkam).","tags":["2023","2024"]},{"h":"<b>Akam<\/b> (<span class=\"script\">அகம்<\/span>): the interior landscape of the imagination, love in all its moods. Set in a specific place and time; characters are <b>not named<\/b> but identified by gender, occupation, region and role in the relationship.","tags":[]},{"h":"<b>Puram<\/b> (<span class=\"script\">புறம்<\/span>): the outer world: heroism, war, court life, praise of kings, and the poet in search of a <b>generous patron<\/b>.","tags":[]},{"h":"Both are <b>secular<\/b>, and both explore how nature relates to human emotion and experience.","tags":[]}],"refs":[{"s":"s1","n":40,"id":"s1-40"},{"s":"s2","n":46,"id":"s2-46"}]},{"id":"sangam_features","title":"Features: not religious","plain":"Features: not religious","label":"Not religious","c":"F","tier":2,"vis":3,"x":-260.5,"y":226.6,"side":1,"facts":[{"h":"Most early traditions were religious in some form; Sangam literature is <b>not religious<\/b> in that sense.","tags":[]},{"h":"A refreshing change: fresh, <b>not weighed down by literary conceits and mythological references<\/b>.","tags":[]},{"h":"Still not unconnected with religion: the <b>Paripatal<\/b> has poems about four deities, <b>Vishnu, Shiva, Durga and Murugan<\/b>.","tags":[]}],"refs":[{"s":"s3","n":43,"id":"s3-43"}]},{"id":"three_types","title":"Three main types of Sangam work","plain":"Three main types of Sangam work","label":"Three types","c":"F","tier":2,"vis":2,"x":-417.0,"y":256.2,"side":-1,"facts":[{"h":"<b>Ettuttokai<\/b> (the Eight Anthologies), <b>Pattuppattu<\/b> (the Ten Long Poems) and the <b>Tolkappiyam<\/b> (the grammar treatise). \"Eight, Ten, Grammar.\"","tags":[]}],"refs":[]},{"id":"ettuttokai","title":"Ettuttokai: the Eight Anthologies","plain":"Ettuttokai: the Eight Anthologies","label":"Ettuttokai (8)","c":"F","tier":1,"vis":2,"x":-308.8,"y":288.9,"side":-1,"facts":[{"h":"In order: 1 <b>Kuruntokai<\/b>, 2 <b>Narrinai<\/b>, 3 <b>Akananuru<\/b>, 4 <b>Ainkurunuru<\/b>, 5 <b>Kalittokai<\/b>, 6 <b>Purananuru<\/b>, 7 <b>Patirruppattu<\/b>, 8 <b>Paripatal<\/b>.","tags":[]},{"h":"1–5 are <b>love (akam)<\/b>; 6–7 are <b>heroism (puram)<\/b> and praise of kings; 8 (Paripatal) is <b>mixed<\/b>: love, heroism, praise of kings.","tags":[]},{"h":"The trick: <b>Aka<\/b>nanuru has akam in it (love); <b>Pura<\/b>nanuru has puram (war). <i>Nanuru<\/i> means four hundred.","tags":[]},{"h":"The first edition was published in <b>1877<\/b> by C. W. Thamotharampillai.","tags":[]}],"refs":[{"s":"s2","n":42,"id":"s2-42"},{"s":"s3","n":42,"id":"s3-42"},{"s":"s4","n":42,"id":"s4-42"}]},{"id":"pattuppattu","title":"Pattuppattu: the Ten Long Poems","plain":"Pattuppattu: the Ten Long Poems","label":"Pattuppattu (10)","c":"F","tier":2,"vis":3,"x":-196.4,"y":290.2,"side":-1,"facts":[{"h":"1 Kurincippattu, 2 Porunararruppatai, 3 Cirupanarruppatai, 4 Perumpanarruppatai, 5 Maturaikkanci, 6 Malaipatukatam, 7 Pattinappalai, 8 Mullaippattu, 9 Netunalvatai, 10 Tirumurukarruppatai.","tags":[]},{"h":"<b>Mixed akam–puram<\/b> poetry.","tags":[]},{"h":"The notes add that an <i>arruppatai<\/i> is a \"guide poem\": one bard directs another to a generous patron, which ties to puram.","tags":["notes+"]}],"refs":[{"s":"s4","n":43,"id":"s4-43"}]},{"id":"tolkappiyam","title":"Tolkappiyam","plain":"Tolkappiyam","label":"Tolkappiyam","c":"F","tier":1,"vis":1,"x":-272.3,"y":317.6,"side":-1,"facts":[{"h":"The <b>earliest known Tamil work<\/b>, dated anywhere from about 300 BC to the 1st century AD. A text of <b>Tamil Sangam literature<\/b> (past-paper answer; distractors Jain, Buddhist and Sanskrit traditions).","tags":["2023","2024"]},{"h":"The first complete, classified and comprehensive treatise on <b>Tamil grammar<\/b>. It lays down the rules of Tamil poetics, distinctly different from Sanskrit poetics.","tags":[]},{"h":"<b>Three sections<\/b>: the first two cover ancient Tamil linguistics (orthography, phonology, morphology, syntax); the third covers prosody, rhetoric, poetics, genres, themes, codes of behaviour and poetic diction. The tinais appear in the third.","tags":[]},{"h":"<b>1,612 cuttirams<\/b>, which roughly correspond to Sanskrit sutras (aphorisms).","tags":[]},{"h":"Sets out akam and puram, and recognises <b>Sanskrit<\/b> as Tamil's only literary equal and competitor.","tags":[]},{"h":"Survived from the <b>second<\/b> Sangam.","tags":[]}],"refs":[{"s":"s1","n":8,"id":"s1-08"},{"s":"s2","n":43,"id":"s2-43"},{"s":"s3","n":44,"id":"s3-44"}]},{"id":"vs_sanskrit_poetics","title":"Tamil vs Sanskrit poetics","plain":"Tamil vs Sanskrit poetics","label":"Tamil vs Sanskrit poetics","c":"F","tier":2,"vis":3,"x":-495.4,"y":291.1,"side":-1,"facts":[{"h":"Sangam poetry has a syntax and poetics not found in North Indian poetry and is <b>not influenced<\/b> by Sanskrit poetics and prosody.","tags":[]},{"h":"Its uniqueness: the division into akam (love) and puram (war).","tags":[]},{"h":"Poems are also grouped by emotion (compare Bharata's <b>Nava Rasas<\/b>), but the emotions are portrayed very differently from the rasas.","tags":[]},{"h":"Rasa theory has permanent emotions, <b>sthayi<\/b>, and transient ones, <b>vyabhichari<\/b>.","tags":[]}],"refs":[{"s":"s3","n":45,"id":"s3-45"}]},{"id":"tinais","title":"The five tinais","plain":"The five tinais","label":"Five tinais","c":"F","tier":1,"vis":1,"x":-329.2,"y":258.1,"side":-1,"facts":[{"h":"<i>Tinai<\/i> means <b>mode<\/b>, a concept of <b>Tamil<\/b> poetics (past-paper answer; distractors Sanskrit, Telugu, Kannada). There are <b>five<\/b> tinais (past paper; distractors 4, 6, 7).","tags":["2024"]},{"h":"Emotions are expressed through landscape. Each tinai's imagery (flowers, trees, wildlife, people, climate, geography) carries the mood of one stage of a love relationship. The tinais appear in the prosody section, the third, of the Tolkappiyam.","tags":[]},{"h":"<b>Kurinci<\/b> (<span class=\"script\">குறிஞ்சி<\/span>), hills: the lovers' <b>meeting<\/b>.","tags":[]},{"h":"<b>Neytal<\/b> (<span class=\"script\">நெய்தல்<\/span>), seashore: secret meetings and lovers' <b>anxiety<\/b>.","tags":[]},{"h":"<b>Palai<\/b> (<span class=\"script\">பாலை<\/span>), wasteland: a frustrating journey, <b>separation<\/b>.","tags":[]},{"h":"<b>Mullai<\/b> (<span class=\"script\">முல்லை<\/span>), forest: <b>union<\/b> and happiness on the slide; traditionally, patient waiting.","tags":[]},{"h":"<b>Marutam<\/b> (<span class=\"script\">மருதம்<\/span>), lowland: a lover's <b>unfaithfulness<\/b>.","tags":[]},{"h":"Mnemonic: Hills Hold Hearts, Shores Stir Sighs, Wastes Wear Wanderers, Forests Find Fulfilment, Lowlands Lose Loyalty.","tags":[]},{"h":"Not a tinai: <b>plateau<\/b>. Mountain, coast and jungle all map onto tinais (past-paper answer).","tags":["2024"]}],"refs":[{"s":"s1","n":61,"id":"s1-61"},{"s":"s1","n":62,"id":"s1-62"},{"s":"s1","n":79,"id":"s1-79"},{"s":"s2","n":44,"id":"s2-44"},{"s":"s3","n":46,"id":"s3-46"},{"s":"s4","n":44,"id":"s4-44"}]},{"id":"kurinci","title":"Kurinci poem: \"What she said\"","plain":"Kurinci poem: \"What she said\"","label":"Kurinci · hills","c":"F","tier":2,"vis":3,"x":-501.5,"y":262.9,"side":-1,"facts":[{"h":"To her girl friend, with her foster mother within earshot: \"Bless you, listen to me: my man wore the flowers, their blossoms gold, their buds, sapphire; tell me, what do you call those trees on his <b>mountain slopes<\/b>?\"","tags":[]},{"h":"A pretend botany question that tells her foster mother she has a man from the mountains. Meeting.","tags":[]}],"refs":[{"s":"s4","n":45,"id":"s4-45"}]},{"id":"neytal","title":"Neytal poem: \"What her girl friend said\"","plain":"Neytal poem: \"What her girl friend said\"","label":"Neytal · shore","c":"F","tier":2,"vis":3,"x":-455.8,"y":352.7,"side":-1,"facts":[{"h":"To him, when he wanted to come by day: \"O man of the seashore, where old women dry their wet streaming hair and look like a flock of <b>herons<\/b> in the bay, when people said, a <b>chariot<\/b> comes here often, splattering the dark <b>neytal lilies<\/b> near the bubbling backwaters, Mother said at once, Don't go out.\"","tags":[]},{"h":"Gossip, secrecy and anxiety; the lilies mark the shore.","tags":[]}],"refs":[{"s":"s4","n":46,"id":"s4-46"}]},{"id":"palai","title":"Palai poem: \"What he said\"","plain":"Palai poem: \"What he said\"","label":"Palai · wasteland","c":"F","tier":2,"vis":3,"x":-162.9,"y":318.8,"side":-1,"facts":[{"h":"\"In the <b>desert<\/b>, in this long summer wilderness, seized and devoured by <b>wildfire<\/b>, if I should shut my eyes even a wink, I see: dead of night, a tall house in a cool yard, and the girl with freckles like <b>kino flowers<\/b>, hair flowing as with honey, her skin a young mango leaf.\"","tags":[]},{"h":"The burning journey against the cool remembered house: separation.","tags":[]}],"refs":[{"s":"s3","n":47,"id":"s3-47"}]},{"id":"mullai","title":"Mullai poem: \"What she said\"","plain":"Mullai poem: \"What she said\"","label":"Mullai · forest","c":"F","tier":2,"vis":3,"x":-374.0,"y":326.6,"side":-1,"facts":[{"h":"\"Only the dim-witted say it's evening when the sun goes down and the red sky reddens, when misery deepens, and the <b>mullai<\/b> begins to bloom in the dusk... <b>even noon is evening to one who has no one<\/b>.\"","tags":[]},{"h":"Mullai is the jasmine that blooms at dusk. Tradition reads it as patient waiting; the slide says union, so give the slide's label in the exam.","tags":[]}],"refs":[{"s":"s2","n":45,"id":"s2-45"}]},{"id":"marutam","title":"Marutam poem: \"What she said\"","plain":"Marutam poem: \"What she said\"","label":"Marutam · lowland","c":"F","tier":2,"vis":3,"x":-219.5,"y":352.7,"side":-1,"facts":[{"h":"\"In his country, <b>spotted crabs born in their mother's death<\/b> grow up with <b>crocodiles that devour their young<\/b>. Why is he here now? And why does he take these women, a jangle of gold bangles as they make love, only to leave them?\"","tags":[]},{"h":"Savage riverland images: unfaithfulness.","tags":[]},{"h":"None of these poems names anyone: \"What she said\", \"What he said\", \"What her girl friend said\". That is the akam rule.","tags":[]}],"refs":[]},{"id":"ramanujan","title":"A. K. Ramanujan","plain":"A. K. Ramanujan","label":"A. K. Ramanujan","c":"F","tier":1,"vis":2,"x":-206.6,"y":253.8,"side":-1,"facts":[{"h":"Translator of the sample Sangam poems and, with <b>Kamil Zvelebil<\/b>, one of the modern scholars who translated and commented on large selections.","tags":[]},{"h":"Also the far end of \"<b>from Kabir to A. K. Ramanujan<\/b>\": most Indian writers are bilingual if not multilingual.","tags":[]}],"refs":[]},{"id":"discovery","title":"The rediscovery of Sangam literature","plain":"The rediscovery of Sangam literature","label":"Rediscovery","c":"F","tier":1,"vis":2,"x":-256.3,"y":382.2,"side":-1,"facts":[{"h":"Part of the 19th-century literary and historical rediscoveries by Western and Indian Orientalists, who organised old manuscripts, translated them and printed them.","tags":[]},{"h":"<b>U. V. Swaminatha Iyer<\/b> (1855–1942) and <b>C. W. Thamotharampillai<\/b> (1832–1901) found the poems in crumbling <b>palm-leaf manuscripts<\/b> and copied and translated them for publication.","tags":[]},{"h":"Thamotharampillai published the <b>first edition of the Ettuttokai in 1877<\/b>.","tags":[]},{"h":"Modern translators: <b>A. K. Ramanujan<\/b> and <b>Kamil Zvelebil<\/b>.","tags":[]},{"h":"Not connected with Sangam literature: <b>M. S. Swaminathan<\/b> (past-paper answer), the agricultural scientist.","tags":["2024","outside"]}],"refs":[{"s":"s1","n":73,"id":"s1-73"},{"s":"s2","n":47,"id":"s2-47"},{"s":"s4","n":47,"id":"s4-47"}]},{"id":"tirukkural","title":"The didactic phase and the Tirukkural","plain":"The didactic phase and the Tirukkural","label":"Tirukkural","c":"F","tier":1,"vis":2,"x":-356.7,"y":358.0,"side":-1,"facts":[{"h":"A didactic phase under strong <b>Jain and Buddhist<\/b> influence. Part 5 places it around the 2nd–3rd centuries AD; Part 6 dates the Tirukkural to about 500 CE or earlier.","tags":[]},{"h":"The <b>Tirukkural<\/b> (Tiruvalluvar) expanded the old two-fold division into three: <b>love, virtue, and polity and society<\/b>.","tags":[]}],"refs":[{"s":"s2","n":48,"id":"s2-48"}]},{"id":"tamil_epics","title":"The Tamil epics: Cilappatikaram and Manimekalai","plain":"The Tamil epics: Cilappatikaram and Manimekalai","label":"Tamil twin epics","c":"F","tier":1,"vis":2,"x":-179.3,"y":257.3,"side":1,"facts":[{"h":"Composed in the post-Sangam phase; they <b>departed from the Sanskrit epics<\/b> and reflect <b>Buddhist and Jain<\/b> world views.","tags":[]},{"h":"At their centre are strong, empowered <b>women<\/b> with moral authority backed by religious sanction, who anticipate the <b>rebellious women of the Bhakti<\/b> period.","tags":[]},{"h":"With the Tirukkural they count as classical Tamil texts. Kamban's Ramavataram does not (past-paper answer).","tags":["2023","2024"]}],"refs":[{"s":"s3","n":48,"id":"s3-48"}]},{"id":"tamil_bhakti","title":"Bhakti in Tamil","plain":"Bhakti in Tamil","label":"Tamil Bhakti","c":"F","tier":1,"vis":2,"x":-436.0,"y":227.3,"side":-1,"facts":[{"h":"It blossomed around the <b>6th–7th centuries AD<\/b> in the devotional hymns of <b>Saiva and Vaishnava saints<\/b> (past-paper answer; distractors pair Brahmin, Madhva or Gour saints).","tags":["2023","2024"]},{"h":"It stressed a <b>personal god<\/b> and protested against conventional rituals and scriptures. It reached full flowering in the medieval period.","tags":[]}],"refs":[{"s":"s1","n":15,"id":"s1-15"}]},{"id":"epic_def","title":"What is an epic?","plain":"What is an epic?","label":"Epic: definition","c":"G","tier":1,"vis":2,"x":-399.0,"y":135.5,"side":-1,"facts":[{"h":"Also called a <b>heroic poem<\/b>: a <b>long verse narrative<\/b> on a <b>serious subject<\/b> in a <b>formal or elevated style<\/b>, centred on a heroic or quasi-divine figure on whose actions the fate of a tribe, a nation or the human race depends.","tags":[]},{"h":"Two kinds: <b>traditional<\/b> and <b>literary<\/b>.","tags":[]},{"h":"Past paper: an epic does <b>not<\/b> have a \"cramped or meagre setting\".","tags":["2023","2024"]}],"refs":[{"s":"s1","n":20,"id":"s1-20"},{"s":"s3","n":49,"id":"s3-49"}]},{"id":"traditional_epics","title":"Traditional (folk, primary) epics","plain":"Traditional (folk, primary) epics","label":"Traditional epics","c":"G","tier":1,"vis":2,"x":-665.9,"y":93.5,"side":-1,"facts":[{"h":"Written versions of originally <b>oral<\/b> poems about a tribal or national hero in a warlike age.","tags":[]},{"h":"Homer's <b>Iliad<\/b> and <b>Odyssey<\/b> (Greece); <b>Beowulf<\/b> (Anglo-Saxon); the <b>Chanson de Roland<\/b> (French); the <b>Poema del Cid<\/b> (Spanish); the <b>Nibelungenlied<\/b> (German).","tags":[]}],"refs":[{"s":"s2","n":49,"id":"s2-49"},{"s":"s4","n":49,"id":"s4-49"}]},{"id":"literary_epics","title":"Literary epics","plain":"Literary epics","label":"Literary epics","c":"G","tier":1,"vis":3,"x":-554.4,"y":93.4,"side":-1,"facts":[{"h":"Composed by an individual poet as a deliberate imitation of the traditional form.","tags":[]},{"h":"<b>Virgil's Aeneid<\/b>, copied by <b>Milton<\/b> in <b>Paradise Lost<\/b>; Milton copied in turn by <b>Blake<\/b> in his \"prophetic books\" and <b>Keats<\/b> in <b>Hyperion<\/b> in the Romantic period.","tags":[]},{"h":"So Paradise Lost is <b>not a traditional epic<\/b> (past-paper answer).","tags":["2023"]},{"h":"In epic, the fall of an enemy, as much as a friend or leader, is <b>tragic, not comic<\/b>. The epic gets its authority from a vision of nature as an <b>impersonal order<\/b>. <b>Renaissance<\/b> critics thought it the highest of all genres.","tags":[]}],"refs":[{"s":"s1","n":57,"id":"s1-57"},{"s":"s3","n":50,"id":"s3-50"},{"s":"s4","n":50,"id":"s4-50"}]},{"id":"epic_features","title":"Features of the epic","plain":"Features of the epic","label":"Epic features","c":"G","tier":2,"vis":3,"x":-428.1,"y":106.3,"side":-1,"facts":[{"h":"A hero of great national or even cosmic importance.","tags":[]},{"h":"A setting <b>huge in scale<\/b>: worldwide or larger.","tags":[]},{"h":"Gods and other supernatural beings take an interest or an active part.","tags":[]},{"h":"A <b>ceremonial performance<\/b> in the <b>grand style<\/b>: formal diction, ornate syntax, sonorous names, allusions, <b>epic similes<\/b> and <b>epithets<\/b>.","tags":[]}],"refs":[{"s":"s4","n":51,"id":"s4-51"}]},{"id":"epic_conventions","title":"Epic conventions","plain":"Epic conventions","label":"Epic conventions","c":"G","tier":2,"vis":3,"x":-511.6,"y":147.5,"side":-1,"facts":[{"h":"The narrator states his <b>argument<\/b> (the epic theme), <b>invokes a muse<\/b> or guiding spirit, and asks the muse the <b>epic question<\/b>; the answer begins the story.","tags":[]},{"h":"The story starts <b>in medias res<\/b>, in the middle of things, at a critical point in the action.","tags":[]},{"h":"<b>Catalogues<\/b> of the main characters in formal detail, and <b>set speeches<\/b> that reveal temperaments and moral attitudes.","tags":[]}],"refs":[{"s":"s2","n":50,"id":"s2-50"}]},{"id":"epic_spirit","title":"\"Epic\" by spirit","plain":"\"Epic\" by spirit","label":"Epic by spirit","c":"G","tier":3,"vis":3,"x":-434.5,"y":7.7,"side":-1,"facts":[{"h":"Applied to works with epic spirit and grandeur: Dante's <b>Divine Comedy<\/b> and Spenser's <b>The Faerie Queene<\/b>.","tags":[]},{"h":"And to large prose fiction: Melville's <b>Moby Dick<\/b>, Tolstoy's <b>War and Peace<\/b>, Joyce's <b>Ulysses<\/b>.","tags":[]}],"refs":[{"s":"s3","n":51,"id":"s3-51"}]},{"id":"indian_epics","title":"The Indian epics","plain":"The Indian epics","label":"Indian epics","c":"G","tier":1,"vis":2,"x":-507.3,"y":36.4,"side":-1,"facts":[{"h":"The <b>Ramayana<\/b> and the <b>Mahabharata<\/b>, composed roughly between the <b>12th and 2nd centuries BC<\/b> and written down sometime in the <b>2nd century AD<\/b>.","tags":[]},{"h":"Hindus know them as <b>Itihaas<\/b>, \"that which occurred\" (past-paper wording \"that which happened\"; distractors: myths and stories, historiography, social philosophy).","tags":["2023","2024"]},{"h":"Collective works that evolved over centuries.","tags":[]},{"h":"Traditional or literary? <b>Both<\/b>: they grew out of oral tradition but are attributed to named poets, Valmiki and Vyasa.","tags":[]},{"h":"The epics belong to Smriti.","tags":[]}],"refs":[{"s":"s1","n":3,"id":"s1-03"},{"s":"s2","n":51,"id":"s2-51"},{"s":"s3","n":52,"id":"s3-52"},{"s":"s4","n":52,"id":"s4-52"}]},{"id":"ramayana","title":"The Ramayana","plain":"The Ramayana","label":"Ramayana","c":"G","tier":1,"vis":1,"x":-413.7,"y":36.1,"side":-1,"facts":[{"h":"<b>Twice as big as the Iliad and the Odyssey<\/b> put together. Attributed to the sage <b>Valmiki<\/b>, the <b>Adikavi<\/b> (\"first poet\").","tags":[]},{"h":"A seminal text of the Hindu faith, with passages central to Hindu philosophy; its tales are the basis of festivals; it describes a marriage practice still observed today.","tags":[]},{"h":"On one level, <b>Aryan expansion to the south<\/b>, ending in Rama's conquest of Lanka. On another, Prince Rama's exile, the abduction of his wife by Ravana, and the war in Lanka. Several sub-plots.","tags":[]}],"refs":[{"s":"s3","n":53,"id":"s3-53"}]},{"id":"valmiki","title":"Valmiki, the Adikavi","plain":"Valmiki, the Adikavi","label":"Valmiki","c":"G","tier":1,"vis":3,"x":-525.1,"y":7.4,"side":-1,"facts":[{"h":"The Ramayana is Sanskrit's first epic and <b>Maharishi Valmiki its first poet<\/b>, the \"Adikavi\" (past-paper answer; distractors Adi Shankara, Vyasa, Ilango Adigal).","tags":["2023","2024"]},{"h":"Nothing specific is known about his life. Popular belief: he supported his family by robbing and plundering until a meeting with seers turned him to knowledge, penance and meditation.","tags":[]},{"h":"He saw a hunter kill the male of a pair of mating <b>cranes<\/b>. Moved by the female's cries: \"O hunter, you have killed the crane in love, you will never achieve fame and honour.\" Its form and rhythm came to be called the <b>shloka<\/b>. The notes add that shloka is traditionally linked with <i>shoka<\/i>, sorrow.","tags":["notes+"]},{"h":"He is present in his own story: Sita takes shelter in his ashram, where her sons <b>Luv and Kush<\/b> grow up.","tags":[]},{"h":"Not a Bhakti poet (past-paper answer).","tags":["2023"]}],"refs":[{"s":"s1","n":21,"id":"s1-21"},{"s":"s2","n":53,"id":"s2-53"},{"s":"s4","n":53,"id":"s4-53"}]},{"id":"ramayana_tradition","title":"The Ramayana tradition and its dating","plain":"The Ramayana tradition and its dating","label":"Ramayana dating","c":"G","tier":1,"vis":3,"x":-608.9,"y":10.9,"side":-1,"facts":[{"h":"Rama as <b>Maryada Purushottam<\/b>, the protector of ethics, is popular in the Vedic tradition and also in the <b>Jain and Buddhist<\/b> traditions, and has a long history in folklore.","tags":[]},{"h":"<b>Winternitz<\/b>: the first form emerged in the <b>4th century BC<\/b>, the final form in the <b>2nd century AD<\/b>.","tags":[]},{"h":"Some scholars think the Uttarakanda and parts of the Balakanda are later additions. The German scholar <b>Hermann Jacobi<\/b> accepts only <b>five kandas<\/b> as genuine. Either way, the modern Ramayana doesn't have a loose or incoherent structure.","tags":[]},{"h":"Your notes say Jacobi's five run \"from the Ayodhyakanda to the Uttarakanda\", but that span is six books. Ayodhya to Yuddha makes five. Learn the number: <b>five<\/b>.","tags":["outside"]},{"h":"<b>24,000 shlokas<\/b>, mostly in the <b>Anushtup<\/b> metre (\"anushtap chand\"), of which Valmiki is credited as creator. The text exists in many forms.","tags":[]}],"refs":[{"s":"s2","n":52,"id":"s2-52"},{"s":"s3","n":54,"id":"s3-54"},{"s":"s4","n":54,"id":"s4-54"}]},{"id":"mahabharata","title":"The Mahabharata","plain":"The Mahabharata","label":"Mahabharata","c":"G","tier":1,"vis":1,"x":-377.9,"y":64.9,"side":-1,"facts":[{"h":"The <b>largest poetic work in the world<\/b>: Hindu mythology, philosophy and religious treatise. Attributed to <b>Vyasa<\/b>, though clearly not written by one person at one time.","tags":[]},{"h":"The text gives its own name as <b>Jaya<\/b>, \"victory\" (past-paper answer; distractors Maya, Daya, Chaya).","tags":["2023","2024"]},{"h":"It contains the <b>Bhagavad Gita<\/b>, the essence and source of Hindu philosophical and religious thought (past-paper answer; distractors Ramayana, Veda, Purana).","tags":["2023","2024"]},{"h":"Encyclopaedic and grand; its stories teach <b>dharma, artha, kama and moksha<\/b>.","tags":[]},{"h":"Its creator knows the Ramakatha and includes an abridged version in three parvas: <b>Aranyaka, Drona and Shanti<\/b>. The most detailed is in the <b>Shanti Parva<\/b>, told by the sage <b>Markandeya<\/b> to a guilty, depressed <b>Yudhishthira<\/b>.","tags":[]}],"refs":[{"s":"s1","n":19,"id":"s1-19"},{"s":"s1","n":31,"id":"s1-31"},{"s":"s2","n":54,"id":"s2-54"}]},{"id":"vyasa","title":"Veda Vyasa","plain":"Veda Vyasa","label":"Vyasa","c":"G","tier":1,"vis":2,"x":-486.7,"y":78.1,"side":-1,"facts":[{"h":"Full name <b>Krishna Dvaipayana Vyasa<\/b>, son of <b>Satyavati<\/b> and the sage <b>Parashar<\/b>.","tags":[]},{"h":"<b>Dvaipayana<\/b>: born on an <b>island<\/b> in the Yamuna (dvipa = island). <b>Krishnamuni<\/b>: his dark complexion. <b>Veda Vyasa<\/b>: he explained the Vedas in the form of <b>Samhitas<\/b>.","tags":[]}],"refs":[{"s":"s2","n":56,"id":"s2-56"},{"s":"s4","n":55,"id":"s4-55"}]},{"id":"mbh_dating","title":"The Mahabharata: dating and size","plain":"The Mahabharata: dating and size","label":"Mahabharata dating","c":"G","tier":2,"vis":3,"x":-519.9,"y":121.3,"side":-1,"facts":[{"h":"Scholars generally agree it <b>predates the Buddha<\/b> (before the 6th century BC).","tags":[]},{"h":"About <b>100,000 shlokas<\/b>, hence the title <b>Shat Sahasra Samhita<\/b>, \"the collection of a hundred thousand\".","tags":[]},{"h":"Too huge for one person: several writers contributed over time.","tags":[]}],"refs":[{"s":"s3","n":55,"id":"s3-55"}]},{"id":"three_versions","title":"Jaya, Bharata, Mahabharata","plain":"Jaya, Bharata, Mahabharata","label":"Three versions","c":"G","tier":1,"vis":3,"x":-575.2,"y":64.9,"side":-1,"facts":[{"h":"In sequence: <b>Jaya<\/b> by Veda <b>Vyasa<\/b>, <b>Bharata<\/b> by <b>Vaisampayana<\/b>, <b>Mahabharata<\/b> by <b>Sauti<\/b>.","tags":[]},{"h":"<b>Eighteen parvas<\/b> (cantos); numerous commentaries.","tags":[]},{"h":"\"Whatever this epic contains is available elsewhere, but <b>whatever is not in the epic cannot be found anywhere<\/b>.\"","tags":[]}],"refs":[{"s":"s2","n":55,"id":"s2-55"},{"s":"s4","n":56,"id":"s4-56"}]},{"id":"upjeevya","title":"Upjeevya kavya: the epics as source books","plain":"Upjeevya kavya: the epics as source books","label":"Upjeevya kavya","c":"G","tier":1,"vis":1,"x":-500.7,"y":-21.3,"side":-1,"facts":[{"h":"The Ramayana and the Mahabharata are <b>Upjeevya Kavya<\/b>: source books for later oral and written works on many subjects, adapted by writers in other Indian languages.","tags":[]}],"refs":[{"s":"s3","n":56,"id":"s3-56"}]},{"id":"rigveda_reading","title":"Reading One: hymns from the Rig Veda","plain":"Reading One: hymns from the Rig Veda","label":"Rig Veda reading","c":"H","tier":1,"vis":1,"x":-472.9,"y":-198.6,"side":-1,"facts":[{"h":"From around <b>1500 BC<\/b>, in <b>Ralph T. H. Griffith<\/b>'s translation of <b>1896<\/b>.","tags":[]},{"h":"Five hymns: to <b>Agni, Vayu, Indra (twice) and the Ashvins<\/b>.","tags":[]}],"refs":[{"s":"s4","n":57,"id":"s4-57"}]},{"id":"agni","title":"Agni, god of fire","plain":"Agni, god of fire","label":"Agni hymn","c":"H","tier":1,"vis":2,"x":-483.9,"y":-254.3,"side":-1,"facts":[{"h":"The <b>very first hymn<\/b> of the Rig Veda: \"I laud Agni, the <b>chosen Priest<\/b>, God, minister of sacrifice, the <b>hotar<\/b>, lavishest of wealth.\"","tags":[]},{"h":"The <b>hotar<\/b> is the priest who invokes the gods. Fire carries the offering up, so Agni is the <b>messenger<\/b> between humans and gods: \"He shall bring hitherward the Gods.\"","tags":[]},{"h":"Praised by living and ancient seers; brings wealth \"most rich in heroes, glorious\"; sapient-minded, truthful; also called <b>Angiras<\/b>.","tags":[]},{"h":"\"O <b>dispeller of the night<\/b>\"; ruler of sacrifices, <b>guard of the eternal Law<\/b>, the radiant one.","tags":[]},{"h":"It ends: \"Be to us easy of approach, <b>even as a father to his son<\/b>: Agni, be with us for our weal.\"","tags":[]}],"refs":[{"s":"s2","n":57,"id":"s2-57"},{"s":"s3","n":57,"id":"s3-57"}]},{"id":"vayu","title":"Vayu, the wind (with Indra-Vayu and Mitra-Varuna)","plain":"Vayu, the wind (with Indra-Vayu and Mitra-Varuna)","label":"Vayu hymn","c":"H","tier":1,"vis":2,"x":-451.1,"y":-168.2,"side":-1,"facts":[{"h":"\"Beautiful Vayu, come, for thee these <b>Soma<\/b> drops have been prepared: drink of them, hearken to our call.\" Soma is the sacred drink pressed from a plant.","tags":[]},{"h":"Then <b>Indra-Vayu<\/b> together: \"the drops are yearning for you both. Come swiftly.\"","tags":[]},{"h":"<b>Mitra<\/b> (of holy strength) and <b>Varuna<\/b> (destroyer of foes), \"who make the <b>oil-fed rite<\/b> complete\"; lovers and cherishers of <b>Law<\/b>, strong by birth, with wide dominion.","tags":[]},{"h":"The notes add that this Law is <b>rita<\/b>, the cosmic order Varuna especially guards.","tags":["notes+"]}],"refs":[{"s":"s3","n":58,"id":"s3-58"}]},{"id":"indra","title":"Indra (two hymns)","plain":"Indra (two hymns)","label":"Indra hymns","c":"H","tier":1,"vis":2,"x":-546.1,"y":-136.1,"side":-1,"facts":[{"h":"\"O come ye hither, sit ye down: to Indra sing ye forth your song.\" \"The <b>richest of the rich<\/b>, the Lord of treasures excellent.\"","tags":[]},{"h":"His <b>pair of tawny horses<\/b>, yoked for battle, can't be challenged by any enemy. \"Grown at once to perfect strength\", \"born to drink the Soma juice\"; Somas mixed with <b>curd<\/b>.","tags":[]},{"h":"Called <b>Shatakratu<\/b>, \"of a hundred powers\". \"Keep slaughter far from us, for thou canst.\"","tags":[]},{"h":"Second hymn: \"Lord of all men, <b>fair of cheek<\/b>\". \"Give, Indra, wide and lofty fame, wealthy in cattle and in strength, lasting our lifetime\"; riches \"borne home in <b>wains<\/b>\" (wagons). The <b>Treasure-Lord<\/b> of wealth.","tags":[]}],"refs":[{"s":"s2","n":58,"id":"s2-58"},{"s":"s4","n":58,"id":"s4-58"}]},{"id":"ashvins","title":"The Ashvins, twin horsemen","plain":"The Ashvins, twin horsemen","label":"Ashvins hymn","c":"H","tier":1,"vis":3,"x":-583.4,"y":-258.4,"side":-1,"facts":[{"h":"\"Now <b>Morning<\/b> with her earliest light shines forth, dear <b>Daughter of the Sky<\/b>\": Dawn (<b>Ushas<\/b>). The Ashvins arrive with her.","tags":[]},{"h":"\"Sons of the sea, mighty to save, discoverers of riches\"; also called <b>Nasatyas<\/b>; their chariot flies with winged steeds.","tags":[]},{"h":"\"Come in the <b>ship of these our hymns<\/b>\"; the <b>Kanvas<\/b> (a family of poets) are named; the road of heaven was made manifest; they came to <b>Manu<\/b> long ago; the \"circumambient Ashvins\"; \"aids which none may interrupt\".","tags":[]},{"h":"Twins, <b>healers and rescuers<\/b>; the hymn is full of light breaking through darkness.","tags":[]}],"refs":[{"s":"s2","n":59,"id":"s2-59"},{"s":"s3","n":59,"id":"s3-59"}]},{"id":"rv_bigpicture","title":"The Rig Veda: the big picture","plain":"The Rig Veda: the big picture","label":"Rig Veda: big picture","c":"H","tier":2,"vis":3,"x":-444.4,"y":-108.0,"side":-1,"facts":[{"h":"Addressed to gods of <b>natural forces<\/b>: fire, wind, storm and sky, dawn.","tags":[]},{"h":"The setting is the <b>sacrifice<\/b>: Soma, fire and oil.","tags":[]},{"h":"The asks are <b>worldly<\/b>: wealth, cattle, heroes, fame and long life. A dialogue with the unknown through supplication.","tags":[]}],"refs":[{"s":"s4","n":59,"id":"s4-59"}]},{"id":"upanishad_tales","title":"Reading Two: tales from the Upanishads","plain":"Reading Two: tales from the Upanishads","label":"Upanishad tales","c":"H","tier":1,"vis":1,"x":-263.4,"y":-166.3,"side":-1,"facts":[{"h":"The book's note: the Upanishads were \"begun in the <b>6th or 7th century B.C.<\/b>, and edited, modified and amplified from time to time through a period of <b>a thousand years<\/b> by eminent seers.\"","tags":[]},{"h":"Three stories: <b>Uma the Golden<\/b>, <b>Yajnavalkya and Maitreyi<\/b>, <b>Nachiketa<\/b>. The notes add their sources: the <b>Kena<\/b>, <b>Brihadaranyaka<\/b> and <b>Katha<\/b> Upanishads.","tags":["notes+"]}],"refs":[{"s":"s4","n":60,"id":"s4-60"}]},{"id":"uma","title":"Uma the Golden (Kena Upanishad)","plain":"Uma the Golden (Kena Upanishad)","label":"Uma the Golden","c":"H","tier":1,"vis":1,"x":-598.4,"y":-197.0,"side":-1,"facts":[{"h":"The gods defeat the demons and grow proud: \"Victory is ours, greatness is ours.\" A dazzling <b>Light<\/b> appears in a field.","tags":[]},{"h":"<b>Agni<\/b> (\"I can burn everything on earth\") can't burn a single <b>blade of grass<\/b>. <b>Vayu<\/b> (\"I can blow everything away\") can't move it.","tags":[]},{"h":"<b>Indra<\/b> goes himself. The Light vanishes; in its place stands <b>Uma<\/b>, \"the Golden One\".","tags":[]},{"h":"\"The Light is <b>Brahma<\/b>, the Creator, the Supreme God, the Only God. You are only His manifestation. Your victories were really His victories.\"","tags":[]},{"h":"He can't be seen, described or conceived, yet whenever we speak, hear or smell, He is there. \"<b>If you think you know Him, then you really know very little of Him.<\/b>\" \"He who sees Him in everything comes to know Him.\"","tags":[]},{"h":"The way: <b>restraint of the body, cultivation of the mind, and righteous action<\/b>. Whoever knows Him is freed from sin and becomes immortal.","tags":[]}],"refs":[{"s":"s2","n":60,"id":"s2-60"},{"s":"s3","n":60,"id":"s3-60"},{"s":"s4","n":61,"id":"s4-61"}]},{"id":"maitreyi","title":"Yajnavalkya and Maitreyi (Brihadaranyaka Upanishad)","plain":"Yajnavalkya and Maitreyi (Brihadaranyaka Upanishad)","label":"Maitreyi","c":"H","tier":1,"vis":2,"x":-316.4,"y":-259.5,"side":-1,"facts":[{"h":"<b>Mithila<\/b> (modern North Bihar), about 2,500 years ago, famous for philosophers; even kings took part in debates.","tags":[]},{"h":"The sage <b>Yajnavalkya<\/b> has two wives: <b>Katyayani<\/b>, a good housewife, and <b>Maitreyi<\/b>, who loves to hear his teachings.","tags":[]},{"h":"Leaving for the forest, he divides his hut and belongings. Katyayani agrees. Maitreyi asks whether the whole world's wealth would make her immortal. \"No. Immortality can't be obtained by riches.\"","tags":[]},{"h":"\"Come, <b>sit near me<\/b>\" (the meaning of \"Upanishad\"). A husband, a wife, sons and wealth are loved not for their own sake but for the sake of the <b>Self<\/b>.","tags":[]},{"h":"The Thing is to us \"as the sound is in the <b>drum<\/b>, the musical note in the <b>veena<\/b>.\"","tags":[]},{"h":"<b>Salt water in the sea<\/b>: individual selves merge into the Great Soul at death. \"We do not exist after death.\"","tags":[]},{"h":"\"The consciousness which knows can never itself be known.\" It ends in <b>silence<\/b>: \"The Silence indeed became like the One to both of them.\"","tags":[]}],"refs":[{"s":"s2","n":61,"id":"s2-61"},{"s":"s3","n":61,"id":"s3-61"},{"s":"s4","n":62,"id":"s4-62"}]},{"id":"nachiketa","title":"Nachiketa (Katha Upanishad)","plain":"Nachiketa (Katha Upanishad)","label":"Nachiketa","c":"H","tier":1,"vis":1,"x":-373.4,"y":-230.6,"side":-1,"facts":[{"h":"The Brahmin <b>Vajasravas<\/b> performs a great yajna, giving away everything, but gives <b>lean, useless cows<\/b>.","tags":[]},{"h":"His son asks three times, \"Father, to whom will you offer me?\" The angry answer: \"I will offer you to <b>Death<\/b>!\"","tags":[]},{"h":"<b>Yama<\/b> is away. Nachiketa waits at his door <b>three days and three nights<\/b> without food or water. Ashamed, Yama grants <b>three boons<\/b>.","tags":[]},{"h":"Boon 1: that his father's anger subside and he be received gladly. Boon 2: the <b>fire sacrifice<\/b> that leads men and women to Heaven. Boon 3: the <b>truth about death<\/b>, whether people live on.","tags":[]},{"h":"Yama tempts him: a hundred years, sons and grandsons, cattle, elephants, horses, gold, kingship of the world, chariots of singing women. Nachiketa refuses: \"None of the gifts you offer is everlasting... Man can never be satisfied by pleasure alone.\"","tags":[]},{"h":"<b>Duty and Pleasure<\/b> are separate: whoever chooses duty ultimately gets pleasure. The notes add the Sanskrit pair <b>shreyas<\/b> (the good) and <b>preyas<\/b> (the pleasant).","tags":["notes+"]},{"h":"The soul is never born and never dies; \"the soul neither slays nor is slain\"; \"smaller than the smallest, larger than the largest\". It is known only by <b>grace<\/b>, not by scriptures, discussion or sharp intelligence.","tags":[]},{"h":"The path is \"narrow and sharp, like the <b>razor's edge<\/b>... <b>Awake, Arise<\/b>, bestir yourself, and stop not till the goal is reached.\" The notes add Somerset Maugham's novel title and Swami Vivekananda's motto.","tags":["notes+"]}],"refs":[{"s":"s2","n":62,"id":"s2-62"},{"s":"s3","n":62,"id":"s3-62"},{"s":"s4","n":63,"id":"s4-63"}]},{"id":"chariot","title":"The chariot image and the ladder","plain":"The chariot image and the ladder","label":"Chariot image","c":"H","tier":1,"vis":3,"x":-480.4,"y":-287.3,"side":-1,"facts":[{"h":"<b>Soul<\/b> = lord of the chariot · <b>Body<\/b> = the chariot · <b>Intelligence<\/b> = the driver · <b>Conscience<\/b> = the reins · <b>Senses<\/b> = the horses.","tags":[]},{"h":"With a weak conscience and an unguided driver, the senses run away. Use the reins and the horses are controlled. Supreme Bliss is only for the disciplined.","tags":[]},{"h":"The ladder: sense-objects are above the senses; the mind above sense-objects; the intellect above the mind; the soul above the intellect; greater than the soul, the <b>seed of the world<\/b>; greatest of all, beyond words, the <b>Ultimate Person<\/b>, the Supreme Soul in all beings.","tags":[]}],"refs":[{"s":"s2","n":63,"id":"s2-63"},{"s":"s3","n":63,"id":"s3-63"}]},{"id":"three_tales","title":"Comparing the three tales","plain":"Comparing the three tales","label":"Three tales","c":"H","tier":2,"vis":3,"x":-454.1,"y":-136.8,"side":-1,"facts":[{"h":"All three are about knowing the ultimate reality: Brahman, the Great Soul, the Supreme.","tags":[]},{"h":"Worldly things fail in each: fire and wind; wealth; heaven's pleasures.","tags":[]},{"h":"The teachers are unexpected: a goddess (Uma), a husband teaching his wife, Death teaching a boy.","tags":[]},{"h":"The learners are surprising too: the king of the gods, a woman, a child.","tags":[]},{"h":"All three end at the <b>limits of language<\/b>.","tags":[]}],"refs":[]},{"id":"valmiki_abduction","title":"Reading Three: Valmiki's abduction of Sita","plain":"Reading Three: Valmiki's abduction of Sita","label":"Abduction of Sita","c":"H","tier":1,"vis":1,"x":-335.4,"y":-199.9,"side":-1,"facts":[{"h":"Ralph Griffith's <b>rhyming<\/b> translation. Ravana drops his holy-man disguise: \"I wear each form as wills my mind.\" He boasts he can lift the land, drink the ocean dry and defy Death.","tags":[]},{"h":"\"The <b>ten-faced<\/b> rover of the night, with <b>twenty arms<\/b> exposed to sight\": red eyes, crimson robes, like a <b>dark cloud<\/b>.","tags":[]},{"h":"He woos Sita, \"resplendent as the dawn of day\", and insults Rama: \"A woman spoke and he resigned his home and kingdom.\" The woman is <b>Kaikeyi<\/b>.","tags":[]},{"h":"Epic simile: like the planet <b>Mercury<\/b> stealing the light of the star <b>Rohini<\/b>. He grabs her hair: \"the <b>Maithil<\/b> dame with lotus eyes\". The forest gods flee.","tags":[]},{"h":"His magic chariot is drawn by <b>asses<\/b>: \"So might a soaring <b>eagle<\/b> bear a <b>serpent's<\/b> consort through the air.\"","tags":[]},{"h":"Sita calls on <b>Lakshmana<\/b>, curses Ravana (\"in the day of harvest pain comes like the ripening of the grain\"), and blames <b>Queen Kaikeyi<\/b>.","tags":[]},{"h":"She bids farewell to Janasthan and its cassia trees and \"O pleasant stream <b>Godavari<\/b>\", and asks trees, birds and deer to tell Rama. Rama would bring her back \"though <b>Yama<\/b>'s self reclaimed his prey\".","tags":[]},{"h":"Last, she asks the <b>vulture<\/b> on a tall tree (Jatayu, unnamed here) to tell Rama and Lakshmana.","tags":[]}],"refs":[{"s":"s2","n":64,"id":"s2-64"},{"s":"s2","n":65,"id":"s2-65"},{"s":"s3","n":64,"id":"s3-64"},{"s":"s3","n":65,"id":"s3-65"},{"s":"s4","n":64,"id":"s4-64"},{"s":"s4","n":65,"id":"s4-65"}]},{"id":"kamban_intro","title":"Reading Four: the Kamba Ramayana","plain":"Reading Four: the Kamba Ramayana","label":"Kamba Ramayana","c":"H","tier":1,"vis":1,"x":-237.0,"y":-230.3,"side":-1,"facts":[{"h":"<b>Kamban<\/b> composed it in <b>Tamil<\/b> around the <b>12th century<\/b>: the <i>Ramavataram<\/i>, a <b>retelling, not a translation<\/b>. The extract is from the <b>Aranya Kandam<\/b> (the forest book). The notes give the date and title as added context.","tags":["notes+"]},{"h":"Being medieval, Kamban's Ramavataram is <b>not<\/b> a classical or ancient Tamil text (past-paper answer).","tags":["2023","2024"]}],"refs":[{"s":"s1","n":36,"id":"s1-36"},{"s":"s3","n":66,"id":"s3-66"}]},{"id":"jatayu","title":"Jatayu in Kamban","plain":"Jatayu in Kamban","label":"Jatayu","c":"H","tier":2,"vis":3,"x":-461.4,"y":-227.0,"side":-1,"facts":[{"h":"\"My children, stay here and do your <b>tapas<\/b>\" (penance). \"I will guard you against all danger.\"","tags":[]},{"h":"He leads them to the place the sage <b>Agastya<\/b> had recommended, \"guarding them <b>like a mother bird its young ones<\/b>\".","tags":[]},{"h":"In Valmiki he is only \"the vulture on a lofty tree\".","tags":[]}],"refs":[{"s":"s2","n":66,"id":"s2-66"}]},{"id":"godavari","title":"The Godavari and Panchavati","plain":"The Godavari and Panchavati","label":"Godavari","c":"H","tier":2,"vis":2,"x":-405.6,"y":-259.2,"side":-1,"facts":[{"h":"The river, spread like an ornament of the earth, flows through \"<b>the five tracts described in classical poetry<\/b>\": the five tinais. Kamban slips Sangam poetics into Rama's story.","tags":[]},{"h":"The river seems to <b>worship<\/b> the travellers: its face shining with lotuses, its eyes tulips, its hands the waves scattering flowers at their feet.","tags":[]},{"h":"They reach <b>Panchavati<\/b>, where Lakshmana builds a hut.","tags":[]}],"refs":[{"s":"s3","n":67,"id":"s3-67"}]},{"id":"surpanakha","title":"Surpanakha in Kamban","plain":"Surpanakha in Kamban","label":"Surpanakha","c":"H","tier":1,"vis":2,"x":-350.4,"y":-136.0,"side":-1,"facts":[{"h":"\"A fell disease from her birth, born to destroy root and branch the rakshasa clan.\"","tags":[]},{"h":"Her inner monologue: is this <b>Manmatha<\/b>, the god of love whom Shiva burnt bodiless, reborn? His arms reach his knees like the trunks of the <b>diggajas<\/b>; how lucky the earth is to be a woman; his shoulders outdo <b>Meru<\/b>; he is a <b>sapphire mountain<\/b>. \"What penance has penance done, to be wooed by such beauty?\"","tags":[]},{"h":"Her modesty shrinks \"<b>like a miser's fame<\/b>\". A mantra to <b>Lakshmi<\/b> gives her a lovely form: koel, peacock, swan, lightning creeper.","tags":[]},{"h":"Rama, \"<b>the first of the vedic gods<\/b>\", asks who she is: \"Brahma's great-granddaughter, sister of <b>Kubera<\/b> and of Ravana... a maiden named <b>Kamavalli<\/b>.\"","tags":[]},{"h":"She says she hates her clan's ways and got this form by penance. Rama thinks, \"A woman's mind is too deep to plumb.\"","tags":[]},{"h":"The battle of excuses: caste (he is kshatriya, she brahmin) → her father was a Vedic brahmin and her mother, chaste as Arundhati, the daughter of King <b>Chalakantaka<\/b>. Men shouldn't wed rakshasis → \"I'm a <b>Vidyadhari<\/b> now\". Her brothers must give her → the Vedas allow the <b>Gandharva<\/b> marriage. Rama laughs: \"The grace of the rakshasas, no less!\"","tags":[]},{"h":"Sita appears (\"a queen of heaven sprung from the earth\", \"the flower of chastity\"). Surpanakha: \"There is no end to beauty, only limits to an artist's skill.\" Then she calls <b>Sita<\/b> a rakshasi who lives on flesh.","tags":[]},{"h":"Sita clings to Rama: \"a <b>coral creeper against a raincloud<\/b>\".","tags":[]},{"h":"That night love spreads through her \"like poison from the fangs of an angry cobra\". She plans to carry Sita off. <b>Lakshmana<\/b>, guarding Sita \"as a miser minds his hoard\", cuts off her <b>nose, ears and nipples<\/b>. In Valmiki it is nose and ears.","tags":[]},{"h":"\"That bright sword... <b>sowed the seed for the war<\/b> that was to end with the hacking of the ten crowned heads of Ravana.\"","tags":[]}],"refs":[{"s":"s2","n":67,"id":"s2-67"},{"s":"s2","n":68,"id":"s2-68"},{"s":"s3","n":68,"id":"s3-68"},{"s":"s4","n":66,"id":"s4-66"},{"s":"s4","n":67,"id":"s4-67"},{"s":"s4","n":68,"id":"s4-68"}]},{"id":"surpanakha_lament","title":"Surpanakha's lament and tactics","plain":"Surpanakha's lament and tactics","label":"Lament & tactics","c":"H","tier":2,"vis":2,"x":-546.7,"y":-168.4,"side":-1,"facts":[{"h":"To <b>Ravana<\/b>: you lifted Kailasa, enslaved the gods of <b>wind, water, fire and death<\/b>, bear a sword from Shiva and broke the diggajas' tusks. Has your might passed to mere men, \"the meat we rakshasas feed upon\"? \"What a scandal!\"","tags":[]},{"h":"To her <b>nephew<\/b>, who imprisoned <b>Indra<\/b> (the notes add: <b>Indrajit<\/b>), and to <b>Khara and Dushana<\/b>: have you fallen asleep like <b>Kumbhakarna<\/b>? The forest is Khara's domain.","tags":[]},{"h":"To Rama: \"See what I've got for loving you!\" and \"If one has her breasts, ears and nose cut off, will she still look beautiful?\" Her excuse: \"a <b>jealous frog<\/b>... the sight of a co-wife\".","tags":[]},{"h":"Her tactics: <b>threat<\/b>; <b>bargain<\/b>; <b>boast<\/b> (she can carry them into the sky); <b>insult<\/b> to Sita (\"fragile flower\"); <b>reframing<\/b> (\"isn't a long nose a blemish in a woman?\"); <b>philosophy<\/b> (\"like and dislike are all in the mind\"); <b>self-deception<\/b> (\"my love for you is now doubled\"); <b>strategy<\/b> (\"only a snake knows the ways of a snake\", \"set a thief to catch a thief\"); <b>compromise<\/b> (marry her to Lakshmana: \"Have I not spent all my life with a woman who has <b>no waist<\/b>?\").","tags":[]},{"h":"Rama still has the arrow that killed <b>Tataka<\/b>, her mother's mother. Lakshmana eyes his spear; Rama: \"Yes, if she won't go.\"","tags":[]},{"h":"Her exit: \"I only said what I said to find out your true nature.\" She will bring <b>Khara<\/b>, \"swifter than the wind, more fierce than fire\".","tags":[]}],"refs":[{"s":"s2","n":69,"id":"s2-69"},{"s":"s3","n":69,"id":"s3-69"}]},{"id":"khara","title":"Khara","plain":"Khara","label":"Khara","c":"H","tier":2,"vis":3,"x":-389.6,"y":-165.0,"side":-1,"facts":[{"h":"She falls at Khara's feet \"like a dark cloud rendered ruddy\"; her cry is a drumbeat tolling the rakshasas' death; she rolls \"like a snake withered by lightning\".","tags":[]},{"h":"Her lie: \"this beauty I should take to <b>Lanka's king<\/b>... they cut off my nose.\" Her motive shifts from her own lust to serving Ravana, which is how she will tempt him later.","tags":[]},{"h":"<b>Fourteen<\/b> warriors, \"each a hill with two hands\", beg to go instead.","tags":[]}],"refs":[{"s":"s4","n":69,"id":"s4-69"}]},{"id":"valmiki_vs_kamban","title":"Valmiki vs Kamban","plain":"Valmiki vs Kamban","label":"Valmiki vs Kamban","c":"H","tier":1,"vis":1,"x":-343.4,"y":-290.7,"side":-1,"facts":[{"h":"<b>Language and tradition<\/b>: Sanskrit source text by the Adikavi vs a Tamil regional retelling, an upjeevya kavya.","tags":[]},{"h":"<b>Local colour<\/b>: Kamban brings in Tamil landscape poetics, the five tinais.","tags":[]},{"h":"<b>Rama<\/b>: openly divine yet playful in Kamban (\"the first of the vedic gods\", \"the blue cloud\", \"a sapphire mountain\"); absent, far away, in Valmiki's scene.","tags":[]},{"h":"<b>Villains<\/b>: Valmiki's Ravana is a spectacle; Kamban's Surpanakha is a psychology.","tags":[]},{"h":"<b>Women's voices<\/b>: Sita laments, curses and appeals to nature; Surpanakha argues, bargains and reframes.","tags":[]},{"h":"<b>Nature<\/b>: in Valmiki the forest gods flee and nature carries messages; in Kamban the Godavari worships.","tags":[]},{"h":"<b>Similes<\/b>: Valmiki's are cosmic and animal (Mercury and Rohini, the eagle and the serpent); Kamban's are sensuous and layered (a miser's fame, cobra venom, a coral creeper against a raincloud, a miser's hoard).","tags":[]},{"h":"<b>Jatayu<\/b>: an anonymous vulture vs a mother bird. <b>Mutilation<\/b>: nose and ears vs nose, ears and breasts, named as the seed of the war.","tags":[]},{"h":"<b>The causal chain<\/b>: Surpanakha disfigured → Khara → Ravana → Sita abducted → war in Lanka. Kamban gives the cause; Valmiki gives the effect.","tags":[]}],"refs":[{"s":"s2","n":70,"id":"s2-70"},{"s":"s3","n":70,"id":"s3-70"}]},{"id":"shrinking_gods","title":"The shrinking Vedic gods","plain":"The shrinking Vedic gods","label":"Shrinking gods","c":"H","tier":1,"vis":1,"x":-586.2,"y":-229.5,"side":-1,"facts":[{"h":"In the Rig Veda, Agni, Vayu and Indra are mighty and praised for wealth.","tags":[]},{"h":"In the Upanishad tale, the same three can't burn or move a blade of grass.","tags":[]},{"h":"In the epics, Ravana has enslaved the gods: Indra imprisoned by his son, the gods of wind, fire and death his servants.","tags":[]},{"h":"The old gods shrink, first before <b>Brahman<\/b>, then before <b>Ravana<\/b>, while a <b>personal, incarnate god, Rama<\/b>, rises. That points ahead to <b>Bhakti<\/b>.","tags":[]}],"refs":[{"s":"s4","n":70,"id":"s4-70"}]},{"id":"kalidasa","title":"Kalidasa","plain":"Kalidasa","label":"Kalidasa","c":"I","tier":1,"vis":2,"x":-47.3,"y":-344.7,"side":-1,"facts":[{"h":"Most scholars and critics believe he lived in the <b>Gupta Empire<\/b> (past-paper answer; distractors Shunga, Sinhala, Maurya).","tags":["2024"]},{"h":"In your notes: with Bhasa, a writer of romances and heroic plays.","tags":["notes"]},{"h":"Works: the plays <b>Abhijnanashakuntalam<\/b>, <b>Malavikagnimitram<\/b> and <b>Vikramorvashiyam<\/b>; the long poems <b>Kumarasambhava<\/b> and <b>Raghuvamsha<\/b>; the shorter poems <b>Meghaduta<\/b> and <b>Ritusamhara<\/b>.","tags":["outside"]},{"h":"The <b>Ritusamhara<\/b> is generally believed to have been written in his <b>youth<\/b> (past-paper answer; distractors Malavikagnimitra, Vikramorvashi, Meghaduta).","tags":["2024"]},{"h":"He is usually linked with the reign of Chandragupta II and the city of <b>Ujjain<\/b>.","tags":["outside"]}],"refs":[{"s":"s1","n":70,"id":"s1-70"},{"s":"s1","n":71,"id":"s1-71"},{"s":"s2","n":72,"id":"s2-72"},{"s":"s3","n":72,"id":"s3-72"}]},{"id":"meghaduta","title":"Meghaduta (The Cloud Messenger)","plain":"Meghaduta (The Cloud Messenger)","label":"Meghaduta","c":"I","tier":1,"vis":2,"x":-140.6,"y":-316.1,"side":-1,"facts":[{"h":"A <b>lyric poem<\/b> (past-paper answer; distractors belles-lettres, play, novel), i.e. laghukavya.","tags":["2023","2024"]},{"h":"A banished <b>Yaksha<\/b> has been away from his Himalayan home for <b>eight months<\/b> when the first cloud warns him of the rainy season (distractors 5, 6, 7).","tags":["2023","2024"]},{"h":"He sends the cloud as his messenger. Kalidasa lavishly describes the cities of <b>Vidisha and Ujjain<\/b> on its long journey from the <b>Vindhyas to the Himalayas<\/b> (distractors Nashik, Haridwar, Banaras).","tags":["2023","2024"]},{"h":"Added context: the Yaksha serves <b>Kubera<\/b> and is exiled for a year to Ramagiri; his home is <b>Alaka<\/b>; the cloud appears on the first day of <b>Ashadha<\/b>; the metre is mandakranta.","tags":["outside"]}],"refs":[{"s":"s1","n":9,"id":"s1-09"},{"s":"s1","n":29,"id":"s1-29"},{"s":"s1","n":41,"id":"s1-41"},{"s":"s2","n":71,"id":"s2-71"},{"s":"s3","n":71,"id":"s3-71"},{"s":"s4","n":71,"id":"s4-71"},{"s":"s4","n":72,"id":"s4-72"}]},{"id":"ashadh","title":"Ashadh Ka Ek Din (Mohan Rakesh)","plain":"Ashadh Ka Ek Din (Mohan Rakesh)","label":"Ashadh Ka Ek Din","c":"I","tier":1,"vis":2,"x":-206.5,"y":-377.6,"side":-1,"facts":[{"h":"By <b>Mohan Rakesh<\/b>, a pioneer of the <b>Nayi Kahani<\/b> movement in Hindi (past-paper answer; distractors Nayi Jawani, Nayi Kavita, Naya Natak).","tags":["2024"]},{"h":"The protagonist <b>Kalidasa<\/b> won't take the post of court poet at <b>Ujjain<\/b> because he <b>does not want to be uprooted from his natural surroundings<\/b> (distractors: restoring his house, caring for his uncle Matul, scepticism about court life).","tags":["2024"]},{"h":"Kalidasa marries the princess <b>Priyangumanjari<\/b> (distractors Ambika, Shakuntala, Mallika).","tags":["2024"]},{"h":"After fame at court he takes the new name <b>Matrugupta<\/b> (distractors Chandragupta, Samudragupta, Kirtigupta).","tags":["2024"]},{"h":"The title comes from the <b>Meghaduta<\/b>, but scholars say the plot aligns more with <b>Abhijnanashakuntalam<\/b> (distractors Malavikagnimitra, Vikramorvashi, Raghuvamsha).","tags":["2024"]},{"h":"Added context: written in 1958, three acts, often called the first modern Hindi play. <b>Mallika<\/b> is his village sweetheart, <b>Ambika<\/b> her mother, <b>Matul<\/b> his maternal uncle, <b>Vilom<\/b> the rival Mallika later marries. As Matrugupta he governs <b>Kashmir<\/b>.","tags":["outside"]}],"refs":[{"s":"s1","n":64,"id":"s1-64"},{"s":"s1","n":72,"id":"s1-72"},{"s":"s1","n":75,"id":"s1-75"},{"s":"s1","n":76,"id":"s1-76"},{"s":"s1","n":77,"id":"s1-77"},{"s":"s2","n":73,"id":"s2-73"},{"s":"s2","n":74,"id":"s2-74"},{"s":"s3","n":73,"id":"s3-73"},{"s":"s3","n":74,"id":"s3-74"},{"s":"s4","n":73,"id":"s4-73"}]},{"id":"cilappatikaram","title":"Cilappatikaram, \"The Tale of an Anklet\"","plain":"Cilappatikaram, \"The Tale of an Anklet\"","label":"Cilappatikaram","c":"I","tier":1,"vis":1,"x":-102.0,"y":-313.4,"side":1,"facts":[{"h":"By <b>Ilanko Atikal<\/b> (Ilango Adigal), \"<b>the venerable ascetic prince<\/b>\" (past-paper answer; distractors Veeraraghavachariar, Cenkuttuvan, Cittalai Cattanar).","tags":["2024"]},{"h":"Set in the three kingdoms of the <b>Cholas, Pantiyas (Pandyas) and Cerals (Cheras)<\/b>; distractors bring in Chalukyas, Sinhalas and Gangas.","tags":["2024"]},{"h":"The ornament at the centre of the plot: an <b>anklet<\/b> (distractors waist chain, earring, necklace).","tags":["2024"]},{"h":"Its literary sequel: the <b>Manimekalai<\/b> (distractors Tolkappiyam, Tirukkural, Ettuttokai).","tags":["2024"]},{"h":"To the traditional Tamil categories, love/erotic (akam) and war/heroic (puram), Ilanko added a new one: <b>mythic/allegory<\/b> (distractor: transient/ephemeral).","tags":["2024"]},{"h":"Added context: Kannaki, her husband Kovalan and the courtesan Madhavi. Kovalan is executed in Madurai for the supposed theft of the queen's anklet; Kannaki proves his innocence with her own anklet and burns Madurai, and is worshipped as the goddess Pattini. Ilanko is traditionally the Chera prince, younger brother of King Cenkuttuvan. The three books are set in Pukar (Chola), Madurai (Pandya) and Vanci (Chera). The Manimekalai, by Cittalai Cattanar, follows the daughter of Kovalan and Madhavi.","tags":["outside"]},{"h":"In your notes: the twin Tamil epics depart from the Sanskrit epics, carry Buddhist and Jain world views, and centre strong women.","tags":["notes"]}],"refs":[{"s":"s1","n":63,"id":"s1-63"},{"s":"s1","n":65,"id":"s1-65"},{"s":"s1","n":66,"id":"s1-66"},{"s":"s1","n":67,"id":"s1-67"},{"s":"s1","n":78,"id":"s1-78"},{"s":"s2","n":75,"id":"s2-75"},{"s":"s3","n":75,"id":"s3-75"},{"s":"s3","n":76,"id":"s3-76"},{"s":"s4","n":74,"id":"s4-74"},{"s":"s4","n":75,"id":"s4-75"}]},{"id":"karna_kunti","title":"Tagore's Karna and Kunti","plain":"Tagore's Karna and Kunti","label":"Karna & Kunti","c":"I","tier":2,"vis":2,"x":-95.9,"y":-374.2,"side":-1,"facts":[{"h":"Tagore recreates the dialogue between <b>Karna and Kunti<\/b> on the eve of Kurukshetra. His treatment departs from the epic in being more <b>psychological<\/b> (distractors feminist, aristocratic, historical).","tags":["2024"]},{"h":"Added context: <i>Karna-Kunti Samvad<\/i> (1900), a dramatic poem set at twilight on the bank of the Ganga. Kunti asks Karna, her first-born, to join his five Pandava brothers; he refuses and stays with the side he expects to lose.","tags":["outside"]}],"refs":[{"s":"s1","n":69,"id":"s1-69"},{"s":"s2","n":76,"id":"s2-76"}]},{"id":"bhakti","title":"The Bhakti movement","plain":"The Bhakti movement","label":"Bhakti","c":"I","tier":1,"vis":1,"x":-126.7,"y":-285.2,"side":-1,"facts":[{"h":"In Tamil, \"Bhakti\" quite literally stands for \"<b>eating God<\/b>\", per the course key (distractors consecration, devotion, piety).","tags":["2023"]},{"h":"It began in Tamil with the <b>Saiva and Vaishnava<\/b> saints.","tags":["notes","2023","2024"]},{"h":"It spread along the route <b>South → West → North → East<\/b>.","tags":["2023"]},{"h":"Bhakti poets include <b>Andal<\/b> (Tamil), <b>Lal Ded<\/b> (Kashmiri) and <b>Tukaram<\/b> (Marathi). <b>Valmiki is not<\/b> one.","tags":["2023","outside"]},{"h":"<b>Kabir<\/b> came from the working class; by profession he was a <b>weaver<\/b> (distractors boatman, cobbler, carpenter).","tags":["2023"]},{"h":"Songs of some Bhakti saint-poets made their way into the <b>Guru Granth Sahib<\/b> (distractors Dhammapada, Quran, Bible).","tags":["2023"]},{"h":"In your notes: Bhakti crossed linguistic and regional barriers, stressed a personal god, protested against ritual and scripture, reconciled the \"here\" and the \"hereafter\", and includes Kannada's Vacanakaras.","tags":["notes"]}],"refs":[{"s":"s1","n":46,"id":"s1-46"},{"s":"s1","n":47,"id":"s1-47"},{"s":"s1","n":48,"id":"s1-48"},{"s":"s1","n":49,"id":"s1-49"},{"s":"s1","n":55,"id":"s1-55"},{"s":"s2","n":77,"id":"s2-77"},{"s":"s3","n":77,"id":"s3-77"},{"s":"s3","n":78,"id":"s3-78"},{"s":"s4","n":76,"id":"s4-76"}]},{"id":"sufism","title":"Sufism","plain":"Sufism","label":"Sufism","c":"I","tier":1,"vis":2,"x":-226.8,"y":-348.5,"side":-1,"facts":[{"h":"From the Arabic <i>sufi<\/i> (a mystic), from <b><i>suf<\/b><\/i>, plausibly the <b>blue woollen garment<\/b> of early Islamic ascetics, per the course key (distractors: yellow silk sash, green cotton headgear, white muslin raiment).","tags":["2023"]},{"h":"The key treats <b>Iman, Ihsan and Ishraq<\/b> as pillars of Sufism; <b>Hajj is not<\/b> one. Hajj is a pillar of Islam itself.","tags":["2023","outside"]},{"h":"Sufi thinkers: <b>Amir Khusraw, Bulleh Shah, Shah Qalandar<\/b>. <b>Javed Akhtar<\/b>, a modern lyricist, is not one.","tags":["2023"]},{"h":"The Chishti masters in the options: Khwaja <b>Moinuddin Chishti<\/b> (Ajmer), <b>Qutbuddin Bakhtiar Kaki<\/b>, <b>Fariduddin Ganjshakar<\/b> (Baba Farid) and <b>Nizamuddin Auliya<\/b> (Delhi).","tags":["2023","outside"]}],"refs":[{"s":"s1","n":53,"id":"s1-53"},{"s":"s1","n":56,"id":"s1-56"},{"s":"s1","n":58,"id":"s1-58"},{"s":"s2","n":78,"id":"s2-78"},{"s":"s3","n":80,"id":"s3-80"}]},{"id":"khusraw","title":"Amir Khusraw","plain":"Amir Khusraw","label":"Amir Khusraw","c":"I","tier":1,"vis":2,"x":-321.2,"y":-348.7,"side":-1,"facts":[{"h":"Popularly known as <b>Tuti-e-Hind<\/b>, the Parrot of India (distractors Sher-e-Hind, Fakhr-e-Hind, Kaisar-i-Hind).","tags":["2023"]},{"h":"The spiritual disciple of <b>Hazrat Nizamuddin Auliya<\/b>.","tags":["2023"]},{"h":"Credited with introducing the <b>sitar and tabla<\/b> to India (distractors sarangi and bansuri, pakhawaj and mridangam, sarod and santoor).","tags":["2023"]},{"h":"Regarded as a Sufi thinker.","tags":["2023"]},{"h":"Added context: 1253–1325; wrote in Persian and Hindavi; called the father of qawwali; famous for riddles (paheliyan); served several Delhi sultans.","tags":["outside"]}],"refs":[{"s":"s1","n":42,"id":"s1-42"},{"s":"s1","n":44,"id":"s1-44"},{"s":"s1","n":60,"id":"s1-60"},{"s":"s2","n":79,"id":"s2-79"},{"s":"s4","n":78,"id":"s4-78"}]},{"id":"nanak","title":"Guru Nanak and Sikhism","plain":"Guru Nanak and Sikhism","label":"Guru Nanak","c":"I","tier":1,"vis":2,"x":-128.1,"y":-345.0,"side":-1,"facts":[{"h":"He had a mystical experience at the age of <b>30<\/b> (distractors 10, 20, 40).","tags":["2023"]},{"h":"Before the Guru Gaddi passed to the <b>Guru Granth Sahib<\/b>, Sikhism was led by <b>ten<\/b> human Gurus (distractors 9, 11, 12).","tags":["2023"]},{"h":"Sikhism is a powerful fusion of the <b>Bhakti and Sufi<\/b> philosophies (distractors Hindu and Buddhist, Sufi and Baul, Saiva and Vaishnava).","tags":["2023"]},{"h":"Added context: 1469–1539, born at Talwandi (Nankana Sahib).","tags":["outside"]}],"refs":[{"s":"s1","n":50,"id":"s1-50"},{"s":"s1","n":52,"id":"s1-52"},{"s":"s1","n":54,"id":"s1-54"},{"s":"s2","n":80,"id":"s2-80"},{"s":"s4","n":77,"id":"s4-77"}]},{"id":"bulleh","title":"Bulleh Shah","plain":"Bulleh Shah","label":"Bulleh Shah","c":"I","tier":3,"vis":3,"x":-270.6,"y":-321.7,"side":-1,"facts":[{"h":"A Sufi thinker, listed in the key with Khusraw and Shah Qalandar.","tags":["2023"]},{"h":"Added context: the 18th-century Punjabi  other communities)<\/b>","node":"ethnic"},{"a":"Not a dilemma of \"Indian literature\"","b":"In the set: indigenous vs colonial languages; scheduled vs unscheduled; singular vs plural. Outsider: <b>elite vs popular culture<\/b>","node":"dilemmas"},{"a":"Not a comparative study","b":"In the set: anything crossing language, time or art form. Outsider: <b>modern Bengali novel vs modern Bengali short story<\/b>","node":"requirements"},{"a":"Not a traditional epic","b":"In the set: Iliad, Odyssey, Beowulf, Roland, Cid, Nibelungenlied. Outsider: <b>Paradise Lost, Aeneid, Hyperion<\/b>","node":"literary_epics"},{"a":"Not an epic feature","b":"In the set: long verse narrative, serious subject, elevated style, huge setting. Outsider: <b>cramped or meagre setting<\/b>","node":"epic_def"},{"a":"Not classical/ancient Tamil","b":"In the set: Tirukkural, Cilappatikaram, Manimekalai, Sangam poems. Outsider: <b>Kamban's Ramavataram (12th c.)<\/b>","node":"kamban_intro"},{"a":"Not a Sangam scholar","b":"In the set: U. V. Swaminatha Iyer, C. W. Thamotharampillai, A. K. Ramanujan, Kamil Zvelebil. Outsider: <b>M. S. Swaminathan<\/b>","node":"discovery"},{"a":"Not a purushartha","b":"In the set: dharma, artha, kama, moksha. Outsider: <b>yoga (or anything else)<\/b>","node":"purusharthas"},{"a":"Not a Vedanga","b":"In the set: siksha, chandas, vyakarana, nirukta, jyotisha, kalpa. Outsider: <b>anything else<\/b>","node":"vedangas"},{"a":"Not in Jana Gana Mana (slide translation)","b":"In the set: Punjab, Sind, Gujarat, Maratha, Dravida, Odisha, Bengal. Outsider: <b>Kashmir<\/b>","node":"jana_gana_mana"},{"a":"Not a reason to write","b":"In the set: record, share, express, higher purpose. Outsider: <b>fame, prizes, patronage<\/b>","node":"why_write"},{"a":"Not a Bhakti poet","b":"In the set: Andal, Lal Ded, Tukaram, Kabir. Outsider: <b>Valmiki<\/b>","node":"bhakti"},{"a":"Not a Sufi thinker","b":"In the set: Amir Khusraw, Bulleh Shah, Shah Qalandar. Outsider: <b>Javed Akhtar<\/b>","node":"sufism"},{"a":"Not a pillar of Sufism","b":"In the set: Iman, Ihsan, Ishraq. Outsider: <b>Hajj<\/b>","node":"sufism"},{"a":"Not a name for Urdu","b":"In the set: Rekhta, Dakkhani, Hindavi. Outsider: <b>Bhatiali<\/b>","node":"urdu"}],"groups":[]},{"title":"Every number","lede":"Dates, counts and percentages.","style":"table","rows":[{"a":"~4,000 yrs","b":"age of Indian literature (Part 5)","node":"four_periods"},{"a":"3,500 yrs","b":"\"over the last three thousand five hundred years\" (Part 6)","node":"classical_canvas"},{"a":"~2,000 yrs","b":"Tamil's literary history","node":"classical_canvas"},{"a":"2000 BC–1000 AD","b":"Ancient period","node":"four_periods"},{"a":"1000–1800","b":"Medieval period","node":"four_periods"},{"a":"1800–1947","b":"Indian literature under colonial rule","node":"four_periods"},{"a":"1947 →","b":"Contemporary; also India's latest boundaries","node":"four_periods"},{"a":"~1500 BC","b":"Rig Veda hymns; Vedic composers weren't \"Indians\"","node":"rigveda_reading"},{"a":"~1200 BC","b":"end of the Vedic Age","node":"sruti"},{"a":"4","b":"Vedas","node":"vedas"},{"a":"11","b":"Brahmanas","node":"brahmanas"},{"a":"3","b":"Aranyakas","node":"aranyakas"},{"a":"13","b":"principal Upanishads","node":"upanishads"},{"a":"6","b":"Vedangas","node":"vedangas"},{"a":"4","b":"purusharthas","node":"purusharthas"},{"a":"6th/7th c. BC","b":"Upanishads begun, edited over 1,000 years","node":"upanishad_tales"},{"a":"1st c. BC–1st c. AD","b":"Natyashastra","node":"natyashastra"},{"a":"5th c. AD","b":"Prakrit in songs, gathas, Sattasai","node":"prakrit"},{"a":"6th c. AD","b":"knowledge codified","node":"social_tendencies"},{"a":"6th–11th c.","b":"the Prakrits (Part 4)","node":"cultural_unity"},{"a":"7th c. AD","b":"Apabhramsa becomes literary","node":"apabhramsa"},{"a":"3rd c. BC","b":"earliest Kannada inscriptions","node":"kannada"},{"a":"~850 AD","b":"Kavirajamargam","node":"kannada"},{"a":"10th c.","b":"Kannada Golden Age: Pampa, Ponna, Ranna","node":"kannada_golden"},{"a":"6th–7th c. AD","b":"Tamil Bhakti blossoms","node":"tamil_bhakti"},{"a":"300 BC–1st c. AD","b":"Tolkappiyam","node":"tolkappiyam"},{"a":"1,612","b":"cuttirams in the Tolkappiyam (3 sections)","node":"tolkappiyam"},{"a":"2,000+","b":"Sangam poems","node":"sangam"},{"a":"3","b":"Sangams (academies)","node":"three_sangams"},{"a":"8 / 10","b":"Ettuttokai anthologies / Pattuppattu poems","node":"three_types"},{"a":"1–5, 6–7, 8","b":"love, war, mixed (Ettuttokai)","node":"ettuttokai"},{"a":"400","b":"nanuru (Akananuru, Purananuru); also India's spoken languages","node":"ettuttokai"},{"a":"5","b":"tinais","node":"tinais"},{"a":"4","b":"deities of the Paripatal: Vishnu, Shiva, Durga, Murugan","node":"sangam_features"},{"a":"1877","b":"first Ettuttokai edition (Thamotharampillai)","node":"discovery"},{"a":"12th–2nd c. BC","b":"Indian epics composed","node":"indian_epics"},{"a":"2nd c. AD","b":"epics written down; Winternitz's final Ramayana","node":"indian_epics"},{"a":"4th c. BC","b":"Winternitz: first form of the Ramayana","node":"ramayana_tradition"},{"a":"5","b":"kandas Jacobi accepts","node":"ramayana_tradition"},{"a":"24,000","b":"Ramayana shlokas","node":"ramayana_tradition"},{"a":"~100,000","b":"Mahabharata shlokas (Shat Sahasra Samhita)","node":"mbh_dating"},{"a":"18","b":"Mahabharata parvas","node":"three_versions"},{"a":"3","b":"parvas holding the Ramakatha","node":"mahabharata"},{"a":"1896","b":"Griffith's Rig Veda translation","node":"rigveda_reading"},{"a":"~2,500 yrs ago","b":"Mithila of Yajnavalkya","node":"maitreyi"},{"a":"3 days &amp; nights","b":"Nachiketa at Yama's door; 3 boons","node":"nachiketa"},{"a":"10 / 20","b":"Ravana's faces / arms","node":"valmiki_abduction"},{"a":"14","b":"Khara's warriors, \"each a hill with two hands\"","node":"khara"},{"a":"12th c.","b":"Kamban's Ramavataram","node":"kamban_intro"},{"a":"1971","b":"Indira Gandhi: \"India is an idea\"","node":"indira"},{"a":"6 lakh / 55 crore","b":"villages / children (Indira)","node":"indira"},{"a":"79.80 / 14.23 / 2.30","b":"Hindu / Muslim / Christian %","node":"religions"},{"a":"1.7 / 0.7 / 0.37","b":"Sikh / Buddhist / Jain %","node":"religions"},{"a":"0.66 / 0.24","b":"other religions / unspecified %","node":"religions"},{"a":"5 · 14 · 22 · 400","b":"language families · scripts · scheduled · spoken","node":"language_atlas"},{"a":"3","b":"civilisations: Hindu, Islamic, Christian","node":"outcome"},{"a":"7th day","b":"saptami: the idol in Kamalakanta's vision","node":"bankim"},{"a":"1882","b":"Anandamath (notes)","node":"vande_mataram"},{"a":"12 Mar 1954","b":"Sahitya Akademi inaugurated","node":"sahitya_akademi"},{"a":"24","b":"Akademi languages incl. English; also 24 + 24 awards","node":"sahitya_akademi"},{"a":"6,000+ · 19 hrs","b":"Akademi books · one book every 19 hours","node":"sahitya_akademi"},{"a":"20/20/20/40","b":"Quiz 1 / Quiz 2 / assignment / comprehensive","node":"evaluation"},{"a":"9","b":"categories of folk song","node":"folk_songs"},{"a":"4","b":"reasons people write","node":"why_write"},{"a":"6","b":"course aims","node":"aims"},{"a":"8 months","b":"the Yaksha's absence (past papers)","node":"meghaduta"},{"a":"30 / 10","b":"Nanak's age at his mystical experience / human Gurus (past papers)","node":"nanak"}],"groups":[]},{"title":"Watch-outs","lede":"Where the notes contradict themselves.","style":"cards","rows":[{"a":"Mullai","b":"The slide says union and happiness; tradition and the sample poem say waiting. Pick the slide's answer.","node":"mullai"},{"a":"Jacobi's five kandas","b":"Your notes say \"Ayodhya to Uttara\", which is six books; Ayodhya to Yuddha is five. The number to learn is five.","node":"ramayana_tradition"},{"a":"The Ramakatha in the Mahabharata","b":"The slide puts the most detailed telling in the Shanti Parva (Markandeya to Yudhishthira). In the epic itself, Markandeya's Rama story sits in the Aranyaka (Vana) Parva. For the quiz, follow the slide.","node":"mahabharata"},{"a":"Sangam dates","b":"The slides give three ranges (400 BCE–250 CE, 300 BCE–300 CE, 300 BCE–100 CE). Part 5 uses 300 BC–100 AD.","node":"sangam"},{"a":"Age of Indian literature","b":"\"Almost 4,000 years\" in Part 5; \"the last 3,500 years\" in Part 6. Match the wording of the question.","node":"classical_canvas"},{"a":"Tirukkural's date","b":"Part 5 puts the didactic phase in the 2nd–3rd c. AD; Part 6 dates the Tirukkural to about 500 CE or earlier.","node":"tirukkural"},{"a":"Prakrit's dates","b":"The Ashokan inscriptions (Prakrit) are the earliest dated records, yet Part 4 lists \"the Prakrits (6th–11th centuries)\" after Sanskrit. Don't let the second date trap you on Ashoka.","node":"prakrit"},{"a":"Itihaas","b":"Notes: \"that which occurred\". Past papers: \"that which happened\". Same answer.","node":"indian_epics"},{"a":"The lamp","b":"Notes: the Nilavilakku, a lamp with many wicks. Past papers: \"base lamps\".","node":"nilavilakku"},{"a":"Earliest Tamil work","b":"The Tolkappiyam is the earliest known or surviving work. Legend makes the lost Agattiyam older still.","node":"tolkappiyam"},{"a":"Bhakti in Tamil","b":"The key says \"eating God\", not \"devotion\". Devotion was the most common wrong answer.","node":"bhakti"}],"groups":[]}],"sets":[{"key":"s1","name":"Past papers","desc":"Both Quiz 1 papers with the official answers.","qs":[{"id":"s1-01","n":1,"node":"sahitya_akademi","tags":["2023","2024"],"q":"The establishment that is mandated to sustain and promote literary activities in India with a view to forging national cultural unity is ________.","opts":["National Translation Mission","Sahitya Samvad","Central Institute of Indian Languages","Sahitya Akademi"],"ans":3,"expl":"The Government Resolution: foster literary activity in all Indian languages and \"through them promote the cultural unity of the country\". Inaugurated 12 March 1954."},{"id":"s1-02","n":2,"node":"brahmanas","tags":["2023","2024"],"q":"________ had to be studied while carrying on with one's daily life in the larger community, whereas ________ were meant for study in the seclusion of the forest.","opts":["Aranyakas; Upanishads","Samhitas; Brahmanas","Vedas; Samhitas","Brahmanas; Aranyakas"],"ans":3,"expl":"Brahmanas were studied during daily life in the community; Aranyakas in the forest (aranya = forest)."},{"id":"s1-03","n":3,"node":"indian_epics","tags":["2023","2024"],"q":"The Hindus also relate to the Indian epics as ________.","opts":["Itihaas, or myths, legends &amp; stories","Itihaas, or historiography","Itihaas, or social philosophy","Itihaas, or that which happened"],"ans":3,"expl":"Your notes: Itihaas, \"that which occurred\"."},{"id":"s1-04","n":4,"node":"brahmanas","tags":["2023","2024"],"q":"The commentaries on the Vedas are to be found in the ________.","opts":["Upanishads","Puranas","Brahmanas and Aranyakas","Samhitas"],"ans":2,"expl":"The Brahmanas are the commentaries; the Aranyakas continue the enquiry in the forest."},{"id":"s1-05","n":5,"node":"prasad","tags":["2023","2024"],"q":"\"Desperately Seeking India\" is a poem written by ________.","opts":["Rajendra Prasad","Venkatesh Prasad","Ravishankar Prasad","G.J.V. Prasad"],"ans":3,"expl":"The poem whose speaker is an outsider everywhere: \"In Madras, an Aryan spy...\""},{"id":"s1-06","n":6,"node":"complit","tags":["2023","2024"],"q":"Comparative literary analysis is usually carried out by adopting the two approaches of picking ________.","opts":["Plot and setting","Point of view and conflict","Language and character(s)","Genre and theme"],"ans":3,"expl":"Genre across languages, or idea/theme across languages."},{"id":"s1-07","n":7,"node":"upanishads","tags":["2023","2024"],"q":"There are about ________ principal Upanishads.","opts":["7","16","10","13"],"ans":3,"expl":"Thirteen principal Upanishads (eleven Brahmanas, three Aranyakas)."},{"id":"s1-08","n":8,"node":"tolkappiyam","tags":["2023","2024"],"q":"Tolkappiyam is a text from the ________.","opts":["Jain religious tradition","Tamil Sangam literature","Sanskrit literature","Buddhist religious tradition"],"ans":1,"expl":"The earliest known Tamil work: a grammar that survived from the second Sangam."},{"id":"s1-09","n":9,"node":"meghaduta","tags":["2023","2024"],"q":"Kalidasa's Meghaduta or Cloud Messenger, falls into the category of ________.","opts":["Belles-lettres","Play","Lyric poem","Novel"],"ans":2,"expl":"Not in your notes. In the notes' terms it is a laghukavya (lyric poetry)."},{"id":"s1-10","n":10,"node":"indira","tags":["2023","2024"],"q":"India is a thought and an idea because ________.","opts":["All the options are correct","India is so vast and diverse that it is not possible to capture its essence and define it in simple cartographic terms","Despite India's astonishing diversity and variegated history, a fundamental unity ties together India and all Indians","India's long civilisational continuity has shaped its unique outlook and that outlook has transcended the borders of India and influenced peoples and cultures elsewhere in the world","None of the options is correct","India is much more than the sum total of its peoples, cultures, histories, and geographical area"],"ans":0,"expl":"Every listed reason fits the lecture built around Indira Gandhi's 1971 line."},{"id":"s1-11","n":11,"node":"civilisation","tags":["2023","2024"],"q":"The statement that \"a single shelf of a good European library was worth the whole native literature of India\" was made by ________.","opts":["T.B. Macaulay","James Mill","Robert Clive","Friedrich Max Müller"],"ans":0,"expl":"Macaulay, the villain of the slide on Indian civilisation."},{"id":"s1-12","n":12,"node":"vocab","tags":["2023","2024"],"q":"Which of the following is a relatively more abstract concept?","opts":["People","State","Country","Nation"],"ans":3,"expl":"The nation is more abstract; the state carries a sense of power; a country is native land."},{"id":"s1-13","n":13,"node":"vedas","tags":["2023","2024"],"q":"The word \"Veda\" derives from the verb word ________.","opts":["Vadati","Vid","Ved","Viditva"],"ans":1,"expl":"Vid: to know."},{"id":"s1-14","n":14,"node":"vocab","tags":["2023","2024"],"q":"Which of the following embodies a sense of power structure?","opts":["People","State","Country","Nation"],"ans":1,"expl":"The state carries a sense of the structure of power."},{"id":"s1-15","n":15,"node":"tamil_bhakti","tags":["2023","2024"],"q":"Bhakti literature in the Tamil-speaking region emerged from the devotional songs sung by the ________.","opts":["Madhva and Gour saints","Brahmin and Vaishnava saints","Brahmin and Saiva saints","Saiva and Vaishnava saints"],"ans":3,"expl":"Tamil Bhakti, 6th–7th centuries AD: Saiva and Vaishnava saints, a personal god, protest against ritual."},{"id":"s1-16","n":16,"node":"sruti","tags":["2023","2024"],"q":"The Sruti texts contain whatever is heard and revealed, and the Smriti texts are made up of all that is remembered, recorded from memory and later consolidated into a literary tradition.","opts":["The whole statement is true","Only true about Smriti texts","The whole statement is false","Only true about Sruti texts"],"ans":0,"expl":"Both halves match the notes word for word."},{"id":"s1-17","n":17,"node":"against_plural","tags":["2023","2024"],"q":"One of the most compelling arguments in favour of the literature of India being singular is that ________ cannot be considered the only yardstick for categorizing literature.","opts":["Region","Class","Language","Gender"],"ans":2,"expl":"Argument 1 against the plural: language can't be the only criterion."},{"id":"s1-18","n":18,"node":"nilavilakku","tags":["2023","2024"],"q":"The idea of India's many languages producing a unitary Indian literature is often explained by the analogy of traditional Indian ________.","opts":["Temple Bells","Anklets","Base Lamps","Chandelier"],"ans":2,"expl":"K. M. George's Nilavilakku: many wicks, one light."},{"id":"s1-19","n":19,"node":"mahabharata","tags":["2023","2024"],"q":"Bhagavad Gita is contained in the following ancient text ________.","opts":["Mahabharata","Ramayana","Veda","Purana"],"ans":0,"expl":"The Mahabharata contains the Bhagavad Gita, the essence and source of Hindu philosophical thought."},{"id":"s1-20","n":20,"node":"epic_def","tags":["2023","2024"],"q":"An epic does not have the following feature:","opts":["Formal and elevated style","Long verse narrative","Cramped or meagre setting","Serious subject-matter"],"ans":2,"expl":"The epic's setting is huge in scale: worldwide or larger."},{"id":"s1-21","n":21,"node":"valmiki","tags":["2023","2024"],"q":"The term \"Adikavi\" is commonly used to refer to ________.","opts":["Adi Shankara","Vyasa","Valmiki","Ilango Adigal"],"ans":2,"expl":"Valmiki, the first poet; the Ramayana is the first epic in Sanskrit."},{"id":"s1-22","n":22,"node":"requirements","tags":["2023","2024"],"q":"In order to carry out a comparative literature study, one needs to know at least ________.","opts":["Two languages","One language","Three languages","Four languages"],"ans":0,"expl":"The classic requirement: at least two languages."},{"id":"s1-23","n":23,"node":"sruti","tags":["2023","2024"],"q":"Which of the following is not included in the body of Shruti texts?","opts":["Vedas","Aranyakas","Puranas","Brahmanas","Upanishads"],"ans":2,"expl":"The Puranas are Smriti."},{"id":"s1-24","n":24,"node":"cultural_unity","tags":["2023","2024"],"q":"________ served as the link language in India during ancient times.","opts":["Apabhramsha","Pali","Sanskrit","Prakrit"],"ans":2,"expl":"Even after Apabhramsa, the Prakrits and Pali came along, Sanskrit stayed a link language."},{"id":"s1-25","n":25,"node":"smriti","tags":["2023","2024"],"q":"Which of the following is not included in the body of Smriti texts?","opts":["Mahabharata","Vedangas","Samhitas","Ramayana","Bhagavatapurana"],"ans":2,"expl":"Samhitas are Sruti. Smriti = Vedangas, epics, Puranas."},{"id":"s1-26","n":26,"node":"dilemmas","tags":["2023","2024"],"q":"Which of the following dilemmas does not contribute to the difficulty in the conceptualization of the category called 'Indian literature'?","opts":["Indigenous Indian languages versus languages of India's erstwhile colonizers","Scheduled versus unscheduled languages of India","Elite culture versus popular culture in India","Singular Indian literature versus plural Indian literatures"],"ans":2,"expl":"The other three are the dilemmas in Part 1."},{"id":"s1-27","n":27,"node":"memory_forgetting","tags":["2023","2024"],"q":"Which of the following factors is contrary to the general assumptions about a nation?","opts":["Homogeneity among the population","Heterogeneity among the population","Forgetting episodes of violence, brutality and humiliation","Remembering of past triumphs and accomplishments"],"ans":1,"expl":"Nation-building wants unity and homogeneity, memory and selective forgetting."},{"id":"s1-28","n":28,"node":"prakrit","tags":["2023","2024"],"q":"Some of the characters in many ancient Sanskrit plays are depicted as speaking in ________.","opts":["Tamil","Prakrit","Telugu","Kannada"],"ans":1,"expl":"Especially women and servants."},{"id":"s1-29","n":29,"node":"meghaduta","tags":["2023","2024"],"q":"In Kalidasa's Meghaduta or Cloud Messenger, the banished Yaksha has been away from his home in the Himalayas for ________ months when the first cloud warns him of the approach of the rainy season.","opts":["8","6","7","5"],"ans":0,"expl":"Not in your notes. Eight months."},{"id":"s1-30","n":30,"node":"civilisation","tags":["2023","2024"],"q":"The concept of \"Bharatvarsha\" acquired new meaning and significance during the ________ times.","opts":["Buddhist revival","Medieval","Ancient","Colonial"],"ans":3,"expl":"Colonial times: Macaulay, the \"civilizing mission\", and the nationalist answer."},{"id":"s1-31","n":31,"node":"mahabharata","tags":["2023","2024"],"q":"The original name of the epic Mahabharata is ________.","opts":["Maya","Daya","Chaya","Jaya"],"ans":3,"expl":"Jaya (\"victory
