ad","Folk literature is oral, but it survives only in writing","Indian literature is ancient, but Indian languages are modern","Homogenisation is dangerous, but pure heterogeneity erases what cultures share"],"ans":3,"expl":"The tension that runs through the whole course."},{"id":"s4-26","n":26,"node":"cultural_unity","tags":[],"q":"Rather than a mechanical, unitary concept of Indian literature, the slides conclude we need ________.","opts":["a comparative concept","a purely regional concept","a Sanskrit-centred concept","a national-language concept"],"ans":0,"expl":"One that covers the twin aspects of unity and diversity."},{"id":"s4-27","n":27,"node":"four_periods","tags":[],"q":"Indian literature under colonial rule is dated to ________.","opts":["1757 to 1947","1600 to 1857","1800 to 1947","1000 to 1800"],"ans":2,"expl":"Ancient 2000 BC–1000 AD, Medieval 1000–1800, Colonial 1800–1947, Contemporary 1947 onwards."},{"id":"s4-28","n":28,"node":"sruti","tags":[],"q":"\"Sruti\" literally means ________.","opts":["that which is remembered","that which is heard","that which is joined together","that which occurred"],"ans":1,"expl":"Sruti = heard, Smriti = remembered, Samhita = joined together, Itihaas = that which occurred."},{"id":"s4-29","n":29,"node":"aranyakas","tags":[],"q":"\"Aranya\", the root of Aranyaka, means ________.","opts":["thread","teacher","sacrifice","forest"],"ans":3,"expl":"The Aranyakas were meant for study in the seclusion of the forest."},{"id":"s4-30","n":30,"node":"upanishads","tags":[],"q":"The Upanishads are mainly ________, reflecting the yearning for answers about life, death, immortality, truth and God.","opts":["grammatical","metaphysical","ritualistic","historical"],"ans":1,"expl":"Philosophical discourses on Atman (the self) and Brahman (ultimate reality)."},{"id":"s4-31","n":31,"node":"smriti","tags":[],"q":"The body of Smriti literature consists of ________.","opts":["the six Vedangas, the epics and the Puranas","the Vedas and the Vedangas","the Samhitas, Brahmanas, Aranyakas and Upanishads","the epics, the Upanishads and the Puranas"],"ans":0,"expl":"Sruti is the Samhitas, Brahmanas, Aranyakas and Upanishads."},{"id":"s4-32","n":32,"node":"vedangas","tags":[],"q":"Kalpa, one of the six Vedangas, deals with ________.","opts":["grammar","astronomy","rituals and ceremonies","phonetics"],"ans":2,"expl":"Siksha, chandas, vyakarana, nirukta, jyotisha, kalpa."},{"id":"s4-33","n":33,"node":"sutra_dharma","tags":[],"q":"The Smriti texts lead towards the realisation of Dharma, which the slides define as ________.","opts":["the law of the king","the pursuit of wealth","that which sustains, is firm and durable, and governs all human life","liberation from rebirth"],"ans":2,"expl":"Artha is wealth; moksha is liberation."},{"id":"s4-34","n":34,"node":"post_vedic_poetry","tags":[],"q":"Post-Vedic Sanskrit poetry, composed in royal courts, differed from earlier works by being ________.","opts":["purely devotional","more secular in tone","entirely oral","written in Prakrit"],"ans":1,"expl":"It ranged from the amatory to the moral to the renunciatory."},{"id":"s4-35","n":35,"node":"verse_prose_forms","tags":[],"q":"In Sanskrit literature, the akhyayika is ________.","opts":["an invented story about historical characters","a eulogy of the king","a mixed prose-and-verse work","a lyric poem"],"ans":0,"expl":"Laghukavya = lyric, prasasti = eulogy, campu = mixed prose and verse."},{"id":"s4-36","n":36,"node":"social_tendencies","tags":[],"q":"By which century AD had knowledge been codified, with strict rules for literary composition and even appreciation?","opts":["12th","2nd","9th","6th"],"ans":3,"expl":"This changed with the growing influence of Buddhism and Jainism."},{"id":"s4-37","n":37,"node":"prakrit","tags":[],"q":"\"Prakrit\" means ________.","opts":["sacred","refined","natural or common","broken"],"ans":2,"expl":"The language of everyday conversation and commerce, alongside the refined Sanskrit."},{"id":"s4-38","n":38,"node":"kannada","tags":[],"q":"Rock edicts and inscriptions suggest that Kannada existed as early as the ________.","opts":["850 AD","3rd century BC","7th century AD","10th century AD"],"ans":1,"expl":"Its earliest known literary work, the Kavirajamargam, dates to about 850 AD."},{"id":"s4-39","n":39,"node":"two_archetypes","tags":[],"q":"In the Virasaiva movement, the makers of divine poetry in Kannada who reconciled the \"here\" and the \"hereafter\" were the ________.","opts":["Vacanakaras","Sangam poets","Nayanars","Alvars"],"ans":0,"expl":"Bhakti resolves the two archetypes, life and passion versus renunciation."},{"id":"s4-40","n":40,"node":"sangam","tags":[],"q":"The word \"Sangam\" refers to ________.","opts":["the royal court of the Cholas","a Jain monastery","a river confluence where poets bathed","an academy where the poetry was composed and later anthologised"],"ans":3,"expl":"Also spelled cankam, chankam, shangam."},{"id":"s4-41","n":41,"node":"three_sangams","tags":[],"q":"The first Sangam is said to have flourished in ________, a Pandyan city now under the sea.","opts":["Then-Madurai","Kapadapuram","Madurai","Kanchipuram"],"ans":0,"expl":"\"South Madurai\", south of present-day Kanyakumari."},{"id":"s4-42","n":42,"node":"ettuttokai","tags":[],"q":"The Paripatal, the eighth of the Eight Anthologies, deals with ________.","opts":["love alone","love, heroism and the praise of kings together","heroism alone","grammar and prosody"],"ans":1,"expl":"Anthologies 1–5 are love, 6–7 heroism, 8 mixed."},{"id":"s4-43","n":43,"node":"pattuppattu","tags":[],"q":"Which of the following is one of the Ten Long Poems (Pattuppattu)?","opts":["Kuruntokai","Purananuru","Kalittokai","Maturaikkanci"],"ans":3,"expl":"The other three are among the Eight Anthologies."},{"id":"s4-44","n":44,"node":"tinais","tags":[],"q":"The word \"tinai\" means ________.","opts":["academy","love","mode","hill"],"ans":2,"expl":"Tinais tie emotions to landscapes; they appear in the third section of the Tolkappiyam."},{"id":"s4-45","n":45,"node":"kurinci","tags":[],"q":"\"My man wore the flowers... tell me, what do you call those trees on his mountain slopes?\" This sample poem belongs to ________.","opts":["Marutam: unfaithfulness","Palai: separation","Mullai: union","Kurinci: the lovers' meeting"],"ans":3,"expl":"She pretends to ask a botany question while telling her foster mother she has a man from the mountains."},{"id":"s4-46","n":46,"node":"neytal","tags":[],"q":"In the Neytal sample poem, old women drying their wet hair look like ________.","opts":["crabs on the shore","a flock of herons in the bay","clouds over the sea","dark neytal lilies"],"ans":1,"expl":"\"What her girl friend said\": a chariot has been noticed, and Mother says, \"Don't go out.\""},{"id":"s4-47","n":47,"node":"discovery","tags":[],"q":"U. V. Swaminatha Iyer and C. W. Thamotharampillai found the Sangam poems in ________.","opts":["the Ashokan edicts","temple inscriptions","crumbling palm-leaf manuscripts","a British library in Madras"],"ans":2,"expl":"Through exemplary scholarship they copied and translated them for publication."},{"id":"s4-48","n":48,"node":"classical_canvas","tags":[],"q":"The four major languages of the south, all classical languages with strong literary traditions, are ________.","opts":["Tamil, Kannada, Malayalam and Telugu","Tamil, Malayalam, Telugu and Konkani","Tamil, Sanskrit, Pali and Prakrit","Tamil, Kannada, Telugu and Tulu"],"ans":0,"expl":"Tamil's literary history is nearly two thousand years long."},{"id":"s4-49","n":49,"node":"traditional_epics","tags":[],"q":"The Nibelungenlied is a traditional epic from ________.","opts":["Spain","England","Germany","France"],"ans":2,"expl":"Chanson de Roland (French), Poema del Cid (Spanish), Beowulf (Anglo-Saxon)."},{"id":"s4-50","n":50,"node":"literary_epics","tags":[],"q":"Renaissance critics considered the epic to be ________.","opts":["a lesser form than tragedy","suitable only for oral performance","a form for comic subjects","the highest of all genres"],"ans":3,"expl":"In epic, the fall of an enemy is tragic, not comic."},{"id":"s4-51","n":51,"node":"epic_features","tags":[],"q":"Which of the following is a feature of the epic according to the slides?","opts":["Gods and supernatural beings take an interest or an active part in the action","The narration imitates ordinary speech","The hero is a private individual of no public importance","The setting is limited to a single household"],"ans":0,"expl":"Also: a hero of national or cosmic importance, a huge setting, and a ceremonial grand style."},{"id":"s4-52","n":52,"node":"indian_epics","tags":[],"q":"Hindus relate to the Ramayana and the Mahabharata as Itihaas, meaning ________.","opts":["that which is imagined","that which occurred","that which is heard","that which is sung"],"ans":1,"expl":"The past papers phrase it \"that which happened\"."},{"id":"s4-53","n":53,"node":"valmiki","tags":[],"q":"According to popular belief, before becoming a poet Valmiki supported his family by ________.","opts":["robbing and plundering","serving at Ayodhya's court","ferrying pilgrims across the Ganga","hunting cranes"],"ans":0,"expl":"A chance meeting with seers turned him to knowledge, penance and meditation."},{"id":"s4-54","n":54,"node":"ramayana_tradition","tags":[],"q":"The German scholar Hermann Jacobi accepts only ________ kandas of the Ramayana as genuine.","opts":["seven","three","five","six"],"ans":2,"expl":"Scholars suspect the Uttarakanda and parts of the Balakanda are later additions."},{"id":"s4-55","n":55,"node":"vyasa","tags":[],"q":"Vyasa was the son of ________.","opts":["Ganga and Shantanu","Kunti and Surya","Sita and Rama","Satyavati and the sage Parashar"],"ans":3,"expl":"Krishna Dvaipayana Vyasa. Kunti and Surya are Karna's parents."},{"id":"s4-56","n":56,"node":"three_versions","tags":[],"q":"\"Whatever this epic contains is available elsewhere, but whatever is not in the epic cannot be found anywhere.\" This is said of ________.","opts":["the Kamba Ramayana","the Mahabharata","the Ramayana","the Iliad"],"ans":1,"expl":"The Mahabharata: 18 parvas; Jaya, then Bharata, then Mahabharata."},{"id":"s4-57","n":57,"node":"rigveda_reading","tags":[],"q":"The Rig Veda hymns in the reading are in the translation of ________.","opts":["Ralph T. H. Griffith","A. K. Ramanujan","K. M. George","Friedrich Max Müller"],"ans":0,"expl":"Griffith (1896). He also translated the Ramayana extract, in rhyme."},{"id":"s4-58","n":58,"node":"indra","tags":[],"q":"In the Rig Veda reading, Indra's wealth is \"borne home in wains\". A wain is ________.","opts":["a ship","a cow-pen","a wagon","a granary"],"ans":2,"expl":"The good life spelled out: fame, cattle, strength, long life, harvests."},{"id":"s4-59","n":59,"node":"rv_bigpicture","tags":[],"q":"Which of the following best sums up what the Rig Veda hymns ask of the gods?","opts":["Knowledge of the self (Atman)","Worldly goods: wealth, cattle, heroes, fame and long life","Liberation from the cycle of rebirth","Victory over the demons of Lanka"],"ans":1,"expl":"Gods of natural forces, a sacrificial setting, and worldly asks."},{"id":"s4-60","n":60,"node":"upanishad_tales","tags":[],"q":"The book's note says the Upanishads were begun in the 6th or 7th century BC and were edited and amplified over a period of ________.","opts":["two thousand years","a hundred years","three generations","a thousand years"],"ans":3,"expl":"By eminent seers."},{"id":"s4-61","n":61,"node":"uma","tags":[],"q":"According to Uma, the way to know the Supreme is through ________.","opts":["wealth, power and fame","study of the scriptures and sharp intelligence","sacrifice, Soma and hymns","restraint of the body, cultivation of the mind and righteous action"],"ans":3,"expl":"\"He who gets to know Him is freed from all sins and becomes immortal.\""},{"id":"s4-62","n":62,"node":"maitreyi","tags":[],"q":"Yajnavalkya says the Thing is to us \"as the sound is in the drum, the musical note in the ________\".","opts":["flute","conch","veena","bell"],"ans":2,"expl":"The drum and the veena are like the Thing; their sounds are like our individual selves."},{"id":"s4-63","n":63,"node":"nachiketa","tags":[],"q":"Nachiketa waited at Yama's door for ________ without food or water.","opts":["three days and three nights","twelve years","one night","seven days"],"ans":0,"expl":"Ashamed, Yama granted him three boons."},{"id":"s4-64","n":64,"node":"valmiki_abduction","tags":[],"q":"Ravana, dropping his disguise, appears as \"the ________ rover of the night, with ________ arms\".","opts":["hundred-faced; a thousand","ten-faced; twenty","ten-faced; ten","five-faced; ten"],"ans":1,"expl":"Red eyes, crimson robes, like a dark cloud."},{"id":"s4-65","n":65,"node":"valmiki_abduction","tags":[],"q":"In her lament, Sita bids farewell to the pleasant stream ________ and asks the trees, birds and deer to tell Rama.","opts":["Ganga","Yamuna","Godavari","Sarayu"],"ans":2,"expl":"In Kamban the same river worships the travellers."},{"id":"s4-66","n":66,"node":"surpanakha","tags":[],"q":"Kamban introduces Surpanakha as \"a fell disease from her birth, born to ________\".","opts":["destroy root and branch the rakshasa clan","marry the lord of the three worlds","serve the goddess Lakshmi","guard the forest of Khara"],"ans":0,"expl":"Her disfigurement sows the seed of the war."},{"id":"s4-67","n":67,"node":"surpanakha","tags":[],"q":"Surpanakha tells Rama the Vedas allow a marriage by mutual love, the ________ marriage.","opts":["Brahma","Gandharva","Swayamvara","Rakshasa"],"ans":1,"expl":"Her brothers, she says, will come round afterwards."},{"id":"s4-68","n":68,"node":"surpanakha","tags":[],"q":"In Kamban's version, Lakshmana cuts off Surpanakha's ________.","opts":["nose and ears only","hair and nose","right hand","nose, ears and nipples"],"ans":3,"expl":"Valmiki has nose and ears; Kamban adds the breasts."},{"id":"s4-69","n":69,"node":"khara","tags":[],"q":"When Surpanakha falls at Khara's feet, she lies that she was wounded because ________.","opts":["she was defending Jatayu","she asked Rama for food","she tried to stop the ascetics cutting down the forest","she tried to seize the beautiful woman to take to Lanka's king"],"ans":3,"expl":"She changes her motive from her own lust to serving Ravana."},{"id":"s4-70","n":70,"node":"shrinking_gods","tags":[],"q":"Across the course, the old Vedic gods shrink first before Brahman and then before ________, while a personal, incarnate god rises.","opts":["Ravana","Kubera","Yama","Khara"],"ans":0,"expl":"Mighty in the Rig Veda, powerless before the Light in the Upanishad, Ravana's servants in the epic. Rama rises, pointing ahead to Bhakti."},{"id":"s4-71","n":71,"node":"meghaduta","tags":["beyond"],"q":"In Kalidasa's Meghaduta, the banished Yaksha has been away from home for ________ months when the first cloud warns him of the rainy season.","opts":["six","eight","ten","twelve"],"ans":1,"expl":"Both past papers: eight months."},{"id":"s4-72","n":72,"node":"meghaduta","tags":["beyond"],"q":"Which two cities does Kalidasa lavishly describe along the cloud's route in the Meghaduta?","opts":["Nashik and Haridwar","Vidisha and Haridwar","Vidisha and Ujjain","Ujjain and Banaras"],"ans":2,"expl":"The 2023 paper; the 2024 paper asked for Ujjain alone."},{"id":"s4-73","n":73,"node":"ashadh","tags":["beyond"],"q":"In Ashadh Ka Ek Din, Kalidasa marries a princess named ________.","opts":["Mallika","Priyangumanjari","Ambika","Shakuntala"],"ans":1,"expl":"The 2024 paper. Mallika is his village sweetheart; Ambika is her mother."},{"id":"s4-74","n":74,"node":"cilappatikaram","tags":["beyond"],"q":"The ornament at the centre of the plot of the Cilappatikaram is ________.","opts":["an earring","a signet ring","an anklet","a necklace"],"ans":2,"expl":"The 2024 paper. The title means \"The Tale of an Anklet\"."},{"id":"s4-75","n":75,"node":"cilappatikaram","tags":["beyond"],"q":"To the traditional Tamil categories of love (akam) and war (puram), Ilanko Atikal added a new category: ________.","opts":["didactic/virtue","devotional/bhakti","transient/ephemeral","mythic/allegory"],"ans":3,"expl":"The 2024 paper."},{"id":"s4-76","n":76,"node":"bhakti","tags":["beyond"],"q":"According to the course, the term \"Bhakti\" in the Tamil language quite literally stands for ________.","opts":["eating God","consecration","devotion","piety"],"ans":0,"expl":"The 2023 paper. Many students picked \"devotion\"."},{"id":"s4-77","n":77,"node":"nanak","tags":["beyond"],"q":"Before the Guru Gaddi passed to the Guru Granth Sahib, Sikhism was led by ________ human Gurus.","opts":["twelve","eleven","nine","ten"],"ans":3,"expl":"The 2023 paper."},{"id":"s4-78","n":78,"node":"khusraw","tags":["beyond"],"q":"Amir Khusraw was popularly known as ________.","opts":["Sher-e-Hind","Fakhr-e-Hind","Tuti-e-Hind","Kaisar-i-Hind"],"ans":2,"expl":"The 2023 paper: the Parrot of India."},{"id":"s4-79","n":79,"node":"urdu","tags":["beyond"],"q":"Urdu has historically been known by several names. Which of the following was never one of them?","opts":["Bhatiali","Hindavi","Dakkhani","Rekhta"],"ans":0,"expl":"The 2023 paper. Bhatiali is a Bengali boatmen's folk-song genre."},{"id":"s4-80","n":80,"node":"medieval_performance","tags":["beyond"],"q":"Literary texts written to complement performances came into vogue during ________ Indian literature.","opts":["contemporary","medieval","ancient","colonial"],"ans":1,"expl":"The 2023 paper."}]}]};

const Map_ = (() => {
  const svg = $("#mapsvg"), vp = $("#vp"), stage = $("#stage"), tip = $("#tip");
  const [bx0, by0, bx1, by1] = D.meta.bounds;

  const nodeEls = {}, edgeEls = [];
  D.clusters.forEach(c => {

    $("#g-wick").appendChild(sv("path", { d: `M${(cx / len * 64).toFixed(1)},${(cy / len * 64).toFixed(1)} L${(cx * .62).toFixed(1)},${(cy * .62).toFixed(1)}`, class: "wick" }));

  D.edges.forEach(e => {

    const d = e.cross ? `M${a.x},${a.y} Q${((a.x + b.x) / 4).toFixed(1)},${((a.y + b.y) / 4).toFixed(1)} ${b.x},${b.y}` : `M${a.x},${a.y} L${b.x},${b.y}`;
    const p = sv("path", { d, class: "edge " + (e.cross ? "cross" : "intra " + kc(a.c)) });
    $("#g-edge").appendChild(p); edgeEls.push(p);
  });
  const cid = D.cfg.center;
  const core = sv("g", { class: "core", tabindex: cid ? "0" : "-1", role: cid ? "button" : "img", "aria-label": cid ? NODE[cid].plain : D.cfg.title, "data-id": cid || "" });
  core.innerHTML = `<circle class="glow" r="130"/>${GLYPH}<text class="c1" y="80">${cid ? NODE[cid].label : D.cfg.title}</text>${D.cfg.caption ? `<text class="c2" y="97">${D.cfg.caption}</text>` : ""}`;
  $("#g-core").appendChild(core);
  if (cid) { nodeEls[cid] = core; core.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(cid); } }); }
  D.nodes.forEach(n => {

    const g = sv("g", { class: `node t${n.tier} v${n.vis} ${kc(n.c)}`, transform: `translate(${n.x},${n.y})`, tabindex: "0", role: "button", "aria-label": n.plain, "data-id": n.id });
    g.appendChild(sv("circle", { r }));
    const t = sv("text", { x: n.side > 0 ? r + 6 : -(r + 6), y: 4.2, "text-anchor": n.side > 0 ? "start" : "end" }); t.textContent = n.label; g.appendChild(t);
    $("#g-node").appendChild(g); nodeEls[n.id] = g;

    g.addEventListener("pointerenter", ev => { if (ev.pointerType !== "mouse") return; const k = n.refs.length; tip.innerHTML = `${n.title}${k ? ` <span style="opacity:.75">· ${k} question${k > 1 ? "s" : ""}</span>` : ""}`; tip.hidden = false; const rc = stage.getBoundingClientRect(); let x = ev.clientX - rc.left + 14; if (x > rc.width - 290) x -= 304; tip.style.left = x + "px"; tip.style.top = ev.clientY - rc.top + 14 + "px"; });

  D.clusters.forEach(c => { const b = el("button", { class: "chip k" + c.color, type: "button", title: c.desc }, `<span class="sw"></span>${c.name}`); b.addEventListener("click", () => zoomToCluster(c.id)); $("#legend").appendChild(b); });
  function apply() {

    svg.style.setProperty("--ls", Math.min(2.6, Math.max(1, 10.5 / (13.5 * T.k))).toFixed(3));

  const measure = () => { const r = svg.getBoundingClientRect(); W = r.width; H = r.height; };
  function fitView() { measure(); if (!W || !H) return null; const bw = bx1 - bx0, bh = by1 - by0, k = Math.min((W - 32) / bw, (H - 72) / bh); return { k, x: (W - bw * k) / 2 - bx0 * k, y: (H - bh * k) / 2 - by0 * k - 6 }; }
  function animateTo(t2, ms = 380) { if (reduceMotion) { T = t2; apply(); return; } const t1 = { ...T }, st = performance.now(); const step = now => { const p = Math.min(1, (now - st) / ms), e = 1 - Math.pow(1 - p, 3); T = { k: t1.k + (t2.k - t1.k) * e, x: t1.x + (t2.x - t1.x) * e, y: t1.y + (t2.y - t1.y) * e }; apply(); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }

  function zoomAt(f, cx, cy) { const k2 = Math.max(0.15, Math.min(3.2, T.k * f)), r = k2 / T.k; T = { k: k2, x: cx - (cx - T.x) * r, y: cy - (cy - T.y) * r }; apply(); }
  function centerOn(x, y, k) { measure(); animateTo({ k, x: W / 2 - x * k, y: H / 2 - y * k }); }
  function zoomToCluster(id) { const ns = D.nodes.filter(n => n.c === id && n.id !== cid); const xs = ns.map(n => n.x), ys = ns.map(n => n.y); const x0 = Math.min(...xs) - 60, x1 = Math.max(...xs) + 160, y0 = Math.min(...ys) - 50, y1 = Math.max(...ys) + 50; measure(); centerOn((x0 + x1) / 2, (y0 + y1) / 2 + 10, Math.min(1.35, Math.max(0.8, Math.min(W / (x1 - x0), (H - 90) / (y1 - y0))))); }
  const pts = new Map(); let moved = false, start = null, pinch = null, downOn = null, captured = false;
  const hint = $(".map-hint"); const hideHint = () => { if (hint) hint.hidden = true; };
  svg.addEventListener("wheel", ev => { ev.preventDefault(); hideHint(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0016)), ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
  svg.addEventListener("pointerdown", ev => {

    const hit = ev.target.closest && ev.target.closest(".node, .core");
    downOn = pts.size === 1 && hit && hit.dataset.id ? hit.dataset.id : null;
    moved = false; captured = false; start = { x: ev.clientX, y: ev.clientY, T: { ...T } };

  });

    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()], k2 = Math.max(0.15, Math.min(3.2, pinch.T.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)), f = k2 / pinch.T.k, cx = pinch.cx - rc.left, cy = pinch.cy - rc.top; T = { k: k2, x: cx - (cx - pinch.T.x) * f, y: cy - (cy - pinch.T.y) * f }; apply(); moved = true; return; }

  });
  const end = ev => {
    if (ev.type === "pointerup" && pts.size === 1 && pts.has(ev.pointerId) && !moved) select(downOn, !!downOn && T.k < 0.64);

  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  $("#z-in").onclick = () => { measure(); zoomAt(1.3, W / 2, H / 2); };
  $("#z-out").onclick = () => { measure(); zoomAt(1 / 1.3, W / 2, H / 2); };
  $("#z-fit").onclick = () => { select(null); fit(true); };
  function select(id, center) {
    Object.values(nodeEls).forEach(g => g.classList.remove("sel", "nb")); edgeEls.forEach(p => p.classList.remove("on"));
    selected = id; svg.classList.toggle("has-sel", !!id);

      nodeEls[id] && nodeEls[id].classList.add("sel");
      ADJ[id].forEach(a => { nodeEls[a.id] && nodeEls[a.id].classList.add("nb"); edgeEls[a.i].classList.add("on"); });

  }
  function resize() { if (!fitted || !selected) fit(false); }
  window.addEventListener("resize", () => { if ($("#v-map").hidden || selected) return; clearTimeout(resize.t); resize.t = setTimeout(() => fit(false), 120); });
  const q = $("#map-q"), sug = $("#map-sug"); let hl = 0, hits = [];
  const norm = s => s.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "");
  const index = D.nodes.map(n => ({ n, t: norm(n.plain + " " + n.label), f: norm(n.facts.map(f => plain(f.h)).join(" ")) }));
  function search(s) { s = norm(s.trim()); if (!s) return []; const terms = s.split(/\s+/); return index.map(x => { let sc = 0; for (const t of terms) { if (x.t.includes(t)) sc += 10; else if (x.f.includes(t)) sc += 1; else return null; } return { n: x.n, sc }; }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 8).map(x => x.n); }
  function drawSug() { sug.innerHTML = ""; if (!hits.length) { sug.hidden = true; return; } hits.forEach((n, i) => { const b = el("button", { type: "button", class: (i === hl ? "hl " : "") + kc(n.c) }, `<span class="sw"></span><span>${n.title}</span>`); b.addEventListener("mousedown", ev => { ev.preventDefault(); pick(n); }); sug.appendChild(b); }); sug.hidden = false; }
  function pick(n) { sug.hidden = true; q.value = n.plain; select(n.id, true); q.blur(); }
  q.addEventListener("input", () => { hits = search(q.value); hl = 0; drawSug(); });
  q.addEventListener("keydown", ev => { if (ev.key === "ArrowDown") { hl = Math.min(hits.length - 1, hl + 1); drawSug(); ev.preventDefault(); } else if (ev.key === "ArrowUp") { hl = Math.max(0, hl - 1); drawSug(); ev.preventDefault(); } else if (ev.key === "Enter") { if (hits[hl]) pick(hits[hl]); ev.preventDefault(); } else if (ev.key === "Escape") sug.hidden = true; });
  q.addEventListener("blur", () => setTimeout(() => sug.hidden = true, 120));

})();

function Panel(id) {

    const cap = D.cfg.caption ? D.cfg.caption[0].toUpperCase() + D.cfg.caption.slice(1) : "Start anywhere";

      <div class="howto">${D.cfg.howto ? `<p>${D.cfg.howto}</p>` : ""}<p>Each coloured cluster is one part of the topic, and lines join related ideas. The lines that cross the middle link ideas from different parts. Click any dot, or search, to read its facts, what it links to, and the questions that test it.</p></div>
      <div class="sect"><div class="sect-h">Clusters</div><ul class="links">${D.clusters.map(c => `<li class="k${c.color}"><span class="sw"></span><span><b>${c.name}</b> <span class="why">· ${c.kicker ? c.kicker + " · " : ""}${D.nodes.filter(n => n.c === c.id).length} ideas${c.desc ? " · " + c.desc : ""}</span></span></li>`).join("")}</ul></div>

  const qs = n.refs.map(r => { const q = SET[r.s].qs[r.n - 1]; return `<details><summary><span class="where">${refLabel(r)}</span>${q.q}</summary><div class="ans">Answer: <b>${q.opts[q.ans]}</b> <button class="linkbtn" type="button" data-go="${refAttr(r)}">open</button></div></details>`; }).join("");
  p.innerHTML = `<div class="p-eyebrow"><span class="sw"></span>${CL[n.c].kicker ? CL[n.c].kicker + " · " : ""}${CL[n.c].name}</div><h2>${n.title}</h2>
    <ul class="facts">${n.facts.map(f => `<li>${f.h}${f.tags.map(tagChip).join("")}</li>`).join("")}</ul>

    ${qs ? `<div class="sect"><div class="sect-h">Questions on this (${n.refs.length})</div><div class="qlist">${qs}</div></div>` : ""}
    <div class="panel-actions"><button class="btn" type="button" data-go="atlas|${id}">Open in the atlas</button></div>`;

const Atlas = (() => {
  let built = false; const cards = {}, active = new Set(); let filter = () => {};
  function build() {

    const list = $("#atlas-list"), toc = $("#toc"), chips = $("#atlas-chips");
    const all = el("button", { class: "chip", type: "button", "aria-pressed": "true" }, "All"); chips.appendChild(all);
    const usedTags = new Set(D.nodes.flatMap(n => n.facts.flatMap(f => f.tags)));
    const tagSel = el("select", { id: "atlas-tag", "aria-label": "Show only facts with a tag", class: "btn" }, `<option value="">All facts</option>${[...usedTags].map(t => `<option value="${t}">Only facts tagged “${D.cfg.tags[t].label}”</option>`).join("")}`);
    if (usedTags.size) $("#atlas-tagsw").appendChild(tagSel);
    D.clusters.forEach(c => {
      const ns = D.nodes.filter(n => n.c === c.id);
      const sec = el("section", { class: "csec k" + c.color, id: "sec-" + c.id }, `<div class="csec-h"><h2>${c.name}</h2><span class="d">${[c.kicker, c.desc, ns.length + " ideas"].filter(Boolean).join(" · ")}</span></div>`);
      const grid = el("div", { class: "cards" });
      ns.forEach(n => {
        const card = el("article", { class: "card " + kc(n.c), id: "card-" + n.id });
        const links = ADJ[n.id].map(a => { const o = NODE[a.id]; return `<button class="lchip ${kc(o.c)}" type="button" data-go="atlas|${o.id}" title="${plain(why(n, a)).replace(/"/g, "&quot;")}"><span class="sw"></span>${o.label}</button>`; }).join("");
        const qc = n.refs.map(r => `<button class="qchip" type="button" data-go="${refAttr(r)}">${refLabel(r)}</button>`).join("");
        card.innerHTML = `<div class="card-h"><div class="tt"><span class="sw"></span><h3>${n.title}</h3></div></div>
          <ul class="facts">${n.facts.map(f => `<li data-tags="${f.tags.join(" ")}">${f.h}${f.tags.map(tagChip).join("")}</li>`).join("")}</ul>
          ${links ? `<div class="row"><span class="lbl">Links</span>${links}</div>` : ""}${qc ? `<div class="row"><span class="lbl">Tested</span>${qc}</div>` : ""}
          <div class="row"><button class="linkbtn" type="button" data-go="map|${n.id}">Show on the map</button></div>`;
        cards[n.id] = { card, text: plain(card.querySelector(".card-h").innerHTML + " " + card.querySelector(".facts").innerHTML).toLowerCase(), facts: $$(".facts li", card).map(li => ({ li, h: li.innerHTML })) };
        grid.appendChild(card);
      });
      sec.appendChild(grid); list.appendChild(sec);
      toc.appendChild(el("div", { class: "tc k" + c.color }, c.name));
      ns.forEach(n => toc.appendChild(el("a", { href: "#", "data-go": "atlas|" + n.id }, n.label)));
      const ch = el("button", { class: "chip k" + c.color, type: "button", "aria-pressed": "false", "data-c": c.id }, `<span class="sw"></span>${c.name}`);

    });

    const q = $("#atlas-q"), esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      D.clusters.forEach(c => { let any = false;
        D.nodes.filter(n => n.c === c.id).forEach(n => { const x = cards[n.id]; let ok = (!active.size || active.has(c.id)) && terms.every(t => x.text.includes(t)), anyF = false;
          x.facts.forEach(f => { const v = !tg || f.li.dataset.tags.split(" ").includes(tg); f.li.hidden = !v; if (v) anyF = true; f.li.innerHTML = mark(f.h, terms); });
          if (!anyF) ok = false; x.card.hidden = !ok; if (ok) { any = true; shown++; } });

function renderSheets() {
  const root = $("#sheets"), nav = $("#sheet-nav");
  const mapBtn = node => node ? `<button class="linkbtn" type="button" data-go="map|${node}" style="font-size:12.5px;font-weight:500">map</button>` : "";
  D.sheets.forEach((s, i) => {
    let body = "";
    if (s.style === "groups") body = `<div class="grid2">${s.groups.map(g => `<div class="tcard"><h3><span>${g.title}</span>${mapBtn(g.node)}</h3><ul class="tl">${g.rows.map(r => `<li><span class="a">${r.a}</span><span>${r.b} ${mapBtn(r.node)}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
    else if (s.style === "cards") body = `<div class="grid2">${s.rows.map(r => `<div class="tcard"><h3><span>${r.a}</span>${mapBtn(r.node)}</h3><div>${r.b}</div></div>`).join("")}</div>`;
    else body = `<div class="table-wrap"><table class="tbl"><tbody>${s.rows.map(r => `<tr><td>${r.a}</td><td>${r.b}</td><td style="width:44px">${mapBtn(r.node)}</td></tr>`).join("")}</tbody></table></div>`;
    nav.appendChild(el("button", { class: "chip", type: "button", "data-jump": i }, s.title));
    root.appendChild(el("section", { class: "tsec", id: "ts-" + i }, `<h2>${s.title}</h2>${s.lede ? `<p class="lede">${s.lede}</p>` : ""}${body}`));
  });
  nav.addEventListener("click", ev => { const b = ev.target.closest("[data-jump]"); if (b) $("#ts-" + b.dataset.jump).scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }); });
}

// questions: answers shown by default, the way an attempt review shows them
function qCard(q, num) {
  const art = el("article", { class: "q", id: "q-" + q.id });
  art.innerHTML = `<div class="q-info"><span class="q-num">Question <b>${num}</b></span><span class="q-state"></span>${q.tags.length ? `<span>${q.tags.map(tagChip).join("")}</span>` : ""}</div>
    <div class="q-body"><p class="q-stem">${q.q}</p><fieldset class="opts"><legend class="sr-only">Options for question ${num}</legend>
    ${q.opts.map((o, i) => `<label class="opt"><input type="radio" name="${q.id}" value="${i}"><span class="letter">${"abcdef"[i]}.</span><span class="otext">${o}</span></label>`).join("")}
    </fieldset><div class="fb" hidden></div></div>`;
  return art;
}
function reveal(art, q, chosen, read) {
  art.classList.add("locked"); $$("input", art).forEach(i => i.disabled = true);
  $$(".opt", art).forEach((o, i) => { o.classList.toggle("is-correct", i === q.ans); o.classList.toggle("is-wrong", i === chosen && chosen !== q.ans); });
  if (chosen != null) $$("input", art)[chosen].checked = true;
  const ok = chosen === q.ans; art.classList.toggle("correct", !read && ok); art.classList.toggle("wrong", !read && chosen != null && !ok);
  $(".q-state", art).textContent = read ? "Answer shown" : ok ? "Correct" : "Incorrect";
  const n = NODE[q.node], fb = $(".fb", art);
  fb.innerHTML = `${read ? "" : `<span class="verdict ${ok ? "ok" : "no"}">Your answer is ${ok ? "correct" : "incorrect"}.</span>`}<p>The correct answer is: <b>${q.opts[q.ans]}</b></p>${q.expl ? `<p>${q.expl}</p>` : ""}
    <div class="see ${kc(n.c)}">On the map: <button class="linkbtn" type="button" data-go="map|${n.id}">${n.title}</button></div>`;
  fb.hidden = false;
}
function unreveal(art) { art.classList.remove("locked", "correct", "wrong"); $$("input", art).forEach(i => { i.disabled = false; i.checked = false; }); $$(".opt", art).forEach(o => o.classList.remove("is-correct", "is-wrong")); $(".q-state", art).textContent = "Not yet answered"; const fb = $(".fb", art); fb.hidden = true; fb.innerHTML = ""; }
const Qs = (() => {
  let built = false, cur = null, tagF = "", mode = false, arts = {}; let answers = store.get("answers", {});
  function build() {
    if (built || !D.sets.length) return; built = true;
    cur = store.get("set", D.sets[0].key); if (!SET[cur]) cur = D.sets[0].key;
    const pick = $("#set-pick"); pick.hidden = D.sets.length < 2;
    D.sets.forEach(s => { const b = el("button", { type: "button", "aria-pressed": String(s.key === cur), "data-k": s.key }, s.name); b.addEventListener("click", () => choose(s.key)); pick.appendChild(b); });
    mode = store.get("mode", false); $("#set-test").checked = mode;
    $("#set-test").addEventListener("change", e => { mode = e.target.checked; store.set("mode", mode); apply(); });
    $("#set-reset").addEventListener("click", () => { SET[cur].qs.forEach(q => delete answers[q.id]); store.set("answers", answers); apply(); });
    render();
  }
  function choose(k) { cur = k; store.set("set", k); $$("#set-pick button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k))); tagF = ""; render(); }
  function render() {
    const s = SET[cur], list = $("#set-list"); list.innerHTML = ""; arts = {};
    $("#set-title").textContent = s.name; $("#set-desc").innerHTML = s.desc || `${s.qs.length} questions with answers.`;
    const tags = [...new Set(s.qs.flatMap(q => q.tags))], seg = $("#set-filter"); seg.innerHTML = ""; seg.hidden = !tags.length;
    [["", `All ${s.qs.length}`], ...tags.map(t => [t, `${D.cfg.tags[t].label} ${s.qs.filter(q => q.tags.includes(t)).length}`])].forEach(([t, l]) => { const b = el("button", { type: "button", "aria-pressed": String(t === tagF) }, l); b.addEventListener("click", () => { tagF = t; $$("button", seg).forEach(x => x.setAttribute("aria-pressed", String(x === b))); apply(); }); seg.appendChild(b); });
    s.qs.forEach((q, i) => { const a = qCard(q, i + 1); arts[q.id] = a; list.appendChild(a); $$("input", a).forEach(inp => inp.addEventListener("change", () => { if (!mode) return; answers[q.id] = +inp.value; store.set("answers", answers); reveal(a, q, +inp.value); score(); })); });
    $("#set-key").innerHTML = s.qs.map((q, i) => `<span>${i + 1}. <b>${"abcdef"[q.ans]}</b></span>`).join("");
    apply();
  }
  const passes = q => !tagF || q.tags.includes(tagF);
  function apply() { SET[cur].qs.forEach(q => { const a = arts[q.id]; a.hidden = !passes(q); if (!mode) reveal(a, q, null, true); else if (answers[q.id] != null) reveal(a, q, answers[q.id]); else unreveal(a); }); $("#set-reset").hidden = !mode; $("#set-keywrap").hidden = mode; score(); }
  function score() { if (!mode) { $("#set-score").textContent = ""; return; } const v = SET[cur].qs.filter(passes), d = v.filter(q => answers[q.id] != null), ok = d.filter(q => answers[q.id] === q.ans); $("#set-score").textContent = `${ok.length} correct of ${d.length} answered · ${v.length - d.length} to go`; }
  function revealQ(k, id) { build(); if (k !== cur) choose(k); const a = arts[id]; if (!a) return; if (a.hidden) { tagF = ""; render(); } requestAnimationFrame(() => { const b = arts[id]; b.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }); b.style.animation = "flash 1.6s ease-out"; setTimeout(() => b.style.animation = "", 1700); }); }
  return { build, reveal: revealQ };
})();

function boot() { const h = (location.hash || "").slice(1); show(VIEWS.includes(h) ? h : store.get("view", "map"), { noHash: true }); Map_.fit(false); Panel(null); }
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h)) show(h); });
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$("#v-map").hidden && !Map_.selected) Map_.fit(false); });
})();
</script>
