\"), by Vyasa; then Bharata by Vaisampayana; then Mahabharata by Sauti."},{"id":"s1-32","n":32,"node":"earliest_langs","tags":["2023","2024"],"q":"The earliest writing in India was in ________.","opts":["Sanskrit, Pali, Prakrit, Tamil and Kannada","Sanskrit, Pali, Prakrit, Tamil and Gujari","Sanskrit, Pali, Prakrit, Tamil and Telugu","Sanskrit, Pali, Prakrit, Tamil and Apabhramsa"],"ans":0,"expl":"The five earliest languages end with Kannada."},{"id":"s1-33","n":33,"node":"fables","tags":["2023","2024"],"q":"Visnusarma's Panchatantra falls under the category of ________.","opts":["Gadyakavya","Fable","Mahakavya","Prasasti"],"ans":1,"expl":"Panchatantra (Vishnusharma) and Kathasaritsagara (Somadeva) are the most popular fables."},{"id":"s1-34","n":34,"node":"samhitas","tags":["2023","2024"],"q":"The Vedic collections of hymns, prayers, benedictions, sacrificial formulae, and litanies are called ________.","opts":["Upanishads","Samhitas","Aranyakas","Brahmanas"],"ans":1,"expl":"Samhita means collection, \"joined together\"."},{"id":"s1-35","n":35,"node":"requirements","tags":["2023","2024"],"q":"Which of the following comparisons does not qualify as an instance of doing comparative literature studies?","opts":["Modern Bengali novel and modern Bengali short story","Spanish novel and German novel","Hindi film and Hindi short story","Classical Sanskrit drama and contemporary Gujarati drama"],"ans":0,"expl":"Same language, same period, same art form: nothing is crossed. The others cross language, art form, or time and language."},{"id":"s1-36","n":36,"node":"kamban_intro","tags":["2023","2024"],"q":"Which of the following is not regarded as a text from the classical Tamil period?","opts":["Kamban's Ramavataram","Tiruvalluvar's Tirukkural","Ilango Adigal's Cilappatikaram","Chithalai Chathanar's Manimekalai"],"ans":0,"expl":"Kamban wrote around the 12th century. The 2024 paper asks the same question as \"the ancient period of Tamil literature\"."},{"id":"s1-37","n":37,"node":"natyashastra","tags":["2023","2024"],"q":"Natyashastra, the classical Sanskrit theoretical text on the performing arts, was written by ________.","opts":["Bharata","Bhasa","Visakhadatta","Kalidasa"],"ans":0,"expl":"Bharata, 1st century BC to 1st century AD."},{"id":"s1-38","n":38,"node":"vedas","tags":["2023","2024"],"q":"The oldest of the vedas is the ________.","opts":["Sama Veda","Atharva Veda","Yajur Veda","Rig Veda"],"ans":3,"expl":"The Rigveda is the earliest known work of its kind."},{"id":"s1-39","n":39,"node":"translation","tags":["2023","2024"],"q":"Translation plays an important role in comparative study because translation helps us to uncover ________.","opts":["How texts remain the same and how they undergo change","Both the options are correct","Both the options are wrong","How texts relate to each other and how they differ"],"ans":1,"expl":"Course aim 6 covers both."},{"id":"s1-40","n":40,"node":"akam_puram","tags":["2023","2024"],"q":"The two major forms of literature as per Tamil Sangam poetics are ________.","opts":["'Puram' and 'Corkkam'","'Cankam' and 'Puram'","'Akam' and 'Puram'","'Akam' and 'Cankam'"],"ans":2,"expl":"Akam (love, the interior) and puram (war, the outer world)."},{"id":"s1-41","n":41,"node":"meghaduta","tags":["2023","2024"],"q":"In his Meghaduta or Cloud Messenger, Kalidasa lavishly describes the cities of ________ and ________ that the monsoon clouds will pass through in their long journey from the Vindhyas to the Himalayas.","opts":["Nashik; Haridwar","Vidisha; Ujjain","Ujjain; Nashik","Vidisha; Haridwar"],"ans":1,"expl":"Not in your notes. The 2024 paper asked for one city: Ujjain (distractors Haridwar, Banaras, Nashik)."},{"id":"s1-42","n":42,"node":"khusraw","tags":["2023"],"q":"The musical instruments that Amir Khusraw is given credit for having introduced to India are ________.","opts":["Sarangi and bansuri","Pakhawaj and mridangam","Sitar and tabla","Sarod and santoor"],"ans":2,"expl":"Not in your notes. Sitar and tabla."},{"id":"s1-43","n":43,"node":"urdu","tags":["2023"],"q":"The Urdu language has historically been known by various names but never by the name of ________.","opts":["Bhatiali","Rekhta","Dakkhani","Hindavi"],"ans":0,"expl":"Not in your notes. Bhatiali is a Bengali boatmen's folk-song genre."},{"id":"s1-44","n":44,"node":"khusraw","tags":["2023"],"q":"Amir Khusraw was popularly known as ________.","opts":["Tuti-e-Hind","Sher-e-Hind","Fakhr-e-Hind","Kaisar-i-Hind"],"ans":0,"expl":"Not in your notes. Tuti-e-Hind, the Parrot of India."},{"id":"s1-45","n":45,"node":"urdu","tags":["2023"],"q":"Urdu, Arabic and Persian gave to Indian literature the literary trope and form of the ________.","opts":["Rubai","Qasida","All of the above","Ghazal"],"ans":2,"expl":"Not in your notes. Ghazal, qasida and rubai."},{"id":"s1-46","n":46,"node":"bhakti","tags":["2023"],"q":"The term 'Bhakti' in the Tamil language quite literally stands for ________.","opts":["Consecration","Devotion","Eating God","Piety"],"ans":2,"expl":"Not in your notes. The course key says \"eating God\"; \"devotion\" is the trap."},{"id":"s1-47","n":47,"node":"bhakti","tags":["2023"],"q":"Who among the following is not a Bhakti poet?","opts":["Andal","Valmiki","Lal Ded","Tukaram"],"ans":1,"expl":"Andal (Tamil), Lal Ded (Kashmiri) and Tukaram (Marathi) are Bhakti poets. Valmiki is the Adikavi."},{"id":"s1-48","n":48,"node":"bhakti","tags":["2023"],"q":"Like many other Bhakti saint-poets of the medieval period, Kabir came from the working class and he was by profession a ________.","opts":["Boatman","Cobbler","Weaver","Carpenter"],"ans":2,"expl":"Not in your notes. A weaver."},{"id":"s1-49","n":49,"node":"bhakti","tags":["2023"],"q":"The songs of some of the Bhakti saint-poets made their way into the ________.","opts":["Dhammapada","Quran","Bible","Guru Granth Sahib"],"ans":3,"expl":"Not in your notes. The Guru Granth Sahib."},{"id":"s1-50","n":50,"node":"nanak","tags":["2023"],"q":"Guru Nanak had a mystical experience when he was ________ years of age.","opts":["30","20","10","40"],"ans":0,"expl":"Not in your notes. Thirty."},{"id":"s1-51","n":51,"node":"urdu","tags":["2023"],"q":"The language of the common folk in Delhi and its surrounding areas during the late medieval times is known as ________.","opts":["Khariboli","Awadhi","Nastaliq","Dakkhani"],"ans":0,"expl":"Not in your notes. Nastaliq is a script, not a language."},{"id":"s1-52","n":52,"node":"nanak","tags":["2023"],"q":"In Sikhism, there is a powerful fusion of the ________ and ________ philosophies.","opts":["Bhakti; Sufi","Hindu; Buddhist","Sufi; Baul","Saiva; Vaishnava"],"ans":0,"expl":"Not in your notes. Bhakti and Sufi."},{"id":"s1-53","n":53,"node":"sufism","tags":["2023"],"q":"Who among the following is not regarded as a Sufi thinker?","opts":["Amir Khusraw","Bullhe Shah","Shah Qalandar","Javed Akhtar"],"ans":3,"expl":"Not in your notes. Javed Akhtar is a modern screenwriter and lyricist."},{"id":"s1-54","n":54,"node":"nanak","tags":["2023"],"q":"Before the Guru Gaddi (Seat of the Guru) was passed on to the holy scripture Guru Granth Sahib, Sikhism was led by ________ human gurus or spiritual masters.","opts":["9","10","12","11"],"ans":1,"expl":"Not in your notes. Ten."},{"id":"s1-55","n":55,"node":"bhakti","tags":["2023"],"q":"The Bhakti movement spread across India by travelling through the following regional route:","opts":["South-North-East-West","South-North-West-East","South-West-North-East","South-East-North-West"],"ans":2,"expl":"Not in your notes. It began in the Tamil south."},{"id":"s1-56","n":56,"node":"sufism","tags":["2023"],"q":"Sufism derives from the Arabic term for a mystic, sufi, which is in turn derived from 'suf', plausibly a reference to the ________ of early Islamic ascetics.","opts":["Yellow silk sash","Green cotton headgear","White muslin raiment","Blue woollen garment"],"ans":3,"expl":"Not in your notes. Suf = wool."},{"id":"s1-57","n":57,"node":"literary_epics","tags":["2023"],"q":"In the Western context, which one of the following is not considered a traditional epic?","opts":["Paradise Lost","Iliad","Beowulf","Odyssey"],"ans":0,"expl":"Paradise Lost is a literary epic imitating Virgil's Aeneid."},{"id":"s1-58","n":58,"node":"sufism","tags":["2023"],"q":"Which of the following is not one of the pillars of Sufism?","opts":["Hajj","Ishraq","Iman","Ihsan"],"ans":0,"expl":"Not in your notes. Hajj is a pillar of Islam."},{"id":"s1-59","n":59,"node":"medieval_performance","tags":["2023"],"q":"Literary texts that were written to complement performances came into vogue during the following period of Indian literature:","opts":["Contemporary Indian literature","Ancient Indian literature","Indian literature under colonial rule","Medieval Indian literature"],"ans":3,"expl":"Not in your notes. The medieval period, 1000–1800."},{"id":"s1-60","n":60,"node":"khusraw","tags":["2023"],"q":"Amir Khusraw was the spiritual disciple of ________.","opts":["Fariduddin Ganjshakar","Khwaja Moinuddin Chishti","Hazrat Nizamuddin Auliya","Qutbuddin Bakhtiar Kaki"],"ans":2,"expl":"Not in your notes. Nizamuddin Auliya of Delhi."},{"id":"s1-61","n":61,"node":"tinais","tags":["2024"],"q":"tinai is a concept associated with ________ poetics.","opts":["Sanskrit","Telugu","Tamil","Kannada"],"ans":2,"expl":"Tamil Sangam poetics: the five landscapes of love."},{"id":"s1-62","n":62,"node":"tinais","tags":["2024"],"q":"There are a total of ________ tinais.","opts":["6","7","5","4"],"ans":2,"expl":"Kurinci, Neytal, Palai, Mullai, Marutam."},{"id":"s1-63","n":63,"node":"cilappatikaram","tags":["2024"],"q":"Who among the following is commonly known as \"the venerable ascetic prince\"?","opts":["Veeraraghavachariar","Cenkuttuvan","Ilanko Atikal","Cittalaic Cattanar"],"ans":2,"expl":"Not in your notes. Ilanko Atikal, author of the Cilappatikaram."},{"id":"s1-64","n":64,"node":"ashadh","tags":["2024"],"q":"In Mohan Rakesh's play Ashadh Ka Ek Din, the reason provided by the protagonist Kalidasa for not accepting the position of court poet at Ujjain was that ________.","opts":["His first priority was to restore his dilapidated house","He wished to take care of his maternal uncle Matul","He was sceptical of the artificial life at the royal court","He did not want to be uprooted from his natural surroundings"],"ans":3,"expl":"Not in your notes."},{"id":"s1-65","n":65,"node":"cilappatikaram","tags":["2024"],"q":"The Cilappatikaram is set in the three kingdoms of ________.","opts":["Cholas, Pantiyas, and Cerals","Pantiyas, Chalukyas, and Cerals","Cholas, Sinhalas, and Cerals","Cholas, Gangas, and Chalukyas"],"ans":0,"expl":"Not in your notes. The Chola, Pandya and Chera kingdoms."},{"id":"s1-66","n":66,"node":"cilappatikaram","tags":["2024"],"q":"The literary sequel to the Tamil epic Cilappatikaram is ________.","opts":["Tolkappiyam","Thirukural","Manimekalai","Ettuttokai"],"ans":2,"expl":"Your notes pair the two as the Tamil epics."},{"id":"s1-67","n":67,"node":"cilappatikaram","tags":["2024"],"q":"The ornament at the centre of the plot of Cilappatikaram is ________.","opts":["A waist chain","An earring","An anklet","A necklace"],"ans":2,"expl":"Not in your notes. \"Cilappatikaram\" means the tale of an anklet."},{"id":"s1-68","n":68,"node":"kannada","tags":["2024"],"q":"The earliest known literary work in Kannada is ________.","opts":["Rajasekharavilasa","Kavirajamargam","Lilavati","Vacanakavyas"],"ans":1,"expl":"Kavirajamargam, around 850 AD."},{"id":"s1-69","n":69,"node":"karna_kunti","tags":["2024"],"q":"In the dialogue between Karna and Kunti on the eve of the great battle of Kurukshetra that Rabindranath Tagore recreates for his contemporary audience, Tagore's treatment of the subject departs from the original epic in that it is more ________.","opts":["Feminist","Aristocratic","Psychological","Historical"],"ans":2,"expl":"Not in your notes. More psychological."},{"id":"s1-70","n":70,"node":"kalidasa","tags":["2024"],"q":"The text generally believed to have been written by Kalidasa in his youth is ________.","opts":["Malavikagnimitra","Ritusamhara","Vikramorvashi","Meghaduta"],"ans":1,"expl":"Not in your notes. The Ritusamhara."},{"id":"s1-71","n":71,"node":"kalidasa","tags":["2024"],"q":"Most scholars and critics believe that Kalidasa lived during the ________.","opts":["Shunga Empire","Sinhala Empire","Maurya Empire","Gupta Empire"],"ans":3,"expl":"Not in your notes. The Gupta Empire."},{"id":"s1-72","n":72,"node":"ashadh","tags":["2024"],"q":"Although Mohan Rakesh's play Ashadh Ka Ek Din borrows its title from Kalidasa's Meghaduta, scholars argue that the plot of Rakesh's play aligns more easily with Kalidasa's play ________.","opts":["Abhijanashakuntalam","Malavikagnimitra","Vikramorvashi","Raghuvamsha"],"ans":0,"expl":"Not in your notes. Abhijnanashakuntalam."},{"id":"s1-73","n":73,"node":"discovery","tags":["2024"],"q":"Identify the scholar whose name is not connected with Tamil Sangam Literature.","opts":["CW Thamotharampillai","AK Ramanujan","MS Swaminathan","UV Swaminatha Iyer"],"ans":2,"expl":"The other three rediscovered or translated the Sangam poems."},{"id":"s1-74","n":74,"node":"three_sangams","tags":["2024"],"q":"In ancient Tamil Nadu, there were ________ academies where poets congregated to debate &amp; authorize literary works.","opts":["3","4","5","2"],"ans":0,"expl":"Then-Madurai, Kapadapuram and Madurai."},{"id":"s1-75","n":75,"node":"ashadh","tags":["2024"],"q":"In Mohan Rakesh's play Ashadh Ka Ek Din, the protagonist Kalidasa gets married to a princess named ________.","opts":["Ambika","Shakuntala","Mallika","Priyangumanjari"],"ans":3,"expl":"Not in your notes. Priyangumanjari."},{"id":"s1-76","n":76,"node":"ashadh","tags":["2024"],"q":"In Mohan Rakesh's play Ashadh Ka Ek Din, the new name that the protagonist Kalidasa assumes after finding fame and glory in the royal court is ________.","opts":["Chandragupta","Samudragupta","Matrugupta","Kirtigupta"],"ans":2,"expl":"Not in your notes. Matrugupta."},{"id":"s1-77","n":77,"node":"ashadh","tags":["2024"],"q":"Mohan Rakesh was a pioneer of the ________ literary movement in Hindi literature.","opts":["Nayi Jawani","Nayi Kahani","Nayi Kavita","Naya Natak"],"ans":1,"expl":"Not in your notes. Nayi Kahani."},{"id":"s1-78","n":78,"node":"cilappatikaram","tags":["2024"],"q":"To the traditional categories of Tamil literary discourse, Ilanko Atikal introduced the new category ________.","opts":["Love/erotic","War/heroic","Transient/ephemeral","Mythic/allegory"],"ans":3,"expl":"Not in your notes. Love/erotic is akam and war/heroic is puram; the mythic/allegorical is the new category."},{"id":"s1-79","n":79,"node":"tinais","tags":["2024"],"q":"Which of the following is not one of the tinais?","opts":["Plateau","Mountain","Coast","Jungle"],"ans":0,"expl":"Mountain = Kurinci (hills), coast = Neytal (seashore), jungle = Mullai (forest). There is no plateau tinai."}]},{"key":"s2","name":"Set 1","desc":"80 new questions with answers.","qs":[{"id":"s2-01","n":1,"node":"complit","tags":[],"q":"Comparative literature, at its simplest, is the study of ________.","opts":["translations of foreign classics into a national language","the literature of one language across its whole history","literary theory as distinct from literary history","literatures in different languages, compared with one another"],"ans":3,"expl":"Part 1: literatures in different languages, compared with one another, either by genre or by theme and idea."},{"id":"s2-02","n":2,"node":"requirements","tags":[],"q":"Reading a Sanskrit text alongside a Hindi text is the course's example of comparison across ________.","opts":["religions","genres within one language","time","art forms"],"ans":2,"expl":"Comparison works across time: classical and medieval texts read alongside modern ones. Comparison across art forms means literature vs film."},{"id":"s2-03","n":3,"node":"evaluation","tags":[],"q":"In the course's evaluation scheme, the comprehensive exam carries ________ of the total.","opts":["50%","40%","30%","20%"],"ans":1,"expl":"Quiz 1 20%, Quiz 2 20%, in-class assignment 20%, comprehensive exam 40%."},{"id":"s2-04","n":4,"node":"method_discipline","tags":[],"q":"The recap at the start of the second lecture says comparative literature is not only a method but also a ________.","opts":["discipline","genre","movement","canon"],"ans":0,"expl":"Method and discipline: a tool for analysis and a field with its own theories, questions and approaches."},{"id":"s2-05","n":5,"node":"indira","tags":[],"q":"\"India is not just its land, mountains and rivers... India is a thought, India is an idea.\" These words were spoken in 1971 by ________.","opts":["Indira Gandhi","Rabindranath Tagore","Sarojini Naidu","Jawaharlal Nehru"],"ans":0,"expl":"Indira Gandhi, 1971: \"six lakh villages and towns... fifty-five crore children... India is an idea.\""},{"id":"s2-06","n":6,"node":"prasad","tags":[],"q":"In G. J. V. Prasad's \"Desperately Seeking India\", the speaker says that in Madras he is ________.","opts":["without a visa","an invader","an Aryan spy","an exploiting trader"],"ans":2,"expl":"Delhi: without a visa. Madras: an Aryan spy. Bombay: an invader. Assam: an exploiting trader."},{"id":"s2-07","n":7,"node":"ethnic","tags":[],"q":"Which of the following is NOT one of the five main ethnic groups of India listed on the slides?","opts":["Negritos","Parsis","Tibeto-Burmans","Austroasiatics"],"ans":1,"expl":"The five: Indo-Aryans, Dravidians, Tibeto-Burmans, Austroasiatics, Negritos. Parsis (Zoroastrians) are among the other communities."},{"id":"s2-08","n":8,"node":"language_atlas","tags":[],"q":"According to the language atlas of India, the country has ________ major writing systems.","opts":["400","5","22","14"],"ans":3,"expl":"Five families, fourteen scripts, twenty-two Eighth Schedule languages, four hundred spoken languages, thousands of dialects."},{"id":"s2-09","n":9,"node":"vocab","tags":[],"q":"A tract of native land, mostly rural or geographical areas, usually including the people who live there. This is how the slides define a ________.","opts":["state","nation","people","country"],"ans":3,"expl":"Country is the native land; nation is more abstract; state is the structure of power."},{"id":"s2-10","n":10,"node":"anderson","tags":[],"q":"Benedict Anderson says the nation is propped up by three pieces of modern apparatus: ________.","opts":["the newspaper, the novel and the theatre","the census, the map and the museum","the court, the market and the temple","the school, the army and the church"],"ans":1,"expl":"Anderson's imagined community rests on print-capitalism (newspapers and novels) and is propped up by the census, the map and the museum."},{"id":"s2-11","n":11,"node":"raj","tags":[],"q":"According to the lecture, the geographical and political idea of an Indian nation was a creation of ________.","opts":["the British Raj","the Mauryan empire","the Indian National Congress","the Mughal empire"],"ans":0,"expl":"Through Western education, scientific and social discoveries, print-capitalism and an Indian intelligentsia; museums, maps and the census made India concrete."},{"id":"s2-12","n":12,"node":"bankim","tags":[],"q":"In the passage from Bankimchandra Chatterjee, the narrator Kamalakanta sees his vision of the Mother after ________.","opts":["nearly drowning in the Ganges","fasting for three days","taking an overdose of opium","falling asleep in a temple"],"ans":2,"expl":"\"Why did I take this overdose of opium?\" He floats on the stream of time and sees the saptami idol of Durga: \"this was my mother, my country.\""},{"id":"s2-13","n":13,"node":"vande_mataram","tags":[],"q":"In Vande Mataram the Mother is at once Durga, Kamala and Speech, that is, ________.","opts":["Saraswati, Uma and Ganga","Durga, Lakshmi and Saraswati","Lakshmi, Sita and Radha","Durga, Kali and Parvati"],"ans":1,"expl":"Durga with ten weapons, Kamala (Lakshmi) at play in the lotuses, Speech (Saraswati) the giver of lore: power, wealth and learning."},{"id":"s2-14","n":14,"node":"iqbal","tags":[],"q":"\"Religion does not teach us to bear animosity among ourselves. We are of Hind, our homeland is Hindustan.\" These lines are from ________.","opts":["Bankimchandra Chatterjee's Vande Mataram","Subramania Bharati's \"Indian Republic\"","Muhammad Iqbal's Saare Jahan Se Achha","Rabindranath Tagore's Jana Gana Mana"],"ans":2,"expl":"Iqbal (1877–1938): nightingales and garden, the mountain as sentry, the caravan at the Ganges."},{"id":"s2-15","n":15,"node":"name_india","tags":[],"q":"Among the names for India listed on the slide, which one is the Chinese name?","opts":["Tianzhu","Indica","Al-Hind","Jambudvipa"],"ans":0,"expl":"Bharata, Bharatavarsha, Bharatam, Aryavarta, Jambudvipa, Indica, Al-Hind, Hindustan, Indostan, Mauryadesa, Himvarsha, and Tianzhu (Chinese)."},{"id":"s2-16","n":16,"node":"lang_culture","tags":[],"q":"The slide's equation for language reads: language = ________ = community.","opts":["identity","literature","culture","communication"],"ans":3,"expl":"Language = communication = community. Language is also a repository of culture."},{"id":"s2-17","n":17,"node":"why_write","tags":[],"q":"Which of the following is NOT one of the four reasons people write, according to the slides?","opts":["To share experience with an interested group","To keep records of significant experience","To win fame and patronage at court","For free individual expression"],"ans":2,"expl":"Record, share, express (good for mental and physical health), and a higher purpose."},{"id":"s2-18","n":18,"node":"folklore","tags":[],"q":"Which of the following is an example of nonverbal folklore?","opts":["Floor and wall designs","Ballads","Riddles","Lullabies"],"ans":0,"expl":"Nonverbal: dances, games, floor and wall designs, artefacts and toys, performing arts. Riddles, lullabies and ballads are verbal."},{"id":"s2-19","n":19,"node":"folk_songs","tags":[],"q":"Female-centred folk songs are marked by domestic motifs and ________.","opts":["heroism and adventure","praise of gods and demons","ribald humour","an alternative world view that questions traditions and hierarchies"],"ans":3,"expl":"Male-centred songs are about heroism and adventure; female-centred ones question traditions and hierarchies."},{"id":"s2-20","n":20,"node":"nilavilakku","tags":[],"q":"In K. M. George's Nilavilakku analogy, the oil stands for ________.","opts":["Indian Literature as a whole","the shared sources of Indian literatures","India as a nation","India's many languages"],"ans":1,"expl":"Lamp = India; oil = shared sources; wicks = languages; one light = Indian Literature."},{"id":"s2-21","n":21,"node":"against_plural","tags":[],"q":"\"European literature\" and \"Latin American literature\" are cited as examples of ________.","opts":["literatures defined only by language","literatures without a written tradition","many languages, one literature","one language, many literatures"],"ans":2,"expl":"An argument for the singular. The reverse, one language with many literatures, is Spanish or English."},{"id":"s2-22","n":22,"node":"commonality","tags":[],"q":"Most Indian writers are bilingual if not multilingual, \"from Kabir to ________\".","opts":["Kamban","A. K. Ramanujan","Amir Khusraw","Rabindranath Tagore"],"ans":1,"expl":"From Kabir to A. K. Ramanujan: the same Ramanujan who translated the Sangam poems."},{"id":"s2-23","n":23,"node":"sahitya_akademi","tags":[],"q":"The Sahitya Akademi was formally inaugurated by the Government of India on ________.","opts":["15 August 1947","12 March 1964","26 January 1950","12 March 1954"],"ans":3,"expl":"12 March 1954: India's National Academy of Letters."},{"id":"s2-24","n":24,"node":"perception_reality","tags":[],"q":"According to the slides, the only Indian language with a continuous literary tradition is ________.","opts":["Tamil","Sanskrit","Kannada","Bengali"],"ans":0,"expl":"Tamil. Its early grammar, the Tolkappiyam, recognises Sanskrit as its only literary equal and competitor."},{"id":"s2-25","n":25,"node":"unity_diversity","tags":[],"q":"The points of convergence in Indian literature are described as thematic, generic and ________.","opts":["religious","regional","ideological","linguistic"],"ans":2,"expl":"Thematic, generic and ideological, and rarely confined to one language or region."},{"id":"s2-26","n":26,"node":"why_cil","tags":[],"q":"The course calls itself Comparative Indian Literature because the comparative route ________.","opts":["does not take commonality and cultural continuity for granted","All the options are correct","None of the options is correct","acknowledges the differences that exist in India","covers both the differences and the commonalities"],"ans":1,"expl":"All three statements are on the slide."},{"id":"s2-27","n":27,"node":"four_periods","tags":[],"q":"Medieval Indian literature is dated to ________.","opts":["1000 AD to 1800 AD","2000 BC to 1000 AD","1800 AD to 1947","600 AD to 1500 AD"],"ans":0,"expl":"Ancient 2000 BC–1000 AD, Medieval 1000–1800, Colonial 1800–1947, Contemporary 1947 onwards."},{"id":"s2-28","n":28,"node":"sruti","tags":[],"q":"Scholars tentatively think the Vedic Age lasted until about ________.","opts":["600 BC","200 AD","2000 BC","1200 BC"],"ans":3,"expl":"The Vedic Age, the earliest period of Sanskrit literature, lasted until about 1200 BC."},{"id":"s2-29","n":29,"node":"vedas","tags":[],"q":"Which of the following is NOT one of the four Vedas?","opts":["Atharva Veda","Yajur Veda","Sama Veda","Ayur Veda"],"ans":3,"expl":"The four are the Rig, Yajur, Sama and Atharva."},{"id":"s2-30","n":30,"node":"samhitas","tags":[],"q":"The word Samhita literally means ________.","opts":["sitting near","that which is heard","joined together","thread"],"ans":2,"expl":"Samhita = collection, \"joined together\". Sruti = heard; Upanishad = sitting near; sutra = thread."},{"id":"s2-31","n":31,"node":"aranyakas","tags":[],"q":"There are ________ Brahmanas and ________ Aranyakas.","opts":["three; eleven","eleven; three","eleven; thirteen","thirteen; eleven"],"ans":1,"expl":"Eleven Brahmanas, three Aranyakas, thirteen principal Upanishads."},{"id":"s2-32","n":32,"node":"upanishads","tags":[],"q":"The word Upanishad means ________.","opts":["sitting down, with devotion, near the teacher to receive instruction","that which is remembered","the teaching of the forest","the end of the sacrifice"],"ans":0,"expl":"Sitting near the teacher. Yajnavalkya's \"Come, sit near me\" plays on it."},{"id":"s2-33","n":33,"node":"vedangas","tags":[],"q":"Among the six Vedangas, nirukta deals with ________.","opts":["metre","etymology","phonetics","astronomy"],"ans":1,"expl":"Siksha phonetics, chandas metre, vyakarana grammar, nirukta etymology, jyotisha astronomy, kalpa ritual."},{"id":"s2-34","n":34,"node":"smriti","tags":[],"q":"Smriti marks a break from the earlier Vedic tradition because it is ________.","opts":["concerned only with ritual","written in Prakrit","attributed to human authors","sung rather than recited"],"ans":2,"expl":"Sruti is revealed and divine; Smriti is remembered and human-made."},{"id":"s2-35","n":35,"node":"sanskrit_drama","tags":[],"q":"Sanskrit plays of the time began and ended with ________.","opts":["a benediction for universal peace and prosperity","a recital of the four goals of life","an invocation to the muse","a prayer to the patron king"],"ans":0,"expl":"They began and ended with a benediction for universal peace and prosperity."},{"id":"s2-36","n":36,"node":"dramatists","tags":[],"q":"Which Sanskrit dramatist is known for plays about political intrigue and royal court life?","opts":["Kalidasa","Bhasa","Sudraka","Visakhadatta"],"ans":3,"expl":"Bhasa and Kalidasa: romances and heroic plays. Sudraka: social comedy. Visakhadatta: political intrigue."},{"id":"s2-37","n":37,"node":"verse_prose_forms","tags":[],"q":"In Sanskrit literature, a campu is ________.","opts":["an invented story about a historical character","a literary prose romance","a eulogy of the ruling king","a work in mixed prose and verse"],"ans":3,"expl":"Campu = mixed prose and verse; prasasti = eulogy; gadyakavya = prose romance; akhyayika = invented story about historical characters."},{"id":"s2-38","n":38,"node":"brahmanas","tags":[],"q":"\"The Brahmanas were meant for study in the seclusion of the forest, whereas the Aranyakas were studied while carrying on with daily life in the larger community.\"","opts":["Only true about the Brahmanas","The whole statement is false","Only true about the Aranyakas","The whole statement is true"],"ans":1,"expl":"It is reversed. Brahmanas were studied during daily life in the community; Aranyakas in the forest (aranya = forest)."},{"id":"s2-39","n":39,"node":"kannada_golden","tags":[],"q":"The three great writers of the tenth-century Golden Age of old Kannada literature are ________.","opts":["Pampa, Ponna and Ranna","Pampa, Kamban and Ranna","Basava, Allama and Akka","Ponna, Ranna and Tiruvalluvar"],"ans":0,"expl":"Pampa, Ponna and Ranna, the \"three gems\"."},{"id":"s2-40","n":40,"node":"three_sangams","tags":[],"q":"According to legend, the second Sangam flourished at ________.","opts":["Madurai","Then-Madurai, south of Kanyakumari","Kapadapuram, near present-day Tiruchendur","Kaveripattinam"],"ans":2,"expl":"First: Then-Madurai (drowned). Second: Kapadapuram (drowned). Third: Madurai."},{"id":"s2-41","n":41,"node":"three_sangams","tags":[],"q":"The earliest book on Tamil grammar, said to be lost for ever with the first Sangam, is the ________.","opts":["Agattiyam","Tolkappiyam","Kavirajamargam","Tirukkural"],"ans":0,"expl":"The Agattiyam was lost; the Tolkappiyam survived from the second Sangam."},{"id":"s2-42","n":42,"node":"ettuttokai","tags":[],"q":"Which of the Eight Anthologies deal with heroism (puram) and the praise of kings?","opts":["Kalittokai and Paripatal","Narrinai and Ainkurunuru","Purananuru and Patirruppattu","Akananuru and Kuruntokai"],"ans":2,"expl":"Anthologies 1–5 are love; 6–7 (Purananuru, Patirruppattu) heroism; 8 (Paripatal) mixed."},{"id":"s2-43","n":43,"node":"tolkappiyam","tags":[],"q":"The Tolkappiyam contains ________ cuttirams.","opts":["2,000","1,216","1,330","1,612"],"ans":3,"expl":"1,612 cuttirams, roughly equivalent to Sanskrit sutras, in three sections."},{"id":"s2-44","n":44,"node":"tinais","tags":[],"q":"The tinai associated with the seashore and lovers' anxiety is ________.","opts":["Palai","Neytal","Marutam","Kurinci"],"ans":1,"expl":"Kurinci hills (meeting), Neytal seashore (anxiety), Palai wasteland (separation), Mullai forest (union), Marutam lowland (unfaithfulness)."},{"id":"s2-45","n":45,"node":"mullai","tags":[],"q":"\"Even noon is evening to one who has no one.\" This line belongs to the sample poem for ________.","opts":["Palai, the wasteland","Kurinci, the hills","Neytal, the seashore","Mullai, the forest"],"ans":3,"expl":"Mullai is the jasmine that blooms at dusk."},{"id":"s2-46","n":46,"node":"akam_puram","tags":[],"q":"In akam poetry, characters are ________.","opts":["not named, but identified by gender, occupation, region and role in the relationship","always kings and their queens","named after the poet's patrons","named after gods and heroes of the epics"],"ans":0,"expl":"Hence titles like \"What she said\", \"What he said\", \"What her girl friend said\"."},{"id":"s2-47","n":47,"node":"discovery","tags":[],"q":"The first edition of the Ettuttokai was published in 1877 by ________.","opts":["U. V. Swaminatha Iyer","C. W. Thamotharampillai","A. K. Ramanujan","Kamil Zvelebil"],"ans":1,"expl":"Thamotharampillai (1832–1901), who with U. V. Swaminatha Iyer (1855–1942) rescued the poems from palm-leaf manuscripts."},{"id":"s2-48","n":48,"node":"tirukkural","tags":[],"q":"The Tirukkural expanded the old two-fold division of Tamil poetry into three: ________.","opts":["akam, puram and bhakti","love, war and devotion","love, virtue, and polity and society","dharma, artha and moksha"],"ans":2,"expl":"Love, virtue, and matters of polity and society."},{"id":"s2-49","n":49,"node":"traditional_epics","tags":[],"q":"Which of the following is a traditional (folk or primary) epic?","opts":["Poema del Cid","Hyperion","Aeneid","Paradise Lost"],"ans":0,"expl":"Traditional: Iliad, Odyssey, Beowulf, Chanson de Roland, Poema del Cid, Nibelungenlied. The others are literary epics."},{"id":"s2-50","n":50,"node":"epic_conventions","tags":[],"q":"The epic convention of beginning \"in medias res\" means beginning ________.","opts":["with a catalogue of the main characters","at the hero's birth","with an invocation to the muse","in the middle of things, at a critical point in the action"],"ans":3,"expl":"In medias res: in the middle of things."},{"id":"s2-51","n":51,"node":"indian_epics","tags":[],"q":"The Ramayana and the Mahabharata were composed roughly between ________ and written down sometime in the ________.","opts":["1500 and 1200 BC; 6th century AD","the 12th and 2nd centuries BC; 2nd century AD","the 2nd century BC and 2nd century AD; 10th century AD","the 6th and 4th centuries BC; 1st century BC"],"ans":1,"expl":"Composed roughly in the 12th–2nd centuries BC; written down sometime in the 2nd century AD."},{"id":"s2-52","n":52,"node":"ramayana_tradition","tags":[],"q":"The Ramayana has about ________ shlokas, mostly in the ________ metre.","opts":["18,000; gayatri","100,000; anushtup","24,000; anushtup","24,000; mandakranta"],"ans":2,"expl":"24,000 shlokas in the anushtup metre (\"anushtap chand\"), which Valmiki is credited with creating."},{"id":"s2-53","n":53,"node":"valmiki","tags":[],"q":"According to tradition, Valmiki's first shloka was born when he saw ________.","opts":["Sita weeping in his ashram","a vulture die defending a princess","a hunter kill the male of a pair of mating cranes","Rama leave Ayodhya for exile"],"ans":2,"expl":"\"O hunter, you have killed the crane in love...\" Its form and rhythm came to be called the shloka."},{"id":"s2-54","n":54,"node":"mahabharata","tags":[],"q":"In the Mahabharata, the most detailed version of the Ramakatha is in the ________, where it is told by ________.","opts":["Aranyaka Parva; Vyasa to Arjuna","Shanti Parva; Bhishma to Yudhishthira","Drona Parva; Krishna to Arjuna","Shanti Parva; the sage Markandeya to Yudhishthira"],"ans":3,"expl":"The Ramakatha appears in the Aranyaka, Drona and Shanti Parvas. The slides put the most detailed version in the Shanti Parva, told by Markandeya to a guilty, depressed Yudhishthira."},{"id":"s2-55","n":55,"node":"three_versions","tags":[],"q":"In the sequence of the Mahabharata's three versions, the Bharata is attributed to ________.","opts":["Sauti","Vaisampayana","Markandeya","Vyasa"],"ans":1,"expl":"Jaya by Vyasa, then Bharata by Vaisampayana, then Mahabharata by Sauti."},{"id":"s2-56","n":56,"node":"vyasa","tags":[],"q":"Vyasa is called \"Dvaipayana\" because ________.","opts":["he was born on an island in the Yamuna","he explained the Vedas in the form of Samhitas","he composed two epics","he was dark in complexion"],"ans":0,"expl":"Dvaipayana: the island (dvipa). Krishnamuni: dark complexion. Veda Vyasa: he explained the Vedas as Samhitas."},{"id":"s2-57","n":57,"node":"agni","tags":[],"q":"In the first hymn of the Rig Veda, Agni is called the \"hotar\", that is, ________.","opts":["the destroyer of foes","the pressed Soma juice","the keeper of the treasury","the priest who invokes the gods"],"ans":3,"expl":"\"I laud Agni, the chosen Priest, God, minister of sacrifice, the hotar, lavishest of wealth.\""},{"id":"s2-58","n":58,"node":"indra","tags":[],"q":"Indra is called \"Shatakratu\", meaning ________.","opts":["fair of cheek","of a hundred powers","lord of the tawny horses","richest of the rich"],"ans":1,"expl":"Shatakratu means \"of a hundred powers\". The other options are also phrases from his hymns."},{"id":"s2-59","n":59,"node":"ashvins","tags":[],"q":"In the Rig Veda hymn, the Ashvins arrive with ________.","opts":["the Wind, son of the sea","the Night, sister of Agni","the Dawn, Daughter of the Sky","the Moon, lord of Soma"],"ans":2,"expl":"\"Now Morning with her earliest light shines forth, dear Daughter of the Sky: high, Ashvins, I extol your praise.\""},{"id":"s2-60","n":60,"node":"uma","tags":[],"q":"In \"Uma the Golden\", Agni fails to ________ and Vayu fails to ________.","opts":["burn a blade of grass; move a blade of grass","light a lamp; blow out a lamp","burn a forest; uproot a tree","find the Light; reach the Light"],"ans":0,"expl":"The Light gives each god a single blade of grass. Neither can act on it without the Supreme's power."},{"id":"s2-61","n":61,"node":"maitreyi","tags":[],"q":"When Yajnavalkya decides to retire to the forest, which wife asks whether the whole world's wealth could make her immortal?","opts":["Maitreyi","Arundhati","Gargi","Katyayani"],"ans":0,"expl":"Katyayani accepts her share of the property; Maitreyi chooses knowledge."},{"id":"s2-62","n":62,"node":"nachiketa","tags":[],"q":"Nachiketa's second boon from Yama was ________.","opts":["that his father's anger should subside","to know whether people live on after death","to learn the fire sacrifice that leads men to Heaven","to live a hundred years with sons and grandsons"],"ans":2,"expl":"Boon 1: his father's peace. Boon 2: the fire sacrifice. Boon 3: the truth about death. A hundred years is one of Yama's temptations."},{"id":"s2-63","n":63,"node":"chariot","tags":[],"q":"In the Katha Upanishad's chariot image, the reins stand for ________.","opts":["intelligence","conscience","the senses","the body"],"ans":1,"expl":"Soul = lord, body = chariot, intelligence = driver, conscience = reins, senses = horses."},{"id":"s2-64","n":64,"node":"valmiki_abduction","tags":[],"q":"In Valmiki's account, Ravana's magic chariot is drawn by ________.","opts":["lions","elephants","horses","asses"],"ans":3,"expl":"A golden chariot pulled by asses, thundering as it flies."},{"id":"s2-65","n":65,"node":"valmiki_abduction","tags":[],"q":"Valmiki compares Ravana seizing Sita to the planet Mercury stealing the light of ________.","opts":["Rahu","Rohini","Ushas","the Moon"],"ans":1,"expl":"The epic simile: Mercury, with its evil power, stealing the lovely light of the star Rohini."},{"id":"s2-66","n":66,"node":"jatayu","tags":[],"q":"In Kamban's Ramavataram, Jatayu guards Rama, Sita and Lakshmana \"________\".","opts":["like a dark cloud rendered ruddy","as a miser minds his hoard","like a sapphire mountain","like a mother bird its young ones"],"ans":3,"expl":"The mother bird is Jatayu. Lakshmana guards Sita \"as a miser minds his hoard\"."},{"id":"s2-67","n":67,"node":"surpanakha","tags":[],"q":"Surpanakha introduces herself to Rama as \"a maiden named ________\".","opts":["Tataka","Maithili","Kamavalli","Kamala"],"ans":2,"expl":"Kamavalli, roughly \"creeper of desire\". Tataka is her mother's mother; Maithili is Sita."},{"id":"s2-68","n":68,"node":"surpanakha","tags":[],"q":"To answer Rama's objection that the learned won't approve of men mating with rakshasis, Surpanakha claims she is now a ________.","opts":["Vidyadhari","Gandharva","Yakshi","Brahmin"],"ans":0,"expl":"\"I'm a Vidyadhari now, a celestial being.\" The Gandharva marriage is the next excuse."},{"id":"s2-69","n":69,"node":"surpanakha_lament","tags":[],"q":"\"Only a snake knows the ways of a snake.\" This line belongs to which of Surpanakha's tactics?","opts":["Reframing: saying a long nose is a blemish","Strategy: offering to teach Rama the rakshasas' tricks","Compromise: asking to marry Lakshmana","Threat: warning Rama of Ravana's anger"],"ans":1,"expl":"The strategy tactic, along with \"set a thief to catch a thief\"."},{"id":"s2-70","n":70,"node":"valmiki_vs_kamban","tags":[],"q":"Part 12's causal chain runs: Surpanakha disfigured → ________ → Ravana → Sita abducted → war in Lanka.","opts":["Khara","Vibhishana","Jatayu","Kumbhakarna"],"ans":0,"expl":"Kamban gives the cause, Valmiki gives the effect."},{"id":"s2-71","n":71,"node":"meghaduta","tags":["beyond"],"q":"Kalidasa's Meghaduta is best classified as a ________.","opts":["play","mahakavya","prose romance","lyric poem"],"ans":3,"expl":"Both past papers: a lyric poem."},{"id":"s2-72","n":72,"node":"kalidasa","tags":["beyond"],"q":"Most scholars and critics place Kalidasa in the time of the ________.","opts":["Maurya Empire","Shunga Empire","Gupta Empire","Chola Empire"],"ans":2,"expl":"The 2024 paper: the Gupta Empire."},{"id":"s2-73","n":73,"node":"ashadh","tags":["beyond"],"q":"In Mohan Rakesh's Ashadh Ka Ek Din, Kalidasa gives which reason for not accepting the post of court poet at Ujjain?","opts":["He disliked the artificial life of the court","He wanted to restore his dilapidated house","He did not want to be uprooted from his natural surroundings","He had to look after his maternal uncle Matul"],"ans":2,"expl":"The 2024 paper. The other three were its distractors."},{"id":"s2-74","n":74,"node":"ashadh","tags":["beyond"],"q":"Mohan Rakesh was a pioneer of which Hindi literary movement?","opts":["Nayi Kavita","Nayi Kahani","Chhayavad","Naya Natak"],"ans":1,"expl":"The 2024 paper: Nayi Kahani, the \"new story\" movement."},{"id":"s2-75","n":75,"node":"cilappatikaram","tags":["beyond"],"q":"The Cilappatikaram is set across the three Tamil kingdoms of the ________.","opts":["Cholas, Pandyas and Cheras","Pandyas, Chalukyas and Cheras","Cholas, Gangas and Sinhalas","Cholas, Pallavas and Chalukyas"],"ans":0,"expl":"The 2024 paper spells them Cholas, Pantiyas and Cerals."},{"id":"s2-76","n":76,"node":"karna_kunti","tags":["beyond"],"q":"Tagore's recreation of the dialogue between Karna and Kunti departs from the Mahabharata in being more ________.","opts":["aristocratic","feminist","historical","psychological"],"ans":3,"expl":"The 2024 paper: psychological."},{"id":"s2-77","n":77,"node":"bhakti","tags":["beyond"],"q":"The Bhakti movement travelled across India along which regional route?","opts":["South–East–North–West","South–North–East–West","North–South–East–West","South–West–North–East"],"ans":3,"expl":"The 2023 paper. It began in the Tamil south with Saiva and Vaishnava saints."},{"id":"s2-78","n":78,"node":"sufism","tags":["beyond"],"q":"Which of the following is NOT one of the pillars of Sufism?","opts":["Ishraq","Hajj","Iman","Ihsan"],"ans":1,"expl":"The 2023 paper. Hajj is a pillar of Islam, not of Sufism."},{"id":"s2-79","n":79,"node":"khusraw","tags":["beyond"],"q":"Amir Khusraw was the spiritual disciple of ________.","opts":["Hazrat Nizamuddin Auliya","Khwaja Moinuddin Chishti","Baba Fariduddin Ganjshakar","Qutbuddin Bakhtiar Kaki"],"ans":0,"expl":"The 2023 paper. He was known as Tuti-e-Hind and is credited with the sitar and tabla."},{"id":"s2-80","n":80,"node":"nanak","tags":["beyond"],"q":"In Sikhism there is a powerful fusion of the ________ philosophies.","opts":["Sufi and Baul","Saiva and Vaishnava","Bhakti and Sufi","Hindu and Buddhist"],"ans":2,"expl":"The 2023 paper. Guru Nanak had his mystical experience at 30; ten human Gurus preceded the Guru Granth Sahib."}]},{"key":"s3","name":"Set 2","desc":"80 new questions with answers.","qs":[{"id":"s3-01","n":1,"node":"complit","tags":[],"q":"In the course's example of the second approach (a theme or idea across languages), which idea is traced?","opts":["The nation: belonging and national identity","The fall of kingdoms","Love in separation","The journey of the hero"],"ans":0,"expl":"Approach 2 takes an idea such as the nation: what it is, what belonging means, what national identity means."},{"id":"s3-02","n":2,"node":"requirements","tags":[],"q":"Which of the following pairs would qualify as a comparative literature study by the course's definition?","opts":["Two chapters of the same Marathi novel","Two modern Tamil short stories by the same author","A modern Gujarati novel and another Gujarati novel of the same decade","A Sanskrit play and a Hindi film based on it"],"ans":3,"expl":"Comparison across languages, across time or across art forms qualifies. Staying in one language, one period and one form does not."},{"id":"s3-03","n":3,"node":"aims","tags":[],"q":"Which of the following is NOT among the six aims of the course?","opts":["To see how texts stay the same and how they change","To understand the role translation plays in comparative study","To learn to compose poetry in two Indian languages","To learn the literary history of India"],"ans":2,"expl":"The aims: diversity, literary history, theories, how comparative studies are done, translation, and how texts relate, differ, stay the same and change."},{"id":"s3-04","n":4,"node":"method_discipline","tags":[],"q":"As a discipline, comparative literature looks at ________.","opts":["how literature interacts with history, philosophy, art and culture","All the options are correct","how literature travels across borders","how literature shapes our understanding of the world","None of the options is correct"],"ans":1,"expl":"All three are in the recap: method and discipline, tool and field."},{"id":"s3-05","n":5,"node":"indira","tags":[],"q":"In Indira Gandhi's 1971 statement, India is \"not just its six lakh villages and towns\" and \"not just its ________ children\".","opts":["seventy million","thirty crore","fifty-five crore","hundred crore"],"ans":2,"expl":"Fifty-five crore children. Thirty crores is Bharati's figure; seventy million is Vande Mataram's."},{"id":"s3-06","n":6,"node":"religions","tags":[],"q":"According to the slide on religious groups, Buddhism accounts for about ________ of India's population.","opts":["0.37%","1.7%","2.30%","0.7%"],"ans":3,"expl":"Hindu 79.80, Muslim 14.23, Christian 2.30, Sikh 1.7, Buddhist 0.7, Jain 0.37."},{"id":"s3-07","n":7,"node":"outcome","tags":[],"q":"The slide says India has deep links with three civilisations: ________.","opts":["Hindu, Islamic and Christian","Hindu, Islamic and Persian","Vedic, Dravidian and Islamic","Hindu, Buddhist and Jain"],"ans":0,"expl":"Hence the slide's question: is India an \"unnatural nation\"?"},{"id":"s3-08","n":8,"node":"vocab","tags":[],"q":"In political talk, the slides note, the word \"country\" is often used to mean ________.","opts":["government","people","state","nation"],"ans":1,"expl":"Country often stands for \"people\". The nation is more abstract; the state is the structure of power."},{"id":"s3-09","n":9,"node":"memory_forgetting","tags":[],"q":"The slides say history can give a nation a body. The slide's word for this is ________.","opts":["territoriality","homogeneity","sovereignty","corporeality"],"ans":3,"expl":"History gives the nation \"corporeality\"; the nation is then treated as sacred, immune to change and inflexible."},{"id":"s3-10","n":10,"node":"gellner","tags":[],"q":"Ernest Gellner connects nationalism above all to ________.","opts":["the spiritual inner domain","the needs of industrial society","print-capitalism and the novel","shared myths and historical memories"],"ans":1,"expl":"Gellner: industrial modernity and homogenisation through education. Anderson: print-capitalism. Smith: shared myths and memories."},{"id":"s3-11","n":11,"node":"smith","tags":[],"q":"Anthony D. Smith's definition of the nation includes all of the following EXCEPT ________.","opts":["a single official language imposed by the state","a single economy","common rights and duties for all members","shared myths and historical memories"],"ans":0,"expl":"Smith: historic similarity, shared myths and memories, a mass public culture, a single economy, common rights and duties legitimised by nationalism."},{"id":"s3-12","n":12,"node":"inner_domain","tags":[],"q":"Because modernity, education and print-capitalism did not reach every Indian equally, Indian nationalism spread through ________.","opts":["the rational, public domain","the colonial courts of law","the spiritual, inner domain","the census and the map"],"ans":2,"expl":"Imagined and experienced in the private, spiritual domain, hence India as a Mother Goddess."},{"id":"s3-13","n":13,"node":"tagore_mother","tags":[],"q":"The refrain of the Tagore song to the Mother quoted in the lecture is ________.","opts":["the doors of your golden temple have unlocked","I bow to thee, Mother","victory, victory, victory to thee","long live the Republic of Bharat"],"ans":0,"expl":"Golden temple: Tagore's song. \"I bow to thee, Mother\": Vande Mataram. \"Victory...\": Jana Gana Mana. \"Long live...\": Bharati."},{"id":"s3-14","n":14,"node":"bharati","tags":[],"q":"\"We are of the same caste and race... every one is Bharat's King!\" This is the ending of a poem by ________.","opts":["Firaq Gorakhpuri","Muhammad Iqbal","Subramania Bharati","Bankimchandra Chatterjee"],"ans":2,"expl":"Bharati's \"Indian Republic\", a republic of equality."},{"id":"s3-15","n":15,"node":"boundaries","tags":[],"q":"Many modern social scientists prefer the term \"South Asia\", which the slide says includes ________.","opts":["Afghanistan, Pakistan, Iran and Nepal","Myanmar, Thailand, Nepal and Bhutan","Sri Lanka, Maldives, Myanmar and Tibet","Sri Lanka, Nepal, Pakistan and Bangladesh"],"ans":3,"expl":"Not foolproof: is Myanmar part of it? Myanmar links with Thailand, Pakistan with Afghanistan."},{"id":"s3-16","n":16,"node":"what_lit","tags":[],"q":"Which of the following is NOT among the slides' descriptions of literature?","opts":["A historical document","A record kept only by the state","A mode of cultural expression","A product of the creative imagination"],"ans":1,"expl":"Literature is a mode of cultural expression, a product of the creative imagination, a historical document, and more."},{"id":"s3-17","n":17,"node":"lit_teaches","tags":[],"q":"Research quoted on the slides says literature provides otherwise unavailable insights into the ways ________ are produced, experienced and enacted in human social life.","opts":["languages","emotions","rituals","nations"],"ans":1,"expl":"Neurobiological and psychological research on emotions."},{"id":"s3-18","n":18,"node":"folklore","tags":[],"q":"Which of the following is NOT listed as verbal folklore?","opts":["Lullabies","Prose narratives","Games","Proverbs"],"ans":2,"expl":"Verbal: proverbs, riddles, lullabies, tales, ballads, prose narratives, songs. Games are nonverbal."},{"id":"s3-19","n":19,"node":"folk_songs","tags":[],"q":"The slides list ________ categories of folk song.","opts":["seven","five","twelve","nine"],"ans":3,"expl":"Male-centred, female-centred, family relationships, love, fate/gods/demons, humorous, ribald, natural environment, community."},{"id":"s3-20","n":20,"node":"nilavilakku","tags":[],"q":"\"Many tongues, one voice.\" The traditional lamp used to explain this idea is the ________.","opts":["Nilavilakku","hanging lantern","temple bell","chandelier"],"ans":0,"expl":"K. M. George's Nilavilakku: many wicks, one light. Past papers call it \"base lamps\"."},{"id":"s3-21","n":21,"node":"against_plural","tags":[],"q":"Peruvian, Cuban, Mexican and Argentine literatures illustrate ________.","opts":["literatures without national names","many languages, one literature","literatures defined by race","one language, many literatures"],"ans":3,"expl":"Spanish (and English) literatures take national names: one language, many literatures."},{"id":"s3-22","n":22,"node":"commonality","tags":[],"q":"Which literary movements does the slide say crossed India's linguistic and regional barriers?","opts":["Bhakti, the Progressive and the Modernist","Progressive, Dalit and Feminist","Bhakti, Sufi and Sikh","Romantic, Realist and Modernist"],"ans":0,"expl":"Bhakti, Progressive and Modernist."},{"id":"s3-23","n":23,"node":"civilisation","tags":[],"q":"The slides define civilisation as \"an advanced state of human society, in which a high level of culture, science, industry, and ________ has been reached\".","opts":["literature","trade","government","religion"],"ans":2,"expl":"Macaulay's insult made asserting India's civilisational glory part of the nationalist project."},{"id":"s3-24","n":24,"node":"sahitya_akademi","tags":[],"q":"The Sahitya Akademi's special award for contributions to languages it does not formally recognise, and to classical and medieval literature, is the ________.","opts":["Jnanpith Award","Bhasha Samman","Sahitya Akademi Fellowship","Kabir Samman"],"ans":1,"expl":"The Bhasha Samman. The Akademi also gives 24 awards a year for literary works and 24 for translations."},{"id":"s3-25","n":25,"node":"cultural_unity","tags":[],"q":"The slides say plots from the Ramayana and Mahabharata were used in both ________.","opts":["Tamil Sangam poetry and Sanskrit plays","Kannada grammars and Tamil grammars","Buddhist gathas and Jain Agamas","Prakrit inscriptions and Pali sutras"],"ans":0,"expl":"Evidence of a cultural unity expressed through Sanskrit texts, Tamil literature and folk narratives."},{"id":"s3-26","n":26,"node":"perception_reality","tags":[],"q":"\"India has one literature that is written in many languages.\" According to the slides, this thesis ________.","opts":["is accepted only for Sanskrit and Tamil","was proven by the Sahitya Akademi in 1954","was rejected by K. M. George","has never been properly explored and validated"],"ans":3,"expl":"Also: Indian Literature is often confused with ancient Sanskrit works, and no modern concept has been formulated."},{"id":"s3-27","n":27,"node":"earliest_langs","tags":[],"q":"According to the slides, the subject of the earliest known Indian texts was ________.","opts":["love in all its moods","the relationship of man with the world around him, and with its creator","the deeds of kings and their wars","the grammar of the sacred language"],"ans":1,"expl":"A common frame of reference across the five earliest languages."},{"id":"s3-28","n":28,"node":"vedas","tags":[],"q":"According to the slides, people believed the Vedas were ________.","opts":["remembered and recorded by human authors","composed by Vyasa in a single sitting","created by God, with the human narrator only a medium","translated from an older Tamil original"],"ans":2,"expl":"Sruti is revealed. Remembered, human-authored texts are Smriti."},{"id":"s3-29","n":29,"node":"yagna","tags":[],"q":"The main impulse behind the Vedic prayers was ________.","opts":["the search for Atman and Brahman","fear of the demons","the desire for a good life: a long and healthy life, cattle, children","the wish for liberation from rebirth"],"ans":2,"expl":"The central motif is the sacrifice. The gods rule fire, water, wind and earth."},{"id":"s3-30","n":30,"node":"brahmanas","tags":[],"q":"The speculation in the Brahmanas is not only theological but also ________.","opts":["political, economic and legal","astronomical, medical and military","romantic, heroic and comic","philosophical, grammatical, etymological and metrical"],"ans":3,"expl":"The Brahmanas: eleven prose texts that comment on the mantras and prescribe their use in sacrifices."},{"id":"s3-31","n":31,"node":"sbau","tags":[],"q":"Which sequence correctly traces the Sruti texts from hymn to philosophy?","opts":["Samhita → Brahmana → Aranyaka → Upanishad","Samhita → Aranyaka → Brahmana → Upanishad","Brahmana → Samhita → Upanishad → Aranyaka","Upanishad → Aranyaka → Brahmana → Samhita"],"ans":0,"expl":"S-B-A-U: hymn, ritual, forest meditation, philosophy."},{"id":"s3-32","n":32,"node":"vedangas","tags":[],"q":"Which Vedanga deals with metre?","opts":["Jyotisha","Chandas","Kalpa","Siksha"],"ans":1,"expl":"Chandas = metre, siksha = phonetics, kalpa = ritual, jyotisha = astronomy."},{"id":"s3-33","n":33,"node":"puranas","tags":[],"q":"The most popular Purana, the Bhagavata Purana, tells the story of ________.","opts":["Shiva and Parvati's marriage","Krishna's life","Rama's exile","the churning of the ocean"],"ans":1,"expl":"The Puranas belong to Smriti."},{"id":"s3-34","n":34,"node":"sutra_dharma","tags":[],"q":"Smriti texts are often written in sutra form. \"Sutra\" means ________.","opts":["forest","remembered","thread","collection"],"ans":2,"expl":"A sutra \"threads together\" large bodies of knowledge as briefly as possible."},{"id":"s3-35","n":35,"node":"natyashastra","tags":[],"q":"Bharata's Natyashastra is dated between ________.","opts":["the 1st century BC and the 1st century AD","300 BC and 100 AD","the 12th and 2nd centuries BC","the 4th and 5th centuries AD"],"ans":0,"expl":"It sets the ground rules for Sanskrit aesthetic theory."},{"id":"s3-36","n":36,"node":"purusharthas","tags":[],"q":"Which of the following is NOT one of the four goals of life that a Sanskrit play's hero achieves?","opts":["Moksha","Kama","Artha","Yoga"],"ans":3,"expl":"Dharma, artha, kama, moksha."},{"id":"s3-37","n":37,"node":"fables","tags":[],"q":"The Kathasaritsagara is by ________.","opts":["Sudraka","Vishnusharma","Somadeva","Bharata"],"ans":2,"expl":"Panchatantra: Vishnusharma. Kathasaritsagara: Somadeva."},{"id":"s3-38","n":38,"node":"prakrit","tags":[],"q":"The earliest dated Indian literary records, and the main evidence of Prakrit in literary composition, are the ________.","opts":["Sattasai anthologies","Kavirajamargam","Jain Agamas","Ashokan inscriptions"],"ans":3,"expl":"By the 5th century AD Prakrit was also used for songs, Buddhist gathas, Jaina writings and the Sattasai anthologies, to which women contributed."},{"id":"s3-39","n":39,"node":"apabhramsa","tags":[],"q":"Apabhramsa had become a literary language by the ________ and was first used in ________ writings.","opts":["10th century AD; Bhakti","7th century AD; Jaina","5th century AD; Buddhist","3rd century BC; Vedic"],"ans":1,"expl":"Later it was used for sandhi bandhas (Puranic stories) and rasa bandhas (lyrics)."},{"id":"s3-40","n":40,"node":"sangam","tags":[],"q":"The Sangam corpus contains over ________ poems.","opts":["2,000","400","1,612","10,000"],"ans":0,"expl":"Over two thousand poems: direct, subtle, astonishingly contemporary."},{"id":"s3-41","n":41,"node":"three_sangams","tags":[],"q":"All surviving Sangam works are said to come from the third Sangam at Madurai, EXCEPT ________.","opts":["the Kuruntokai","the Paripatal","the Purananuru","the Tolkappiyam"],"ans":3,"expl":"The Tolkappiyam survived from the second Sangam."},{"id":"s3-42","n":42,"node":"ettuttokai","tags":[],"q":"Which of the following is NOT one of the Eight Anthologies (Ettuttokai)?","opts":["Ainkurunuru","Tirumurukarruppatai","Kuruntokai","Narrinai"],"ans":1,"expl":"Tirumurukarruppatai is the tenth of the Ten Long Poems (Pattuppattu)."},{"id":"s3-43","n":43,"node":"sangam_features","tags":[],"q":"The Paripatal contains poems about four deities: ________.","opts":["Vishnu, Shiva, Durga and Murugan","Indra, Agni, Vayu and Varuna","Murugan, Ganesha, Lakshmi and Saraswati","Brahma, Vishnu, Shiva and Kama"],"ans":0,"expl":"So Sangam poetry, though not overwhelmingly religious, is not unconnected with religion."},{"id":"s3-44","n":44,"node":"tolkappiyam","tags":[],"q":"The first two sections of the Tolkappiyam deal with ________, while the third covers prosody, rhetoric, poetics, genres and themes.","opts":["the five tinais","love and war","orthography, phonology, morphology and syntax","the rules of sacrifice"],"ans":2,"expl":"Three sections; 1,612 cuttirams."},{"id":"s3-45","n":45,"node":"vs_sanskrit_poetics","tags":[],"q":"In Sanskrit rasa theory, permanent emotions are called ________ and transient emotions ________.","opts":["rasa; bhava","akam; puram","sthayi; vyabhichari","vyabhichari; sthayi"],"ans":2,"expl":"Tamil poetry also groups poems by emotion, but portrays emotions very differently from the rasas."},{"id":"s3-46","n":46,"node":"tinais","tags":[],"q":"The tinai of the lowland, linked with a lover's unfaithfulness, is ________.","opts":["Mullai","Palai","Neytal","Marutam"],"ans":3,"expl":"Kurinci meets, Neytal worries, Palai travels, Mullai unites, Marutam cheats."},{"id":"s3-47","n":47,"node":"palai","tags":[],"q":"\"In the desert... seized and devoured by wildfire... the girl with freckles like kino flowers.\" This sample poem illustrates ________.","opts":["Palai: separation on a journey","Neytal: anxiety on the shore","Kurinci: the lovers' meeting","Marutam: unfaithfulness"],"ans":0,"expl":"The burning wasteland against the cool remembered house."},{"id":"s3-48","n":48,"node":"tamil_epics","tags":[],"q":"The Tamil epics Cilappatikaram and Manimekalai reflect ________ world views.","opts":["Vedic and Puranic","Buddhist and Jain","Sufi and Bhakti","Saiva and Vaishnava"],"ans":1,"expl":"They departed from the Sanskrit epics and centre strong, empowered women."},{"id":"s3-49","n":49,"node":"epic_def","tags":[],"q":"Which of the following is NOT part of the slides' definition of an epic?","opts":["A formal or elevated style","A serious subject","A short lyric on a private emotion","A long verse narrative"],"ans":2,"expl":"An epic is a long verse narrative on a serious subject in an elevated style, with a hero on whom the fate of a people depends."},{"id":"s3-50","n":50,"node":"literary_epics","tags":[],"q":"Milton's Paradise Lost imitated the style of ________.","opts":["Virgil's Aeneid","Homer's Iliad","Dante's Divine Comedy","Spenser's The Faerie Queene"],"ans":0,"expl":"Virgil, then Milton, then Blake's prophetic books and Keats's Hyperion."},{"id":"s3-51","n":51,"node":"epic_spirit","tags":[],"q":"The term \"epic\" is extended to large prose fiction with epic spirit, such as ________.","opts":["Beowulf","Tolstoy's War and Peace","Virgil's Aeneid","Keats's Hyperion"],"ans":1,"expl":"Also Melville's Moby Dick and Joyce's Ulysses; in verse, Dante's Divine Comedy and Spenser's Faerie Queene."},{"id":"s3-52","n":52,"node":"indian_epics","tags":[],"q":"Are the Indian epics traditional or literary epics? The best answer is that they are ________.","opts":["purely traditional, since they have no known authors","purely literary, since Valmiki and Vyasa wrote them alone","neither, since they are Sruti texts","both: they grew out of oral tradition but are attributed to named poets"],"ans":3,"expl":"Collective works that evolved over centuries, yet attributed to Valmiki and Vyasa. They belong to Smriti."},{"id":"s3-53","n":53,"node":"ramayana","tags":[],"q":"The Ramayana is about ________ the size of the Iliad and the Odyssey put together.","opts":["the same as","ten times","twice","half"],"ans":2,"expl":"Twice as big as the Iliad and the Odyssey together."},{"id":"s3-54","n":54,"node":"ramayana_tradition","tags":[],"q":"Winternitz thought the first form of the Ramayana emerged in the ________ and its final form in the ________.","opts":["6th century BC; 1st century AD","4th century BC; 2nd century AD","12th century BC; 2nd century BC","2nd century BC; 4th century AD"],"ans":1,"expl":"Jacobi, by contrast, accepts only five kandas as genuine."},{"id":"s3-55","n":55,"node":"mbh_dating","tags":[],"q":"The Mahabharata is called Shat Sahasra Samhita because it has about ________ shlokas.","opts":["one hundred thousand","twenty-four thousand","one thousand","eighteen thousand"],"ans":0,"expl":"About 100,000 shlokas in 18 parvas. It predates the Buddha."},{"id":"s3-56","n":56,"node":"upjeevya","tags":[],"q":"The Ramayana and the Mahabharata are called Upjeevya Kavya because they are ________.","opts":["the oldest Sruti texts","sung only at festivals","written in the upjeevya metre","source books for later oral and written works"],"ans":3,"expl":"Many writers adapted them in their own languages, Kamban among them."},{"id":"s3-57","n":57,"node":"agni","tags":[],"q":"The Agni hymn ends: \"Be to us easy of approach, even as ________.\"","opts":["a priest to the gods","the dawn to the night","a king to his people","a father to his son"],"ans":3,"expl":"Agni: chosen priest, hotar, messenger, dispeller of the night, father to son."},{"id":"s3-58","n":58,"node":"vayu","tags":[],"q":"In the Vayu hymn, Mitra and Varuna are praised as those \"who make the ________ complete\".","opts":["ship of hymns","oil-fed rite","road of heaven","Soma feast"],"ans":1,"expl":"They are lovers and cherishers of Law (rita, the cosmic order)."},{"id":"s3-59","n":59,"node":"ashvins","tags":[],"q":"In the Rig Veda, the Ashvins are also called ________.","opts":["Nasatyas","Angiras","Kanvas","Maruts"],"ans":0,"expl":"The Kanvas are a family of poets named in the hymn; Angiras is a name of Agni."},{"id":"s3-60","n":60,"node":"uma","tags":[],"q":"Uma tells Indra that the dazzling Light was ________.","opts":["Agni in disguise","the Dawn, Daughter of the Sky","Brahma, the Creator, the Supreme God","the demons' last trick"],"ans":2,"expl":"\"Your victories were really His victories.\""},{"id":"s3-61","n":61,"node":"maitreyi","tags":[],"q":"To explain how individual selves merge into the Great Soul at death, Yajnavalkya uses the image of ________.","opts":["salt water in the sea","a chariot and its horses","a lamp with many wicks","a blade of grass"],"ans":0,"expl":"\"If a drop of salt water is put in the sea it loses its identity...\""},{"id":"s3-62","n":62,"node":"nachiketa","tags":[],"q":"Nachiketa asks his father \"to whom will you offer me?\" because his father was giving away ________.","opts":["all his gold","his other sons","stolen horses","lean, useless cows"],"ans":3,"expl":"Vajasravas gives worthless cattle at his yajna. Angered by the question, he offers Nachiketa to Death."},{"id":"s3-63","n":63,"node":"chariot","tags":[],"q":"In Yama's ladder, what is said to be greater than the soul?","opts":["The mind","The seed of the world","The intellect","The sense-objects"],"ans":1,"expl":"Senses, sense-objects, mind, intellect, soul, the seed of the world, and above all the Ultimate Person."},{"id":"s3-64","n":64,"node":"valmiki_abduction","tags":[],"q":"In Valmiki's scene, Ravana mocks Rama for giving up his home and kingdom because ________.","opts":["his father was weak","he feared the rakshasas","a woman spoke and he resigned","a sage cursed him"],"ans":2,"expl":"The woman is Queen Kaikeyi, whom Sita also blames."},{"id":"s3-65","n":65,"node":"valmiki_abduction","tags":[],"q":"\"So might a soaring eagle bear a serpent's consort through the air.\" This simile describes ________.","opts":["Jatayu attacking Ravana","Surpanakha fleeing to Khara","Ravana carrying Sita into the sky","the Ashvins' chariot"],"ans":2,"expl":"One of Valmiki's cosmic and animal similes; the other is Mercury stealing Rohini's light."},{"id":"s3-66","n":66,"node":"kamban_intro","tags":[],"q":"Kamban's Tamil Ramayana, composed around the 12th century, is called the ________.","opts":["Ramopakhyana","Raghuvamsha","Ramcharitmanas","Ramavataram"],"ans":3,"expl":"A retelling, not a translation. The extract is from the Aranya Kandam."},{"id":"s3-67","n":67,"node":"godavari","tags":[],"q":"Kamban's Godavari flows through \"the five tracts described in classical poetry\". These tracts are ________.","opts":["the five tinais of Sangam poetry","the five kandas accepted by Jacobi","the five rivers of Punjab","the five Vedangas"],"ans":0,"expl":"Kamban slips Tamil landscape poetics into Rama's story."},{"id":"s3-68","n":68,"node":"surpanakha","tags":[],"q":"When Rama objects on grounds of caste, Surpanakha replies that her father was a Vedic brahmin and her mother was the daughter of ________.","opts":["King Janaka","King Chalakantaka","Kubera","the sage Agastya"],"ans":1,"expl":"\"Your objection is invalid and I am saved!\""},{"id":"s3-69","n":69,"node":"surpanakha_lament","tags":[],"q":"Rama tells Surpanakha he still has the arrow that killed ________, her mother's mother.","opts":["Dushana","Kumbhakarna","Khara","Tataka"],"ans":3,"expl":"He has vowed to destroy the whole rakshasa race."},{"id":"s3-70","n":70,"node":"valmiki_vs_kamban","tags":[],"q":"Which of the following similes is Kamban's rather than Valmiki's?","opts":["Ravana like Mercury stealing Rohini's light","Ravana, twenty-armed, like a dark cloud","Sita clinging to Rama like a coral creeper against a raincloud","Ravana bearing Sita as an eagle bears a serpent's consort"],"ans":2,"expl":"Kamban's similes are sensuous and layered: a miser's fame, cobra venom, a coral creeper, a miser's hoard."},{"id":"s3-71","n":71,"node":"meghaduta","tags":["beyond"],"q":"In the Meghaduta, the cloud's journey runs from ________ to ________.","opts":["the Vindhyas; the Himalayas","Lanka; Ayodhya","the Himalayas; the Vindhyas","Ujjain; Kashi"],"ans":0,"expl":"From the past papers. Kalidasa lavishly describes Vidisha and Ujjain along the way."},{"id":"s3-72","n":72,"node":"kalidasa","tags":["beyond"],"q":"The work generally believed to have been written by Kalidasa in his youth is ________.","opts":["Meghaduta","Ritusamhara","Abhijnanashakuntalam","Raghuvamsha"],"ans":1,"expl":"The 2024 paper."},{"id":"s3-73","n":73,"node":"ashadh","tags":["beyond"],"q":"In Ashadh Ka Ek Din, the new name Kalidasa takes after finding fame at the royal court is ________.","opts":["Kirtigupta","Chandragupta","Samudragupta","Matrugupta"],"ans":3,"expl":"The 2024 paper. As Matrugupta he is sent to govern Kashmir."},{"id":"s3-74","n":74,"node":"ashadh","tags":["beyond"],"q":"Although Ashadh Ka Ek Din takes its title from the Meghaduta, scholars say its plot aligns more easily with Kalidasa's ________.","opts":["Malavikagnimitram","Raghuvamsha","Abhijnanashakuntalam","Kumarasambhava"],"ans":2,"expl":"The 2024 paper."},{"id":"s3-75","n":75,"node":"cilappatikaram","tags":["beyond"],"q":"Who is commonly known as \"the venerable ascetic prince\"?","opts":["Ilanko Atikal","Cittalai Cattanar","Tiruvalluvar","Cenkuttuvan"],"ans":0,"expl":"The 2024 paper: Ilanko Atikal, author of the Cilappatikaram."},{"id":"s3-76","n":76,"node":"cilappatikaram","tags":["beyond"],"q":"The literary sequel to the Cilappatikaram is ________.","opts":["Kamba Ramayana","Manimekalai","Tirukkural","Ettuttokai"],"ans":1,"expl":"The 2024 paper. Both are post-Sangam Tamil epics."},{"id":"s3-77","n":77,"node":"bhakti","tags":["beyond"],"q":"Which of the following is a Bhakti poet?","opts":["Lal Ded","Valmiki","Visakhadatta","Bharata"],"ans":0,"expl":"The 2023 paper lists Andal, Lal Ded and Tukaram as Bhakti poets; Valmiki is not one."},{"id":"s3-78","n":78,"node":"bhakti","tags":["beyond"],"q":"Like many Bhakti saint-poets, Kabir came from the working class. By profession he was a ________.","opts":["potter","cobbler","boatman","weaver"],"ans":3,"expl":"The 2023 paper."},{"id":"s3-79","n":79,"node":"urdu","tags":["beyond"],"q":"The language of the common folk in Delhi and its surrounding areas in late medieval times is known as ________.","opts":["Awadhi","Khariboli","Dakkhani","Nastaliq"],"ans":1,"expl":"The 2023 paper. Nastaliq is a script; Dakkhani is a southern name for Urdu."},{"id":"s3-80","n":80,"node":"sufism","tags":["beyond"],"q":"Who among the following is NOT regarded as a Sufi thinker?","opts":["Amir Khusraw","Shah Qalandar","Javed Akhtar","Bulleh Shah"],"ans":2,"expl":"The 2023 paper."}]},{"key":"s4","name":"Set 3","desc":"80 new questions with answers.","qs":[{"id":"s4-01","n":1,"node":"complit","tags":[],"q":"The course's example of the genre approach compares ________.","opts":["French, German, Italian and English novels of the 18th century","Hindi and Urdu ghazals of the 19th century","Sanskrit and Tamil epics of the 12th century","Greek and Latin tragedies"],"ans":0,"expl":"Approach 1: take a genre, e.g. the European novel of the 18th century."},{"id":"s4-02","n":2,"node":"requirements","tags":[],"q":"Comparison isn't limited to literature compared with literature. The slide's example of another art form is ________.","opts":["painting","film","sculpture","music"],"ans":1,"expl":"Literature can be compared with other art forms, for example film."},{"id":"s4-03","n":3,"node":"translation","tags":[],"q":"\"Understanding the role translation plays in comparative study, and seeing how texts relate to each other and how they differ, are both among the aims of the course.\"","opts":["The whole statement is false","Only the part about translation is true","Only the part about how texts relate and differ is true","The whole statement is true"],"ans":3,"expl":"Aims 5 and 6."},{"id":"s4-04","n":4,"node":"dilemmas","tags":[],"q":"Which of the following is one of the dilemmas that make \"Indian literature\" hard to conceptualise?","opts":["Elite culture versus popular culture","Prose versus verse","Indigenous Indian languages versus the languages of India's erstwhile colonisers","Urban versus rural readership"],"ans":2,"expl":"The three: indigenous vs colonial languages, scheduled vs unscheduled languages, singular vs plural. Elite vs popular culture is the past papers' odd one out."},{"id":"s4-05","n":5,"node":"prasad","tags":[],"q":"In \"Desperately Seeking India\", the speaker says that in Bombay he is ________.","opts":["an invader","an exploiting trader","without a visa","an Aryan spy"],"ans":0,"expl":"Delhi: no visa. Madras: an Aryan spy. Bombay: an invader. Assam: an exploiting trader."},{"id":"s4-06","n":6,"node":"language_atlas","tags":[],"q":"Which set correctly gives India's language families, scripts, Eighth Schedule languages and spoken languages, in that order?","opts":["4, 14, 22, 1,600","5, 14, 24, 400","5, 14, 22, 400","5, 22, 14, 400"],"ans":2,"expl":"Five, fourteen, twenty-two, four hundred, and thousands of dialects."},{"id":"s4-07","n":7,"node":"outcome","tags":[],"q":"The slide asks whether India is, in quotation marks, an \"________ nation\".","opts":["invented","unnatural","incomplete","imagined"],"ans":1,"expl":"An \"unnatural nation\", given its complexity and diversity. \"Imagined community\" is Anderson's phrase."},{"id":"s4-08","n":8,"node":"nation_history","tags":[],"q":"Before nations, according to the slides, there were ________.","opts":["nation-states and federations","tribes, clans and castes","churches and monasteries","empires, kingdoms and city-states"],"ans":3,"expl":"The slides also list republics, municipal kingdoms and confederations of local republics. Nations are modern."},{"id":"s4-09","n":9,"node":"modernity","tags":[],"q":"According to the slides, the nation and nationalism came out of ________.","opts":["the Bhakti and Sufi movements","the Renaissance and the Reformation","the European Enlightenment and Romantic thought","the Mughal and Maratha empires"],"ans":2,"expl":"Monarchy gave way to democratic nation-states, and Western imperialism carried \"self-determination, states and sovereignty\" abroad."},{"id":"s4-10","n":10,"node":"raj","tags":[],"q":"Which of the following is NOT listed as an ingredient in the British Raj's creation of the Indian nation?","opts":["Western education","A common national language","An Indian intelligentsia","Print-capitalism"],"ans":1,"expl":"The ingredients also include scientific and social discoveries. Part 4 notes there is no common Indian language."},{"id":"s4-11","n":11,"node":"vande_mataram","tags":[],"q":"In Vande Mataram, the Mother is \"terrible with the clamorous shout of ________ throats\".","opts":["fifty-five crore","thirty crore","a hundred million","seventy million"],"ans":3,"expl":"Seventy million throats, and swords in twice seventy million hands."},{"id":"s4-12","n":12,"node":"jana_gana_mana","tags":[],"q":"Which of the following regions is NOT named in the translation of Jana Gana Mana given on the slides?","opts":["Kashmir","Maratha","Odisha","Sind"],"ans":0,"expl":"Punjab, Sind, Gujarat, Maratha, Dravida, Odisha and Bengal."},{"id":"s4-13","n":13,"node":"firaq","tags":[],"q":"\"On the soil of Hindustan, O Firaq, caravans from all over the world kept coming, and so was Hindustan made.\" Firaq Gorakhpuri wrote in ________.","opts":["Persian","Punjabi","Urdu","Hindi"],"ans":2,"expl":"It pairs with Iqbal's caravan at the Ganges: two Urdu poets, one image."},{"id":"s4-14","n":14,"node":"name_india","tags":[],"q":"The Constitution says: \"India, that is Bharat, shall be ________.\"","opts":["a union of states","a sovereign socialist republic","a federation of provinces","one nation, one people"],"ans":0,"expl":"Quoted on the slide about the name \"India\"."},{"id":"s4-15","n":15,"node":"indianness","tags":[],"q":"In the quote on Indianness, the two key words the slide stresses are ________.","opts":["unity and diversity","share and distinctive","family and resemblance","mother and goddess"],"ans":1,"expl":"Indians share a family resemblance: a distinctive Indian stamp on universal experiences."},{"id":"s4-16","n":16,"node":"why_write","tags":[],"q":"The need for free individual expression, one of the reasons people write, is said to contribute to ________.","opts":["literary fame","religious merit","national unity","mental and physical health"],"ans":3,"expl":"Record, share, express, higher purpose."},{"id":"s4-17","n":17,"node":"folk_performance","tags":[],"q":"Folk songs, the slides say, stay current as ________.","opts":["written classics","court poems","variants","temple rituals"],"ans":2,"expl":"Their antiquity is as amazing as their mobility; new parallels are made every day."},{"id":"s4-18","n":18,"node":"folk_songs","tags":[],"q":"Folk songs with heroism and adventure as their main motifs are classed as ________.","opts":["male-centred songs","songs about fate, gods and demons","female-centred songs","community songs"],"ans":0,"expl":"Female-centred songs carry domestic motifs and question tradition and hierarchy."},{"id":"s4-19","n":19,"node":"folk_performance","tags":[],"q":"According to the slides, folk songs are sung ________.","opts":["at marriages, births and deaths","All the options are correct","while watching crops or cattle, rowing boats or working in the fields","at festivals and as part of calendar rituals","None of the options is correct"],"ans":1,"expl":"The contexts run from work to rites of passage, and performers are professional and domestic."},{"id":"s4-20","n":20,"node":"concept_il","tags":[],"q":"Both \"Indian Literature\" and \"Indian Literatures\" are used because ________.","opts":["the Sahitya Akademi uses the plural","Sanskrit and Tamil use different terms","the Constitution requires both terms","India is not an easy cultural entity to define"],"ans":3,"expl":"Defining a literature is easier when the nation is a clearly definable cultural entity."},{"id":"s4-21","n":21,"node":"nilavilakku","tags":[],"q":"In the Nilavilakku analogy, what determines the brightness of the light?","opts":["The lamp","The height of the flame","The wicks","The oil"],"ans":2,"expl":"\"The lamp is the same, the oil is the same, but it is the wicks that determine the brightness of light.\""},{"id":"s4-22","n":22,"node":"against_plural","tags":[],"q":"Which of the following is NOT one of the arguments for a singular Indian literature?","opts":["Multilingualism is at the core of Indian creativity","India has one common language shared by all its literatures","There are border-crossings between Indian languages all the time","Language can't be the only criterion for dividing literature"],"ans":1,"expl":"There is no common Indian language, which is why the singular needs other arguments."},{"id":"s4-23","n":23,"node":"commonality","tags":[],"q":"The doha, named on the slide about commonality, is a ________.","opts":["eulogy of a king","prose romance","long epic poem","couplet"],"ans":3,"expl":"From the mahakavya (epic) and the doha (couplet) to the novel and the short story."},{"id":"s4-24","n":24,"node":"sahitya_akademi","tags":[],"q":"Which of the following statements about the Sahitya Akademi is correct?","opts":["It works in 24 languages including English","It was inaugurated on 12 March 1964","It publishes one book every 24 hours","It works only in the 22 scheduled languages"],"ans":0,"expl":"12 March 1954; 24 languages including English; one book every 19 hours; 24 + 24 awards; Bhasha Samman."},{"id":"s4-25","n":25,"node":"literary_past","tags":[],"q":"Which of the following best states the paradox in the slides on India's literary past?","opts":["Tamil is older than Sanskrit, but Sanskrit is more widely re
