<style>
/* Layout: a header band, sticky tabs, then the map, drawn as clusters arranged around one central idea.

:root {

  --k0: #25857F; --k1: #CF4539; --k2: #8E7F12; --k3: #955A8D; --k4: #D06F14; --k5: #378D40;

}

    --accent: #A7AEFF; --accent-ink: #11131C; --accent-soft: #232848;
    --warm: #F2B347; --warm-hi: #FFD27A; --warm-soft: #372A12; --band: #1C1F2D; --band-ink: #D8DBF0;
    --good: #66D39C; --good-soft: #13301F; --bad: #FF8F82; --bad-soft: #3A1916;
    --k0: #58C6BE; --k1: #F27D70; --k2: #D4C35B; --k3: #D597CC; --k4: #F4A65A; --k5: #76C97C;
    --k6: #82A9EA; --k7: #CB9C7B; --k8: #EE88BC; --k9: #6CC4E6; --k10: #A8A6F2; --k11: #A6A9BA;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F15; --surface: #161821; --surface-2: #1E2130; --ink: #ECE9E1; --muted: #A9ACBB; --faint: #7D8194; --line: #2A2E3D;
  --accent: #A7AEFF; --accent-ink: #11131C; --accent-soft: #232848;
  --warm: #F2B347; --warm-hi: #FFD27A; --warm-soft: #372A12; --band: #1C1F2D; --band-ink: #D8DBF0;
  --good: #66D39C; --good-soft: #13301F; --bad: #FF8F82; --bad-soft: #3A1916;
  --k0: #58C6BE; --k1: #F27D70; --k2: #D4C35B; --k3: #D597CC; --k4: #F4A65A; --k5: #76C97C;
  --k6: #82A9EA; --k7: #CB9C7B; --k8: #EE88BC; --k9: #6CC4E6; --k10: #A8A6F2; --k11: #A6A9BA;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }

.k0 { --cc: var(--k0); } .k1 { --cc: var(--k1); } .k2 { --cc: var(--k2); } .k3 { --cc: var(--k3); } .k4 { --cc: var(--k4); } .k5 { --cc: var(--k5); }
.k6 { --cc: var(--k6); } .k7 { --cc: var(--k7); } .k8 { --cc: var(--k8); } .k9 { --cc: var(--k9); } .k10 { --cc: var(--k10); } .k11 { --cc: var(--k11); }

:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.top { padding-block: 18px 10px; }

.tagline { margin: 0; font-size: 14.5px; opacity: .9; max-width: 64ch; }

}

.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .sw, .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--cc, var(--faint)); flex: none; display: inline-block; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em; border-radius: 4px; padding: 1px 6px; vertical-align: 1px; margin-left: 4px; white-space: nowrap; font-variation-settings: "wdth" 88; background: var(--surface-2); color: var(--muted); }
.tag.warm { background: var(--warm-soft); color: var(--warm); }
.tag.cool { background: var(--accent-soft); color: var(--accent); }
.tag.dashed { background: transparent; color: var(--muted); border: 1px dashed var(--faint); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 560; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 560; font-size: 14px; }
.btn:hover { border-color: var(--faint); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; user-select: none; }

/* map */
.map-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1040px) { .map-layout { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }
.map-stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; height: min(74vh, 860px); min-height: 440px; box-shadow: var(--shadow); }
@media (max-width: 719px) { .map-stage { height: clamp(400px, 125vw, 64vh); min-height: 0; } }
#mapsvg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#mapsvg.dragging { cursor: grabbing; }
.hull, .wick, .edge, .ctitle { pointer-events: none; }
.hull { fill: var(--cc); fill-opacity: .075; stroke: var(--cc); stroke-opacity: .075; stroke-width: 34; stroke-linejoin: round; }
.wick { stroke: var(--warm); stroke-opacity: .28; stroke-width: 1.4; stroke-dasharray: 2 5; fill: none; }
.edge { fill: none; stroke: var(--faint); stroke-opacity: .3; stroke-width: 1; }
.edge.intra { stroke: var(--cc); stroke-opacity: .42; }
#mapsvg[data-z="0"] .edge.cross, #mapsvg[data-z="1"] .edge.cross { stroke-opacity: .17; }
.node { cursor: pointer; }
.node circle { fill: var(--cc); stroke: var(--surface); stroke-width: 1.5; }
.node text { fill: var(--ink); font-family: var(--font-ui); font-variation-settings: "wdth" 88; paint-order: stroke; stroke: var(--surface); stroke-width: 3.2px; stroke-linejoin: round; font-size: var(--fs); }
.node.t1 { --fs: 14px; } .node.t2 { --fs: 12.5px; } .node.t3 { --fs: 11.5px; }
.node.t1 text { font-weight: 600; } .node.t2 text { font-weight: 500; } .node.t3 text { font-weight: 450; fill: var(--muted); }
.node:hover circle, .node:focus-visible circle { stroke: var(--ink); stroke-width: 2; }
.node:focus { outline: none; }
#mapsvg[data-z="0"] .node text, #mapsvg[data-z="0"] .ctitle, #mapsvg[data-z="0"] .core text { display: none; }
#mapsvg[data-z="1"] .node.v2 text, #mapsvg[data-z="1"] .node.v3 text, #mapsvg[data-z="2"] .node.v3 text { display: none; }
#mapsvg[data-z="1"] .node.v1 text { font-size: calc(var(--fs) * var(--ls, 1)); }
#mapsvg.has-sel .node { opacity: .22; }
#mapsvg.has-sel .node.sel, #mapsvg.has-sel .node.nb { opacity: 1; }
#mapsvg.has-sel .node.sel text, #mapsvg.has-sel .node.nb text { display: inline; }
#mapsvg[data-z="0"].has-sel .node.sel text, #mapsvg[data-z="0"].has-sel .node.nb text, #mapsvg[data-z="1"].has-sel .node.sel text, #mapsvg[data-z="1"].has-sel .node.nb text { font-size: calc(var(--fs) * var(--ls, 1)); }
#mapsvg.has-sel .edge { stroke-opacity: .07; }
#mapsvg.has-sel .edge.on { stroke: var(--accent); stroke-opacity: .9; stroke-width: 1.8; }
.node.sel circle { stroke: var(--ink); stroke-width: 3; }
.ctitle .p { font-size: calc(12px * var(--lt2, 1)); letter-spacing: .14em; text-transform: uppercase; font-weight: 650; fill: var(--cc); font-family: var(--font-ui); }
.ctitle .n { font-size: calc(25px * var(--lt, 1)); fill: var(--cc); font-family: var(--font-display); }
#mapsvg[data-z="3"] .ctitle { opacity: .55; }
.core { cursor: pointer; }
.core .glow { fill: url(#glow); }
.core .g1 { fill: var(--warm); } .core .g2 { fill: var(--warm-hi); } .core .g3 { fill: none; stroke: var(--warm); stroke-width: 2; }
.core text { fill: var(--ink); font-family: var(--font-ui); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.core .c1 { font-size: calc(13px * var(--ls, 1)); font-weight: 650; }
.core .c2 { font-size: calc(11.5px * var(--ls, 1)); fill: var(--muted); font-style: italic; font-family: var(--font-display); }
.map-toolbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; align-items: flex-start; pointer-events: none; flex-wrap: wrap; }
.map-toolbar > * { pointer-events: auto; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: 14.5px; color: var(--ink); box-shadow: var(--shadow); }
.suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); max-height: 280px; overflow: auto; z-index: 5; padding: 4px; }
.suggest button { display: flex; width: 100%; text-align: left; gap: 8px; align-items: center; background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 14px; }
.suggest button:hover, .suggest button.hl { background: var(--surface-2); }
.zoom { display: flex; gap: 4px; margin-left: auto; }
.zoom button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; box-shadow: var(--shadow); }
.zoom button.fit { width: auto; padding: 0 12px; font-size: 13.5px; font-weight: 600; }
.map-legend { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none; }
.map-legend .chip { pointer-events: auto; box-shadow: var(--shadow); font-size: 12.5px; padding: 3px 10px; }
.map-hint { position: absolute; right: 12px; top: 54px; font-size: 12px; color: var(--faint); pointer-events: none; text-align: right; }
@media (max-width: 719px) { .map-hint { display: none; } .map-legend { gap: 4px; } .map-legend .chip { font-size: 11.5px; padding: 2px 8px; } }
.tooltip { position: absolute; z-index: 6; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 5px 9px; border-radius: 6px; max-width: 280px; line-height: 1.35; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 20px; box-shadow: var(--shadow); min-width: 0; }
@media (min-width: 1040px) { .panel { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; } }
.p-eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; color: var(--cc, var(--warm)); margin-bottom: 4px; }
.panel h2 { font-size: 24px; }

.facts li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--cc, var(--faint)); opacity: .7; }
.sect { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.sect-h { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; color: var(--muted); margin: 0 0 8px; }
.links { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.links li { display: flex; gap: 8px; align-items: baseline; }
.links .why { color: var(--muted); font-size: 14px; }
.qlist { display: grid; gap: 6px; }
.qlist details { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); }
.qlist summary { cursor: pointer; font-size: 14px; list-style: none; }

.qlist .ans { margin-top: 6px; font-size: 14px; }
.qlist .ans b { color: var(--good); }
.panel-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.howto { color: var(--muted); font-size: 14.5px; }

/* atlas */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.toolbar .search { flex: 1 1 260px; max-width: 420px; }
.toolbar .search input { box-shadow: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.atlas-layout { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .atlas-layout { grid-template-columns: 230px minmax(0, 1fr); } }
.toc { display: none; }
@media (min-width: 1100px) {
  .toc { display: block; position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; font-size: 13.5px; padding-right: 6px; }
  .toc a { display: block; color: var(--muted); text-decoration: none; padding: 2px 0 2px 10px; border-left: 2px solid transparent; }
  .toc a:hover { color: var(--ink); border-left-color: var(--line); }
  .toc .tc { margin: 12px 0 4px; font-weight: 650; color: var(--cc); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
}
.csec { margin-bottom: 30px; }
.csec-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 2px solid var(--cc); padding-bottom: 6px; }
.csec-h h2 { color: var(--cc); margin: 0; }
.csec-h .d { color: var(--muted); font-size: 14px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; scroll-margin-top: 80px; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--warm); } 100% { box-shadow: 0 0 0 0 transparent; } }
.card.flash { animation: flash 1.6s ease-out; }
.card-h { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.card-h h3 { margin: 0; font-size: 16.5px; }
.card-h .tt { display: flex; gap: 8px; min-width: 0; align-items: baseline; }
.card .facts { font-size: 14.5px; }
.card .row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.card .row .lbl { color: var(--muted); font-weight: 600; margin-right: 2px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.lchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--bg); cursor: pointer; font-size: 12.5px; color: var(--ink); }
.lchip:hover { border-color: var(--faint); }
.qchip { font-size: 12px; font-weight: 600; border-radius: 5px; padding: 1px 6px; background: var(--accent-soft); color: var(--accent); border: 0; cursor: pointer; font-variant-numeric: tabular-nums; }
mark { background: var(--warm-soft); color: inherit; border-radius: 2px; padding: 0 1px; box-shadow: 0 0 0 1px var(--warm-hi) inset; }
.empty { color: var(--muted); padding: 30px 0; }

/* sheets */
.subnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.tsec { margin-bottom: 34px; scroll-margin-top: 70px; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); align-items: start; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.tcard h3 { display: flex; justify-content: space-between; gap: 8px; }

.tl li { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tl li:first-child { border-top: 0; }
.tl .a { font-weight: 620; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

table.tbl td:first-child { font-weight: 650; color: var(--warm); width: 34%; }
.sources { font-size: 13.5px; color: var(--muted); }

/* questions */
.qhead { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.qhead .controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13.5px; cursor: pointer; color: var(--muted); font-weight: 560; }

he 18th century, comparing French, German, Italian and English novels side by side.","tags":[]},{"h":"Approach 2: pick a <b>theme or idea<\/b>. Example: the idea of the nation: how languages and literatures express what a nation is, what belonging means, what national identity means.","tags":[]},{"h":"Memory hook: <b>genre across languages, or idea across languages<\/b>. Past papers phrase it as \"genre and theme\" (distractors: plot and setting; point of view and conflict; language and characters).","tags":["2023","2024"]}],"refs":[{"s":"s1","n":6,"id":"s1-06"},{"s":"s2","n":1,"id":"s2-01"},{"s":"s3","n":1,"id":"s3-01"},{"s":"s4","n":1,"id":"s4-01"}]},{"id":"requirements","title":"What comparison needs, and how far it reaches","plain":"What comparison needs, and how far it reaches","label":"Scope of comparison","c":"A","tier":2,"vis":3,"x":203.8,"y":-368.1,"side":1,"facts":[{"h":"You need to know <b>at least two languages<\/b> and use them to read and compare literary texts (past-paper answer; distractors one, three, four).","tags":["2023","2024"]},{"h":"Comparison works <b>across time<\/b>: classical and medieval texts alongside modern ones, e.g. a Sanskrit text alongside a Hindi text.","tags":[]},{"h":"It isn't limited to literature vs literature: you can compare literature with <b>other art forms, e.g. film<\/b>.","tags":[]},{"h":"So a pair that stays inside one language, one period and one form does <b>not<\/b> qualify: modern Bengali novel vs modern Bengali short story (past-paper answer). Hindi film vs Hindi short story qualifies (art forms); classical Sanskrit drama vs contemporary Gujarati drama qualifies (time and language); Spanish novel vs German novel qualifies (languages).","tags":["2023","2024"]}],"refs":[{"s":"s1","n":22,"id":"s1-22"},{"s":"s1","n":35,"id":"s1-35"},{"s":"s2","n":2,"id":"s2-02"},{"s":"s3","n":2,"id":"s3-02"},{"s":"s4","n":2,"id":"s4-02"}]},{"id":"aims","title":"Six aims of the course","plain":"Six aims of the course","label":"Course aims","c":"A","tier":3,"vis":3,"x":175.9,"y":-341.9,"side":1,"facts":[{"h":"1 Get familiar with the diversity of literature around us in India.","tags":[]},{"h":"2 Learn the literary history of India.","tags":[]},{"h":"3 Learn something of the theories of comparative literature.","tags":[]},{"h":"4 Watch and learn how comparative studies of literary texts are actually done.","tags":[]},{"h":"5 Understand the role translation plays in comparative study.","tags":[]},{"h":"6 See how texts relate to each other and how they differ: how they stay the same, and how they change.","tags":[]}],"refs":[{"s":"s3","n":3,"id":"s3-03"}]},{"id":"translation","title":"The role of translation","plain":"The role of translation","label":"Translation","c":"A","tier":2,"vis":1,"x":94.7,"y":-340.2,"side":1,"facts":[{"h":"Translation helps uncover <b>both<\/b> how texts relate to each other and how they differ <b>and<\/b> how texts remain the same and how they undergo change. Past-paper answer: \"Both the options are correct\".","tags":["2023","2024"]},{"h":"Your readings are translations too: the Rig Veda hymns and the Ramayana extract are <b>Ralph T. H. Griffith<\/b>'s; the Sangam poems are <b>A. K. Ramanujan<\/b>'s.","tags":[]}],"refs":[{"s":"s1","n":39,"id":"s1-39"},{"s":"s4","n":3,"id":"s4-03"}]},{"id":"indianlit_def","title":"What is Indian Literature? (first pass)","plain":"What is Indian Literature? (first pass)","label":"Indian literature?","c":"A","tier":2,"vis":2,"x":139.6,"y":-314.0,"side":1,"facts":[{"h":"The literatures produced in the different Indian languages.","tags":[]},{"h":"<b>22 scheduled<\/b> languages against countless unscheduled ones.","tags":[]},{"h":"Indian languages vs <b>English<\/b>, and by extension French, Portuguese, Dutch and the other colonial languages. English has a special role.","tags":[]},{"h":"The question the course keeps returning to: <b>singular or plural<\/b>? Indian Literature, or Indian Literatures?","tags":[]}],"refs":[]},{"id":"dilemmas","title":"Dilemmas in defining \"Indian literature\"","plain":"Dilemmas in defining \"Indian literature\"","label":"Dilemmas","c":"A","tier":2,"vis":3,"x":127.1,"y":-369.2,"side":1,"facts":[{"h":"The three dilemmas in Part 1: indigenous Indian languages vs the colonisers' languages; scheduled vs unscheduled languages; singular vs plural Indian literature(s).","tags":[]},{"h":"<b>Not<\/b> on the list: elite culture vs popular culture. Both past papers use it as the odd one out.","tags":["2023","2024"]}],"refs":[{"s":"s1","n":26,"id":"s1-26"},{"s":"s4","n":4,"id":"s4-04"}]},{"id":"evaluation","title":"Evaluation","plain":"Evaluation","label":"Evaluation","c":"A","tier":3,"vis":3,"x":253.7,"y":-341.8,"side":1,"facts":[{"h":"Quiz 1: 20%. Quiz 2: 20%. In-class assignment: 20%. Comprehensive exam: 40%.","tags":[]},{"h":"Dates are announced in advance. The slide says there is no \"surprise\" factor.","tags":[]},{"h":"The past Quiz 1 papers had 60 questions at 0.25 marks each (15 marks), taken in about 20 minutes.","tags":["2023","2024"]}],"refs":[{"s":"s2","n":3,"id":"s2-03"}]},{"id":"method_discipline","title":"Method and discipline","plain":"Method and discipline","label":"Method + discipline","c":"A","tier":2,"vis":3,"x":104.9,"y":-370.0,"side":-1,"facts":[{"h":"Comparative literature is <b>both a method and a discipline<\/b>: a tool for analysis and an independent field with its own theories, questions, approaches, scope and identity.","tags":[]},{"h":"As a discipline it studies how literature travels across borders, how it interacts with history, philosophy, art and culture, and how it shapes our understanding of the world.","tags":[]}],"refs":[{"s":"s2","n":4,"id":"s2-04"},{"s":"s3","n":4,"id":"s3-04"}]},{"id":"what_is_india","title":"What is Indian? Who is an Indian? What is India? What was India?","plain":"What is Indian? Who is an Indian? What is India? What was India?","label":"Four questions","c":"B","tier":3,"vis":3,"x":473.2,"y":-190.2,"side":1,"facts":[{"h":"The lecture opens with these questions. The slides are mostly images: maps, India's cultural influence, the Indian diaspora.","tags":[]},{"h":"The point: none of the questions has a simple answer.","tags":[]}],"refs":[]},{"id":"indira","title":"\"India is an idea\": Indira Gandhi, 1971","plain":"\"India is an idea\": Indira Gandhi, 1971","label":"Indira Gandhi, 1971","c":"B","tier":1,"vis":2,"x":680.9,"y":-193.0,"side":1,"facts":[{"h":"\"India is not just its land, mountains and rivers, India is not just its <b>six lakh<\/b> villages and towns, India is not just its <b>fifty-five crore<\/b> children, India is a thought, India is an idea.\"","tags":[]},{"h":"Past-paper question \"India is a thought and an idea because ___\": <b>All the options are correct<\/b>. The options were: too vast and diverse to define in cartographic terms; a fundamental unity ties India and all Indians together; civilisational continuity that has influenced cultures beyond India; more than the sum of its peoples, cultures, histories and geography.","tags":["2023","2024"]}],"refs":[{"s":"s1","n":10,"id":"s1-10"},{"s":"s2","n":5,"id":"s2-05"},{"s":"s3","n":5,"id":"s3-05"}]},{"id":"prasad","title":"\"Desperately Seeking India\": G. J. V. Prasad","plain":"\"Desperately Seeking India\": G. J. V. Prasad","label":"Desperately Seeking India","c":"B","tier":1,"vis":2,"x":142.5,"y":-151.5,"side":1,"facts":[{"h":"A poem by <b>G. J. V. Prasad<\/b> (past-paper distractors: Rajendra, Venkatesh and Ravishankar Prasad).","tags":["2023","2024"]},{"h":"\"In Delhi, without a visa. In Madras, an Aryan spy. Kashmir's no vacation. They tell me it's a nation. And Punjab wants to die. In Bombay, I'm an invader. In Assam, an exploiting trader. They would throw me from the hills, kick me from the plains. I promise never to mention India again.\"","tags":[]},{"h":"Bitter and funny: the speaker is an outsider in every region. If everyone is a foreigner somewhere, where is India?","tags":[]}],"refs":[{"s":"s1","n":5,"id":"s1-05"},{"s":"s2","n":6,"id":"s2-06"},{"s":"s4","n":5,"id":"s4-05"}]},{"id":"ethnic","title":"Ethnic groups","plain":"Ethnic groups","label":"Ethnic groups","c":"B","tier":2,"vis":3,"x":592.0,"y":-220.3,"side":1,"facts":[{"h":"Five main groups: <b>Indo-Aryans, Dravidians, Tibeto-Burmans, Austroasiatics and Negritos<\/b>.","tags":[]},{"h":"Other communities: Parsis (Zoroastrians), Jews, Anglo-Indians, Arabs, Persians, Turks, Afghans, Central Asians and others.","tags":[]}],"refs":[{"s":"s2","n":7,"id":"s2-07"}]},{"id":"religions","title":"Religious groups (%)","plain":"Religious groups (%)","label":"Religions %","c":"B","tier":2,"vis":3,"x":389.2,"y":-285.1,"side":1,"facts":[{"h":"Hinduism <b>79.80<\/b> · Islam <b>14.23<\/b> · Christianity <b>2.30<\/b> · Sikhism <b>1.7<\/b> · Buddhism <b>0.7<\/b> · Jainism <b>0.37<\/b> · other religions <b>0.66<\/b> · unspecified <b>0.24<\/b>.","tags":[]},{"h":"Rounded: about 80 Hindu, 14 Muslim, a bit over 2 Christian, under 2 Sikh, under 1 Buddhist, under half a percent Jain.","tags":[]}],"refs":[{"s":"s3","n":6,"id":"s3-06"}]},{"id":"language_atlas","title":"The language atlas of India","plain":"The language atlas of India","label":"Language atlas","c":"B","tier":1,"vis":2,"x":189.4,"y":-221.8,"side":1,"facts":[{"h":"<b>5<\/b> language families · <b>14<\/b> major writing systems (scripts) · <b>22<\/b> languages in the Eighth Schedule of the Constitution · <b>400<\/b> spoken languages · <b>thousands<\/b> of dialects.","tags":[]},{"h":"Chant it: five, fourteen, twenty-two, four hundred, thousands.","tags":[]}],"refs":[{"s":"s2","n":8,"id":"s2-08"},{"s":"s4","n":6,"id":"s4-06"}]},{"id":"outcome","title":"Outcome: an \"unnatural nation\"?","plain":"Outcome: an \"unnatural nation\"?","label":"Unnatural nation?","c":"B","tier":2,"vis":3,"x":674.8,"y":-246.8,"side":1,"facts":[{"h":"India is complex and diverse, impossible to generalise about, with a vast, elaborate and varied past.","tags":[]},{"h":"Deep links with <b>three civilisations: Hindu, Islamic and Christian<\/b>.","tags":[]},{"h":"So what holds India together? Is it, in the slide's quotation marks, an <b>\"unnatural nation\"<\/b>?","tags":[]}],"refs":[{"s":"s3","n":7,"id":"s3-07"},{"s":"s4","n":7,"id":"s4-07"}]},{"id":"vocab","title":"Nation, country, people, state","plain":"Nation, country, people, state","label":"Nation vs state","c":"B","tier":1,"vis":2,"x":475.6,"y":-277.3,"side":1,"facts":[{"h":"<b>Country<\/b>: a tract of native land, mostly rural or geographical areas; it usually includes the people who live there. In political talk \"country\" often means \"people\".","tags":[]},{"h":"<b>Nation<\/b>: more <b>abstract<\/b>. Past-paper answer to \"a relatively more abstract concept\".","tags":["2023","2024"]},{"h":"<b>State<\/b>: carries a sense of the <b>structure of power<\/b>. Past-paper answer to \"embodies a sense of power structure\".","tags":["2023","2024"]}],"refs":[{"s":"s1","n":12,"id":"s1-12"},{"s":"s1","n":14,"id":"s1-14"},{"s":"s2","n":9,"id":"s2-09"},{"s":"s3","n":8,"id":"s3-08"}]},{"id":"nation_history","title":"Nations are modern","plain":"Nations are modern","label":"Nations are modern","c":"B","tier":2,"vis":3,"x":472.2,"y":-223.0,"side":1,"facts":[{"h":"Nations are modern, not ancient.","tags":[]},{"h":"Before nations there were empires, kingdoms and city-states. The slides also list republics, municipal kingdoms, confederations of local republics, and empires.","tags":[]}],"refs":[{"s":"s4","n":8,"id":"s4-08"}]},{"id":"memory_forgetting","title":"Memory and forgetting","plain":"Memory and forgetting","label":"Memory & forgetting","c":"B","tier":1,"vis":2,"x":607.9,"y":-276.4,"side":1,"facts":[{"h":"A nation is built through <b>shared memory and selective forgetting<\/b>: past triumphs and accomplishments are kept; episodes of violence, brutality and humiliation are forgotten.","tags":[]},{"h":"Nation-building wants <b>unity and homogeneity<\/b>, usually resting on a common language, culture, religion, territory and history. \"The essence of a nation is that all individuals have many things in common.\"","tags":[]},{"h":"Race, religion, language and geography are vital to how a nation is imagined. History gives the nation a body (<b>\"corporeality\"<\/b>). The nation is treated as sacred, immune to change and inflexible. It is also the will of the people; secession is a change in territorial span.","tags":[]},{"h":"The lecture then asks: was nationalism the product of a sense of community that already existed?","tags":[]},{"h":"So <b>heterogeneity<\/b> among the population is contrary to the general assumptions about a nation (past-paper answer; homogeneity, remembering triumphs and forgetting violence all fit).","tags":["2023","2024"]},{"h":"The notes add that the memory-and-forgetting idea comes from <b>Ernest Renan<\/b>'s lecture \"What is a Nation?\"","tags":["notes+"]}],"refs":[{"s":"s1","n":27,"id":"s1-27"},{"s":"s3","n":9,"id":"s3-09"}]},{"id":"gellner","title":"Ernest Gellner","plain":"Ernest Gellner","label":"Gellner","c":"B","tier":1,"vis":2,"x":305.8,"y":-231.2,"side":1,"facts":[{"h":"Nationalism is connected to, and decided by, the <b>needs of industrial society<\/b>. Modernity is the foundation of nations and nationalisms.","tags":[]},{"h":"Industrial society shakes up old identity markers and class differences. <b>Education<\/b> produces a degree of homogenisation: everyone learns the same standard culture.","tags":[]},{"h":"But moulding people into one homogeneous whole doesn't always work: \"high\" culture can coexist with peasant and artisan cultures.","tags":[]},{"h":"In one line: nationalism is a product of industrial modernity, spread through education.","tags":[]}],"refs":[{"s":"s3","n":10,"id":"s3-10"}]},{"id":"smith","title":"Anthony D. Smith","plain":"Anthony D. Smith","label":"A. D. Smith","c":"B","tier":1,"vis":2,"x":380.7,"y":-206.3,"side":1,"facts":[{"h":"The nation: \"Populations possessing a historic similarity, <b>shared myths and historical memories<\/b>, a mass, <b>public culture<\/b>, a <b>single economy<\/b> and <b>common rights and duties<\/b> for all members, which are legitimized by the principles of nationalism.\"","tags":[]}],"refs":[{"s":"s3","n":11,"id":"s3-11"}]},{"id":"anderson","title":"Benedict Anderson","plain":"Benedict Anderson","label":"Anderson","c":"B","tier":1,"vis":2,"x":533.9,"y":-131.3,"side":1,"facts":[{"h":"The nation is an <b>\"imagined community\"<\/b>: you will never meet most of your fellow nationals, yet you feel bound to them.","tags":[]},{"h":"It depends on <b>print-capitalism<\/b> (newspapers and novels) and is propped up by three pieces of modern apparatus: the <b>census, the map and the museum<\/b>.","tags":[]}],"refs":[{"s":"s2","n":10,"id":"s2-10"}]},{"id":"hobsbawm","title":"\"Invented tradition\"","plain":"\"Invented tradition\"","label":"Invented tradition","c":"B","tier":3,"vis":3,"x":206.9,"y":-257.9,"side":1,"facts":[{"h":"The phrase is on the slides. The notes add that it belongs to the historian <b>Eric Hobsbawm<\/b>: traditions that feel ancient but were made quite recently, often for national purposes.","tags":["notes+"]}],"refs":[]},{"id":"modernity","title":"The nation as a product of modernity","plain":"The nation as a product of modernity","label":"Modernity","c":"B","tier":2,"vis":2,"x":315.7,"y":-258.7,"side":1,"facts":[{"h":"The nation and nationalism are outcomes of modernity. They came from the <b>European Enlightenment<\/b> and from <b>Romantic<\/b> thought.","tags":[]},{"h":"Monarchy was replaced by democratic nation-states. Ideas of \"self-determination, states and sovereignty\" were carried to the rest of the world by <b>Western imperialism<\/b>.","tags":[]}],"refs":[{"s":"s4","n":9,"id":"s4-09"}]},{"id":"global_south","title":"The nation in the Global South","plain":"The nation in the Global South","label":"Global South","c":"B","tier":2,"vis":2,"x":407.0,"y":-164.8,"side":1,"facts":[{"h":"The European model is often treated as universal, but it differs from what happened in the Global South, whose societies are multi-ethnic, multi-religious and multilingual, with globalisation on top.","tags":[]},{"h":"From there the concept of the nation looks <b>forced, a psychological construct<\/b>.","tags":[]},{"h":"These ideas did not grow naturally in the Global South: borders between empires and dynasties were never fixed, and power and sovereignty were decentralised.","tags":[]}],"refs":[]},{"id":"raj","title":"India: a creation of the British Raj","plain":"India: a creation of the British Raj","label":"British Raj","c":"B","tier":1,"vis":1,"x":638.8,"y":-163.8,"side":1,"facts":[{"h":"The geographical and political idea of an Indian nation was a <b>creation of the British Raj<\/b>.","tags":[]},{"h":"Its ingredients: Western education, scientific and social discoveries, print-capitalism, and the creation of an Indian intelligentsia.","tags":[]},{"h":"The sentence to remember: India's antiquity, blurry territory and fluid populations were made concrete by <b>colonial museums, map-making and census<\/b> procedures. That is Anderson applied to India.","tags":[]}],"refs":[{"s":"s2","n":11,"id":"s2-11"},{"s":"s4","n":10,"id":"s4-10"}]},{"id":"inner_domain","title":"Nationalism in the inner, spiritual domain","plain":"Nationalism in the inner, spiritual domain","label":"Inner domain","c":"B","tier":1,"vis":2,"x":332.6,"y":-137.7,"side":1,"facts":[{"h":"Modernity, education and print-capitalism did not reach every Indian in the same way. So nationalism, unable to take shape in the rational public domain, was imagined and experienced in the <b>spiritual, inner domain<\/b>, and spread into popular awareness from there.","tags":[]},{"h":"The notes add that this argument is associated with the historian <b>Partha Chatterjee<\/b>.","tags":["notes+"]},{"h":"What does inner nationalism look like? A <b>goddess<\/b>: India as Mother Goddess.","tags":[]}],"refs":[{"s":"s3","n":12,"id":"s3-12"}]},{"id":"bankim","title":"Bankimchandra Chatterjee (1838–1894)","plain":"Bankimchandra Chatterjee (1838–1894)","label":"Bankim","c":"B","tier":1,"vis":1,"x":456.0,"y":-132.8,"side":1,"facts":[{"h":"He stands at the birth of Indian nationalism.","tags":[]},{"h":"His character <b>Kamalakanta<\/b> takes an overdose of <b>opium<\/b> and has a vision: floating alone on the great stream of time, \"like a child without a mother\", calling \"Where is my mother? Where is Bengal?\"","tags":[]},{"h":"He sees an idol of the <b>saptami<\/b> day (the seventh day of the Durga festival), draped in gold, laughing and floating on the water: \"this was my mother, my country\". Ten jewelled arms stretched in ten directions, weapons, the enemy at her feet, the lion beneath her.","tags":[]},{"h":"The nation is drowned now but will rise one day, \"resplendent in new glory, carrier of new strength\".","tags":[]}],"refs":[{"s":"s2","n":12,"id":"s2-12"}]},{"id":"vande_mataram","title":"Vande Mataram","plain":"Vande Mataram","label":"Vande Mataram","c":"B","tier":1,"vis":2,"x":321.5,"y":-108.3,"side":1,"facts":[{"h":"\"I bow to thee, Mother, richly-watered, richly-fruited, cool with the winds of the south, dark with the crops of the harvests, the Mother!\"","tags":[]},{"h":"Then martial: \"Terrible with the clamorous shout of <b>seventy million<\/b> throats, and the sharpness of swords raised in twice seventy million hands, who sayeth to thee, Mother, that thou art weak?\"","tags":[]},{"h":"She is Durga with ten weapons, <b>Kamala<\/b> (Lakshmi) at play in the lotuses, and <b>Speech<\/b> (Saraswati), giver of all lore: power, wealth and learning. \"It is thy image we raise in every temple.\"","tags":[]},{"h":"The notes add that the song appears in Bankim's novel <b>Anandamath (1882)<\/b> and later became India's <b>national song<\/b>.","tags":["notes+"]}],"refs":[{"s":"s2","n":13,"id":"s2-13"},{"s":"s4","n":11,"id":"s4-11"}]},{"id":"tagore_mother","title":"Tagore (1861–1941): a song to the Mother","plain":"Tagore (1861–1941): a song to the Mother","label":"Tagore's Mother","c":"B","tier":2,"vis":2,"x":186.1,"y":-194.4,"side":1,"facts":[{"h":"\"When did you come out of the heart of Bengal, O Mother dear, with such inexplicable splendour!\" Refrain: <b>the doors of your golden temple have unlocked<\/b>.","tags":[]},{"h":"Her right hand holds a blazing sword; her left hand takes away fear; her third eye glares; her untied hair is a cloud hiding thunder; her robes are sunlight-coloured. The mother who once sat poor and desolate in torn clothes is transformed.","tags":[]}],"refs":[{"s":"s3","n":13,"id":"s3-13"}]},{"id":"jana_gana_mana","title":"Jana Gana Mana","plain":"Jana Gana Mana","label":"Jana Gana Mana","c":"B","tier":2,"vis":3,"x":547.2,"y":-249.1,"side":1,"facts":[{"h":"\"Thou art the ruler of the minds of all people, dispenser of India's destiny.\"","tags":[]},{"h":"It names Punjab, Sind, Gujarat, Maratha, Dravida, Odisha and Bengal; the Vindhyas and Himalayas; the Yamuna and Ganges; the waves of the Indian Sea. \"Victory, victory, victory to thee.\"","tags":[]},{"h":"India is built up as a <b>catalogue of places<\/b> united under one ruler of minds.","tags":[]}],"refs":[{"s":"s4","n":12,"id":"s4-12"}]},{"id":"iqbal","title":"Muhammad Iqbal (1877–1938): Saare Jahan Se Achha","plain":"Muhammad Iqbal (1877–1938): Saare Jahan Se Achha","label":"Iqbal","c":"B","tier":1,"vis":2,"x":398.0,"y":-241.3,"side":1,"facts":[{"h":"\"Better than the entire world is our Hindustan. We are its <b>nightingales<\/b>, and it is our <b>garden<\/b> abode.\"","tags":[]},{"h":"The tallest mountain is \"our <b>sentry<\/b> and our watchman\"; thousands of rivers play in its lap. \"O flowing waters of the Ganges, do you remember that day when our <b>caravan<\/b> first disembarked on your waterfront?\"","tags":[]},{"h":"\"<b>Religion does not teach us to bear animosity among ourselves.<\/b> We are of Hind, our homeland is Hindustan.\"","tags":[]},{"h":"Ancient Greece, Egypt and Rome vanished without trace, but \"our name and sign live on today\".","tags":[]}],"refs":[{"s":"s2","n":14,"id":"s2-14"}]},{"id":"bharati","title":"Subramania Bharati (1882–1921): \"Indian Republic\"","plain":"Subramania Bharati (1882–1921): \"Indian Republic\"","label":"Bharati","c":"B","tier":1,"vis":2,"x":566.9,"y":-192.0,"side":1,"facts":[{"h":"The great Tamil poet. Refrain: \"Long live the Republic of Bharat! Victory to the Republic of Bharat!\"","tags":[]},{"h":"<b>Thirty crores<\/b> of people share this commonwealth. \"We shall now lay down the law and die to preserve it. We'll rather send the world up in flames than suffer one man to starve.\"","tags":[]},{"h":"\"This is what Lord <b>Krishna<\/b> said: I live in all living things.\"","tags":[]},{"h":"It ends: \"We are of the same caste and race, we are children of Bharat all; we are equal in law and stature, and <b>every one is Bharat's King<\/b>!\" A republic of equality: no hunger, no caste.","tags":[]}],"refs":[{"s":"s3","n":14,"id":"s3-14"}]},{"id":"firaq","title":"Firaq Gorakhpuri (1896–1982)","plain":"Firaq Gorakhpuri (1896–1982)","label":"Firaq","c":"B","tier":2,"vis":3,"x":329.8,"y":-286.1,"side":1,"facts":[{"h":"The Urdu poet: \"On the soil of Hindustan, O Firaq, <b>caravans<\/b> from all over the world kept coming, and so was Hindustan made.\"","tags":[]},{"h":"India made of arrivals. It pairs with Iqbal's caravan at the Ganges: two Urdu poets, one image.","tags":[]}],"refs":[{"s":"s4","n":13,"id":"s4-13"}]},{"id":"name_india","title":"The name \"India\"","plain":"The name \"India\"","label":"The name \"India\"","c":"B","tier":1,"vis":2,"x":498.7,"y":-161.0,"side":1,"facts":[{"h":"In its current form the term is fairly recent. The composers of the Vedic hymns (around <b>1500 BC<\/b>) did not think of themselves as \"Indians\". Like \"Hindu\" and \"Buddhist\", the term is applied with hindsight: a historical construct, but too hard to avoid.","tags":[]},{"h":"The Constitution: \"<b>India, that is Bharat, shall be a union of states.<\/b>\"","tags":[]},{"h":"Other names: Bharata, <b>Bharatavarsha<\/b>, Bharatam, Aryavarta, Jambudvipa, Indica, Al-Hind, Hindustan, Indostan, Mauryadesa, Himvarsha, and <b>Tianzhu<\/b> (the Chinese name).","tags":[]}],"refs":[{"s":"s2","n":15,"id":"s2-15"},{"s":"s4","n":14,"id":"s4-14"}]},{"id":"fundamental_unity","title":"The fundamental unity of India","plain":"The fundamental unity of India","label":"Fundamental unity","c":"B","tier":2,"vis":2,"x":472.9,"y":-306.7,"side":1,"facts":[{"h":"Despite huge differences, there was and is enough in common in literary and intellectual traditions to study this part of the world as a unit. Cultural continuity between many texts supports this.","tags":[]},{"h":"You needn't fully agree that the commonality was invented by Western Orientalists. All commonality is invented, but this invention came <b>centuries before the British<\/b>.","tags":[]},{"h":"The evidence: ancient texts and the epics <b>list the regions<\/b> of what is now India and describe their peoples. More distant known regions, such as <b>Greece<\/b>, are not included.","tags":[]}],"refs":[]},{"id":"boundaries","title":"Geographical boundaries","plain":"Geographical boundaries","label":"Boundaries","c":"B","tier":2,"vis":3,"x":458.5,"y":-249.3,"side":1,"facts":[{"h":"Boundaries are drawn arbitrarily in each era. India's latest were drawn in <b>1947<\/b> and have been disputed ever since.","tags":[]},{"h":"Earlier \"India\" meant the <b>Indian subcontinent<\/b>. Many social scientists prefer <b>\"South Asia\"<\/b> (Sri Lanka, Nepal, Pakistan, Bangladesh), which isn't foolproof: is Myanmar part of it? Myanmar links with Thailand; parts of Pakistan link with Afghanistan.","tags":[]},{"h":"Every unit shades into its neighbours. All boundaries are fluid and shifting.","tags":[]}],"refs":[{"s":"s3","n":15,"id":"s3-15"}]},{"id":"why_cil","title":"Why \"Comparative\" Indian Literature?","plain":"Why \"Comparative\" Indian Literature?","label":"Why comparative?","c":"B","tier":2,"vis":3,"x":289.7,"y":-178.6,"side":1,"facts":[{"h":"It acknowledges the differences that exist in India and <b>does not take commonality and cultural continuity for granted<\/b>. The comparative route covers both the differences and the commonalities.","tags":[]}],"refs":[{"s":"s2","n":26,"id":"s2-26"}]},{"id":"indianness","title":"India, Indian, Indianness","plain":"India, Indian, Indianness","label":"Indianness","c":"B","tier":2,"vis":3,"x":443.7,"y":-103.9,"side":1,"facts":[{"h":"India as Mother, Goddess, Nature and Civilisation.","tags":[]},{"h":"Quote: in a contentious polity the sense of unity in diversity is often absent, yet \"Indians share a <b>family resemblance<\/b> in the sense that there is a <b>distinctive Indian stamp<\/b> on certain universal experiences: growing up male or female, sex and marriage, behaviour at work, status and discrimination, the body in illness and health, religious life and, finally, ethnic conflict.\"","tags":[]},{"h":"The slide stresses two words: <b>share<\/b> and <b>distinctive<\/b>.","tags":[]}],"refs":[{"s":"s4","n":15,"id":"s4-15"}]},{"id":"lang_culture","title":"Language and culture","plain":"Language and culture","label":"Language & culture","c":"C","tier":2,"vis":3,"x":579.7,"y":94.5,"side":1,"facts":[{"h":"Language is a mode of human expression and helps shape the speaker's identity. The slide's equation: <b>language = communication = community<\/b>. Language is a repository of culture.","tags":[]},{"h":"Culture: the way of life, especially the customs and beliefs, of a particular people at a particular time, including music, art and literature.","tags":[]}],"refs":[{"s":"s2","n":16,"id":"s2-16"}]},{"id":"what_lit","title":"What is literature?","plain":"What is literature?","label":"What is literature","c":"C","tier":2,"vis":3,"x":508.2,"y":41.4,"side":1,"facts":[{"h":"A mode of cultural expression; a product of the creative imagination.","tags":[]},{"h":"Written artistic works, especially those with high creative merit and lasting value.","tags":[]},{"h":"It represents the language, culture and tradition of a people, and it is a <b>historical document<\/b>.","tags":[]},{"h":"It introduces new worlds of experience; gives joy; makes us wonder and think; lets us appreciate beauty in form and expression.","tags":[]}],"refs":[{"s":"s3","n":16,"id":"s3-16"}]},{"id":"lit_teaches","title":"What literature can teach","plain":"What literature can teach","label":"Literature teaches","c":"C","tier":3,"vis":3,"x":544.8,"y":121.0,"side":1,"facts":[{"h":"Research quoted on the slide: \"literature provides otherwise unavailable insights into the ways <b>emotions<\/b> are produced, experienced and enacted in human social life.\"","tags":[]},{"h":"Human emotions and values; moral and intellectual lessons; it makes us better people and thinkers (\"hopefully!\"); stories tell us about ourselves and real life; how to lead a balanced life; how to argue our case better.","tags":[]}],"refs":[{"s":"s3","n":17,"id":"s3-17"}]},{"id":"why_write","title":"Why people write","plain":"Why people write","label":"Why write","c":"C","tier":2,"vis":3,"x":478.7,"y":68.2,"side":1,"facts":[{"h":"1 To keep records of significant experience. 2 To share experience with an interested group. 3 For free individual expression, which contributes to mental and physical health. 4 A higher purpose.","tags":[]},{"h":"Hook: <b>record, share, express, higher purpose<\/b>.","tags":[]}],"refs":[{"s":"s2","n":17,"id":"s2-17"},{"s":"s4","n":16,"id":"s4-16"}]},{"id":"doing_cil","title":"Doing Comparative Indian Literature","plain":"Doing Comparative Indian Literature","label":"Doing CIL","c":"C","tier":3,"vis":3,"x":559.2,"y":67.6,"side":1,"facts":[{"h":"A comprehensive overview of India's literatures, their themes and concerns. Appreciating, analysing and <b>problematising<\/b> Indian Literature.","tags":[]},{"h":"How cultural, economic, political and social forces shape literary production in India. Pertinent issues of translation. All genres of writing.","tags":[]},{"h":"The outcome: the implications of being an Indian.","tags":[]}],"refs":[]},{"id":"folklore","title":"Folklore: verbal and nonverbal","plain":"Folklore: verbal and nonverbal","label":"Folklore","c":"C","tier":1,"vis":1,"x":497.7,"y":12.4,"side":1,"facts":[{"h":"To understand India's literature you need the written classics <b>and<\/b> the oral traditions, of which folklore is an integral part.","tags":[]},{"h":"<b>Verbal<\/b> folklore: proverbs, riddles, lullabies, tales, ballads, prose narratives, songs.","tags":[]},{"h":"<b>Nonverbal<\/b> folklore: dances, games, floor and wall designs, artefacts and toys, performing arts such as street magic and theatre.","tags":[]},{"h":"A large stock of shared folk material travels across India and the world; common motifs surface across regions, states and countries.","tags":[]}],"refs":[{"s":"s2","n":18,"id":"s2-18"},{"s":"s3","n":18,"id":"s3-18"}]},{"id":"folk_performance","title":"Folk performers and contexts","plain":"Folk performers and contexts","label":"Folk contexts","c":"C","tier":3,"vis":3,"x":483.5,"y":95.9,"side":1,"facts":[{"h":"Tales and songs work differently depending on the teller or singer, the time and place, and the listeners.","tags":[]},{"h":"Performers are professional (singers, troupes) and domestic (mothers, aunts, grandmothers).","tags":[]},{"h":"Sung at festivals, while watching crops or cattle, rowing boats, working in fields or at home, in calendar rituals, and at marriages, births and deaths.","tags":[]},{"h":"Their antiquity is as amazing as their mobility, yet they stay current as <b>variants<\/b>. New parallels are made every day.","tags":[]}],"refs":[{"s":"s4","n":17,"id":"s4-17"},{"s":"s4","n":19,"id":"s4-19"}]},{"id":"folk_songs","title":"Nine categories of folk song","plain":"Nine categories of folk song","label":"Folk-song types","c":"C","tier":1,"vis":1,"x":419.0,"y":131.6,"side":1,"facts":[{"h":"1 Male-centred: heroism and adventure. 2 <b>Female-centred<\/b>: domestic motifs and an alternative world view that <b>questions all kinds of traditions and hierarchies<\/b>. 3 Family relationships: affection, rivalry, incest, betrayal, cruelty. 4 Love in all its dimensions. 5 Fate, gods and demons. 6 Humorous. 7 Ribald. 8 The natural environment. 9 The community and its cultural and social practices.","tags":[]}],"refs":[{"s":"s2","n":19,"id":"s2-19"},{"s":"s3","n":19,"id":"s3-19"},{"s":"s4","n":18,"id":"s4-18"}]},{"id":"concept_il","title":"The concept of Indian Literature","plain":"The concept of Indian Literature","label":"The concept","c":"D","tier":2,"vis":3,"x":445.2,"y":249.7,"side":1,"facts":[{"h":"Hard to define: it isn't one literature written in one language.","tags":[]},{"h":"Defining a literature is easier when the nation is a clearly definable cultural entity, because culture and literature are closely linked. India isn't an easy cultural entity to define, so <b>both the singular and the plural<\/b> are used.","tags":[]}],"refs":[{"s":"s4","n":20,"id":"s4-20"}]},{"id":"nilavilakku","title":"Nilavilakku: many wicks, one light","plain":"Nilavilakku: many wicks, one light","label":"Nilavilakku","c":"D","tier":1,"vis":3,"x":0.0,"y":0.0,"side":-1,"facts":[{"h":"\"Many tongues, one voice.\" There is no common Indian language, but there is a common Indian literature, depending on how you look at it.","tags":[]},{"h":"The analogy is the traditional Indian <b>lamp with many wicks<\/b>, the Nilavilakku, from <b>K. M. George<\/b>. Past papers call it \"<b>base lamps<\/b>\" (distractors: temple bells, anklets, chandelier).","tags":["2023","2024"]},{"h":"\"The lamp is the same, the oil is the same, but it is the wicks that determine the brightness of light. The lights from various wicks merge imperceptibly and produce a brightness which is the totality of many lights. Just as many wicks produce one light, India's many languages produce one literature.\"","tags":[]},{"h":"Lamp = India. Oil = the shared sources. Wicks = the languages. One light = Indian Literature.","tags":[]},{"h":"This map is drawn as that lamp: each cluster is a wick around the light at the centre.","tags":[]}],"refs":[{"s":"s1","n":18,"id":"s1-18"},{"s":"s2","n":20,"id":"s2-20"},{"s":"s3","n":20,"id":"s3-20"},{"s":"s4","n":21,"id":"s4-21"}]},{"id":"unity_diversity","title":"Unity in diversity","plain":"Unity in diversity","label":"Unity in diversity","c":"D","tier":2,"vis":3,"x":443.7,"y":278.5,"side":1,"facts":[{"h":"Each language community expresses its own experience distinctly, but India's geopolitical and cultural territories have always been <b>porous<\/b>. Cultures give and receive; there is a spiritual oneness.","tags":[]},{"h":"Points of convergence are <b>thematic, generic and ideological<\/b>, and rarely confined to one language or region. Literature explores beyond narrow confines.","tags":[]}],"refs":[{"s":"s2","n":25,"id":"s2-25"}]},{"id":"civilisation","title":"Indian civilisation vs Macaulay","plain":"Indian civilisation vs Macaulay","label":"Macaulay","c":"D","tier":1,"vis":1,"x":526.2,"y":194.6,"side":1,"facts":[{"h":"The concept of \"<b>Bharatvarsha<\/b>\" took on new significance and meaning in <b>colonial<\/b> times (past-paper answer; distractors Buddhist revival, medieval, ancient).","tags":["2023","2024"]},{"h":"<b>T. B. Macaulay<\/b>: \"a single shelf of a good European library was worth the whole native literature of India\" (past-paper distractors: James Mill, Robert Clive, Friedrich Max Müller).","tags":["2023","2024"]},{"h":"The \"civilizing mission\" and \"the white man's burden\". Civilisation: \"an advanced state of human society, in which a high level of culture, science, industry, and government has been reached.\"","tags":[]},{"h":"So asserting the glory and antiquity of Indian civilisation became part of the nationalist project.","tags":[]}],"refs":[{"s":"s1","n":11,"id":"s1-11"},{"s":"s1","n":30,"id":"s1-30"},{"s":"s3","n":23,"id":"s3-23"}]},{"id":"against_plural","title":"Arguments for the singular","plain":"Arguments for the singular","label":"Against the plural","c":"D","tier":1,"vis":2,"x":394.9,"y":221.5,"side":1,"facts":[{"h":"1 <b>Language can't be the only criterion<\/b> for dividing literature (past-paper answer: \"language cannot be the only yardstick\"; distractors region, class, gender).","tags":["2023","2024"]},{"h":"2 Literature can be grouped by class, race, caste, gender, archetype, mode of narration and so on.","tags":[]},{"h":"3 \"<b>European<\/b> literature\" and \"<b>Latin American<\/b> literature\" cut across languages: many languages, one literature.","tags":[]},{"h":"4 The reverse: <b>Spanish<\/b> and <b>English<\/b> literatures take national names (Peruvian, Cuban, Mexican, Argentine; American, British, Australian, Canadian, Indian): one language, many literatures.","tags":[]},{"h":"5 Border-crossings between Indian languages happen all the time. 6 Multilingualism and polyglot fluidity are at the core of Indian creativity.","tags":[]}],"refs":[{"s":"s1","n":17,"id":"s1-17"},{"s":"s2","n":21,"id":"s2-21"},{"s":"s3","n":21,"id":"s3-21"},{"s":"s4","n":22,"id":"s4-22"}]},{"id":"commonality","title":"Commonality in Indian literature","plain":"Commonality in Indian literature","label":"Commonality","c":"D","tier":1,"vis":1,"x":287.7,"y":197.5,"side":1,"facts":[{"h":"Most Indian writers, <b>from Kabir to A. K. Ramanujan<\/b>, are bilingual if not multilingual.","tags":[]},{"h":"Forms and genres cross languages: from the <b>mahakavya<\/b> (epic) and the <b>doha<\/b> (couplet) to the novel and the short story.","tags":[]},{"h":"Movements that crossed linguistic and regional barriers: <b>Bhakti, the Progressive and the Modernist<\/b>.","tags":[]},{"h":"Shared patterns of experience, thought, feeling, concern and expression. Both pan-Indian and regional elements shaped Indian literature.","tags":[]}],"refs":[{"s":"s2","n":22,"id":"s2-22"},{"s":"s3","n":22,"id":"s3-22"},{"s":"s4","n":23,"id":"s4-23"}]},{"id":"literary_past","title":"India's literary past","plain":"India's literary past","label":"Literary past","c":"D","tier":3,"vis":3,"x":522.3,"y":223.3,"side":1,"facts":[{"h":"A literary history should account for the whole heritage, however scattered or loose.","tags":[]},{"h":"Literature in India is as old as its sculpture, painting or music, but hasn't received the historical attention those arts have.","tags":[]},{"h":"There is a common literary past; Indian Literature means literatures in Indian languages, classical and modern, and has to be inclusive.","tags":[]},{"h":"The paradox: <b>homogenisation is dangerous, but pure heterogeneity erases what cultures share<\/b>. That tension is the whole course in one sentence.","tags":[]}],"refs":[{"s":"s4","n":25,"id":"s4-25"}]},{"id":"sahitya_akademi","title":"Sahitya Akademi","plain":"Sahitya Akademi","label":"Sahitya Akademi","c":"D","tier":1,"vis":2,"x":396.7,"y":190.2,"side":1,"facts":[{"h":"Formally inaugurated by the Government of India on <b>12 March 1954<\/b>.","tags":[]},{"h":"The Government Resolution: a national organisation to develop Indian letters, set high literary standards, foster and co-ordinate literary activity in all Indian languages, and through them <b>promote the cultural unity of the country<\/b>. Past-paper answer to \"mandated to... forging national cultural unity\" (distractors: National Translation Mission, Sahitya Samvad, Central Institute of Indian Languages).","tags":["2023","2024"]},{"h":"India's <b>National Academy of Letters<\/b>, the central institution for literary dialogue, publication and promotion.","tags":[]},{"h":"The only institution doing literary work in <b>24 Indian languages, including English<\/b>.","tags":[]},{"h":"Works through seminars, lectures, symposia, discussions, readings, performances, translation workshops, journals, monographs, anthologies, encyclopaedias, dictionaries, bibliographies, who's-who of writers and literary histories.","tags":[]},{"h":"Over <b>6,000 books<\/b>, at a pace of <b>one book every 19 hours<\/b>.","tags":[]},{"h":"<b>24 awards<\/b> a year for literary works and an equal number for literary <b>translations<\/b>, each after a year-long scrutiny.","tags":[]},{"h":"<b>Bhasha Samman<\/b>: for significant contributions to languages the Akademi doesn't formally recognise, and to classical and medieval literature.","tags":[]}],"refs":[{"s":"s1","n":1,"id":"s1-01"},{"s":"s2","n":23,"id":"s2-23"},{"s":"s3","n":24,"id":"s3-24"},{"s":"s4","n":24,"id":"s4-24"}]},{"id":"perception_reality","title":"Perception vs reality","plain":"Perception vs reality","label":"Perception vs reality","c":"D","tier":1,"vis":2,"x":296.1,"y":250.6,"side":1,"facts":[{"h":"Indian Literature is often confused with ancient works in <b>Sanskrit<\/b>. A modern, forward-looking concept of Indian Literature has not been formulated.","tags":[]},{"h":"The thesis \"India has one literature that is written in many languages\" has <b>never been properly explored and validated<\/b>.","tags":[]},{"h":"<b>Tamil is the only language with a continuous literary tradition.<\/b> Its early grammar, the <b>Tolkappiyam<\/b>, recognises exactly one other language as its equal and competitor: <b>Sanskrit<\/b>.","tags":[]},{"h":"So what is classical Indian literature: Tamil? Sanskrit? Tamil and Sanskrit? The slide leaves the question mark.","tags":[]},{"h":"The epics exist in <b>folk and written<\/b> traditions. Folk and popular traditions often oppose each other and the literary. There is <b>symbiosis between Tamil and Sanskrit<\/b>.","tags":[]}],"refs":[{"s":"s2","n":24,"id":"s2-24"},{"s":"s3","n":26,"id":"s3-26"}]},{"id":"cultural_unity","title":"Cultural unity and the link language","plain":"Cultural unity and the link language","label":"Cultural unity","c":"D","tier":1,"vis":2,"x":375.5,"y":101.3,"side":1,"facts":[{"h":"Plots from the Ramayana and Mahabharata are used in both <b>Tamil Sangam poetry and Sanskrit plays<\/b>.","tags":[]},{"h":"Sanskrit was the language of high culture. Then came Apabhramsa, the <b>Prakrits (6th–11th centuries)<\/b> and Pali, yet <b>Sanskrit stayed a link language<\/b>. Past-paper answer to \"link language in ancient times\" (distractors Apabhramsha, Pali, Prakrit).","tags":["2023","2024"]},{"h":"Civilisational and cultural unity was expressed through Sanskrit texts, Tamil literature and folk narratives.","tags":[]},{"h":"Conclusion: not a mechanical, unitary concept but a <b>comparative concept<\/b>, covering the twin aspects of unity and diversity.","tags":[]}],"refs":[{"s":"s1","n":24,"id":"s1-24"},{"s":"s3","n":25,"id":"s3-25"},{"s":"s4","n":26,"id":"s4-26"}]},{"id":"four_periods","title":"Four periods of Indian literature","plain":"Four periods of Indian literature","label":"Four periods","c":"E","tier":1,"vis":2,"x":139.9,"y":264.1,"side":1,"facts":[{"h":"<b>Ancient<\/b>: 2000 BC to 1000 AD. <b>Medieval<\/b>: 1000 to 1800 AD. <b>Under colonial rule<\/b>: 1800 to 1947. <b>Contemporary<\/b>: 1947 onwards.","tags":[]},{"h":"Indian literature has a history of almost <b>4,000 years<\/b>. You can't understand the branches until you've explored the roots.","tags":[]}],"refs":[{"s":"s2","n":27,"id":"s2-27"},{"s":"s4","n":27,"id":"s4-27"}]},{"id":"earliest_langs","title":"Earliest writing: five languages","plain":"Earliest writing: five languages","label":"Five earliest languages","c":"E","tier":1,"vis":2,"x":296.0,"y":385.1,"side":1,"facts":[{"h":"<b>Sanskrit, Pali, Prakrit, Tamil and Kannada<\/b>. Past-paper answer; distractors swap Kannada for Gujari, Telugu or Apabhramsa.","tags":["2023","2024"]},{"h":"Each had its own socio-historical context, but they shared a common frame of reference in recurring patterns of thought and concern.","tags":[]},{"h":"The subject of the earliest known texts: the relationship of man with the world around him, and with its creator.","tags":[]}],"refs":[{"s":"s1","n":32,"id":"s1-32"},{"s":"s3","n":27,"id":"s3-27"}]},{"id":"sruti","title":"Sruti: \"that which is heard\"","plain":"Sruti: \"that which is heard\"","label":"Sruti","c":"E","tier":1,"vis":2,"x":119.0,"y":397.3,"side":1,"facts":[{"h":"The earliest period of Sanskrit literature is the <b>Vedic Age<\/b>, tentatively lasting until about <b>1200 BC<\/b>.","tags":[]},{"h":"It saw the oral tradition of the Sruti texts, including the Vedas, meant to be recited and heard. Sruti is <b>heard, revealed and divine<\/b>.","tags":[]},{"h":"Sruti = the Vedas with their <b>Samhitas, Brahmanas, Aranyakas and Upanishads<\/b>. So the <b>Puranas are not Sruti<\/b> (past-paper answer).","tags":["2023","2024"]},{"h":"\"Sruti texts contain whatever is heard and revealed; Smriti texts are all that is remembered, recorded from memory and later consolidated into a literary tradition\": <b>the whole statement is true<\/b>.","tags":["2023","2024"]}],"refs":[{"s":"s1","n":16,"id":"s1-16"},{"s":"s1","n":23,"id":"s1-23"},{"s":"s2","n":28,"id":"s2-28"},{"s":"s4","n":28,"id":"s4-28"}]},{"id":"vedas","title":"The Vedas","plain":"The Vedas","label":"The Vedas","c":"E","tier":1,"vis":2,"x":-80.8,"y":346.3,"side":-1,"facts":[{"h":"Veda comes from the verb <b>\"vid\", to know<\/b> (past-paper distractors: vadati, ved, viditva).","tags":["2023","2024"]},{"h":"People believed the Vedas were created by God; the human narrator was only the medium carrying the message.","tags":[]},{"h":"Four Vedas: <b>Rig, Yajur, Sama and Atharva<\/b>. The <b>Rigveda<\/b> is the earliest (the oldest), with hymns and prayers to various gods.","tags":["2023","2024"]},{"h":"In them: man's earliest attempts to understand his place in the world and open a dialogue with the unknown through supplication, philosophical enquiry and speculation.","tags":[]}],"refs":[{"s":"s1","n":13,"id":"s1-13"},{"s":"s1","n":38,"id":"s1-38"},{"s":"s2","n":29,"id":"s2-29"},{"s":"s3","n":28,"id":"s3-28"}]},{"id":"samhitas","title":"Samhitas","plain":"Samhitas","label":"Samhitas","c":"E","tier":1,"vis":2,"x":255.9,"y":316.8,"side":1,"facts":[{"h":"Samhita means collection, literally <b>\"joined together\"<\/b>. The Vedas are Samhitas: the mantra texts of each Veda.","tags":[]},{"h":"They contain <b>hymns, prayers, benedictions, sacrificial formulas and litanies<\/b> (past-paper answer; distractors Upanishads, Aranyakas, Brahmanas).","tags":["2023","2024"]},{"h":"Samhitas are Sruti, so they are <b>not Smriti<\/b> (past-paper answer).","tags":["2023","2024"]}],"refs":[{"s":"s1","n":34,"id":"s1-34"},{"s":"s2","n":30,"id":"s2-30"}]},{"id":"yagna","title":"The sacrifice (yagna)","plain":"The sacrifice (yagna)","label":"Yagna","c":"E","tier":1,"vis":1,"x":71.5,"y":276.9,"side":1,"facts":[{"h":"The central motif of the Vedas is the <b>sacrifice<\/b>, with instructions for performing it in honour of various gods to win their goodwill.","tags":[]},{"h":"The main impulse: the desire for a good life: a long and healthy life, <b>cattle, children<\/b> and so on. A friendly god, once pleased, would grant the wishes.","tags":[]},{"h":"The gods ruled natural forces: fire, water, wind and earth.","tags":[]}],"refs":[{"s":"s3","n":29,"id":"s3-29"}]},{"id":"brahmanas","title":"Brahmanas","plain":"Brahmanas","label":"Brahmanas","c":"E","tier":1,"vis":2,"x":365.8,"y":354.7,"side":1,"facts":[{"h":"The <b>commentaries<\/b> on the four Vedas: <b>eleven<\/b> Brahmanas, a large body of <b>prose<\/b>.","tags":[]},{"h":"They comment on the mantras and prescribe their use in sacrifices. Their speculation is theological, but also philosophical, grammatical, etymological and metrical.","tags":[]},{"h":"Studied <b>while carrying on daily life in the wider community<\/b>. Past-paper two-blank answer: \"Brahmanas; Aranyakas\".","tags":["2023","2024"]},{"h":"\"The commentaries on the Vedas are to be found in the <b>Brahmanas and Aranyakas<\/b>\" (past-paper answer).","tags":["2023","2024"]}],"refs":[{"s":"s1","n":2,"id":"s1-02"},{"s":"s1","n":4,"id":"s1-04"},{"s":"s2","n":38,"id":"s2-38"},{"s":"s3","n":30,"id":"s3-30"}]},{"id":"aranyakas","title":"Aranyakas","plain":"Aranyakas","label":"Aranyakas","c":"E","tier":1,"vis":2,"x":227.8,"y":420.0,"side":1,"facts":[{"h":"<b>Three<\/b> Aranyakas, meant for study in the <b>seclusion of the forest<\/b> (aranya = forest).","tags":[]},{"h":"Ritual explorations and allegorical speculations: a traditional phase of enquiry into Vedic knowledge. \"Forest texts\", transitional, giving the symbolic and meditative meaning of rituals.","tags":[]}],"refs":[{"s":"s2","n":31,"id":"s2-31"},{"s":"s4","n":29,"id":"s4-29"}]},{"id":"upanishads","title":"Upanishads","plain":"Upanishads","label":"Upanishads","c":"E","tier":1,"vis":2,"x":154.9,"y":293.4,"side":1,"facts":[{"h":"The word means \"<b>sitting down, with devotion, near the teacher<\/b> to receive instruction\".","tags":[]},{"h":"<b>Thirteen principal<\/b> Upanishads (past-paper answer; distractors 7, 10, 16).","tags":["2023","2024"]},{"h":"Mainly metaphysical: life, death, immortality, happiness, truth, God and the origins of life. They explore <b>Atman<\/b> (the self) and <b>Brahman<\/b> (ultimate reality).","tags":[]}],"refs":[{"s":"s1","n":7,"id":"s1-07"},{"s":"s2","n":32,"id":"s2-32"},{"s":"s4","n":30,"id":"s4-30"}]},{"id":"sbau","title":"Samhita → Brahmana → Aranyaka → Upanishad","plain":"Samhita → Brahmana → Aranyaka → Upanishad","label":"S → B → A → U","c":"E","tier":1,"vis":2,"x":187.2,"y":366.2,"side":1,"facts":[{"h":"<b>Samhitas<\/b> (<span class=\"script\">संहिता<\/span>): collections of hymns and mantras, used in rituals and sacrifices.","tags":[]},{"h":"<b>Brahmanas<\/b> (<span class=\"script\">ब्राह्मण<\/span>): prose ritual manuals explaining the procedures and meanings of rites.","tags":[]},{"h":"<b>Aranyakas<\/b> (<span class=\"script\">आरण्यक<\/span>): \"forest texts\", transitional: the symbolic, meditative meaning of rituals.","tags":[]},{"h":"<b>Upanishads<\/b> (<span class=\"script\">उपनिषद्<\/span>): philosophical discourses on Atman and Brahman.","tags":[]},{"h":"From hymn, to ritual, to forest meditation, to philosophy: <b>from outer ritual to inner truth<\/b>.","tags":[]}],"refs":[{"s":"s3","n":31,"id":"s3-31"}]},{"id":"smriti","title":"Smriti: \"that which is remembered\"","plain":"Smriti: \"that which is remembered\"","label":"Smriti","c":"E","tier":1,"vis":2,"x":70.0,"y":346.4,"side":-1,"facts":[{"h":"What is <b>remembered<\/b>, recorded from memory and later consolidated into a literary tradition.","tags":[]},{"h":"A break from the earlier Vedic tradition, because it is <b>attributed to human authors<\/b>.","tags":[]},{"h":"The body of Smriti: the <b>six Vedangas, the epics and the Puranas<\/b>. So the Mahabharata, Ramayana, Vedangas and Bhagavata Purana are Smriti; the <b>Samhitas are not<\/b> (past-paper answer).","tags":["2023","2024"]},{"h":"Smriti texts are often written in <b>sutra<\/b> form.","tags":[]}],"refs":[{"s":"s1","n":25,"id":"s1-25"},{"s":"s2","n":34,"id":"s2-34"},{"s":"s4","n":31,"id":"s4-31"}]},{"id":"vedangas","title":"The six Vedangas","plain":"The six Vedangas","label":"Vedangas","c":"E","tier":1,"vis":2,"x":67.4,"y":305.9,"side":1,"facts":[{"h":"The limbs or adjuncts of the Vedas: <b>siksha<\/b> (phonetics), <b>chandas<\/b> (metre), <b>vyakarana<\/b> (grammar), <b>nirukta<\/b> (etymology), <b>jyotisha<\/b> (astronomy), <b>kalpa<\/b> (rituals and ceremonies).","tags":[]}],"refs":[{"s":"s2","n":33,"id":"s2-33"},{"s":"s3","n":32,"id":"s3-32"},{"s":"s4","n":32,"id":"s4-32"}]},{"id":"puranas","title":"The Puranas","plain":"The Puranas","label":"Puranas","c":"E","tier":2,"vis":3,"x":339.5,"y":319.7,"side":1,"facts":[{"h":"Part of Smriti, not Sruti. The most popular is the <b>Bhagavata Purana<\/b>, the story of <b>Krishna's<\/b> life.","tags":[]}],"refs":[{"s":"s3","n":33,"id":"s3-33"}]},{"id":"sutra_dharma","title":"Sutra and Dharma","plain":"Sutra and Dharma","label":"Sutra & Dharma","c":"E","tier":2,"vis":3,"x":-28.0,"y":373.6,"side":-1,"facts":[{"h":"<b>Sutra means thread<\/b>: a short, aphoristic statement that \"threads together\" large bodies of knowledge as briefly as possible.","tags":[]},{"h":"The texts lead towards <b>Dharma<\/b>: that which sustains, is firm and durable, and governs all human life.","tags":[]},{"h":"Not only didactic: they use narrative techniques and drama, so the listener is entertained and instructed at once.","tags":[]}],"refs":[{"s":"s3","n":34,"id":"s3-34"},{"s":"s4","n":33,"id":"s4-33"}]},{"id":"post_vedic_poetry","title":"Post-Vedic Sanskrit poetry","plain":"Post-Vedic Sanskrit poetry","label":"Post-Vedic poetry","c":"E","tier":3,"vis":3,"x":179.4,"y":393.5,"side":1,"facts":[{"h":"Ranges from the <b>amatory<\/b> (love) to the <b>moral<\/b> to the <b>renunciatory<\/b>.","tags":[]},{"h":"Composed in courts under royal patronage; <b>more secular<\/b> in tone than its predecessors.","tags":[]}],"refs":[{"s":"s4","n":34,"id":"s4-34"}]},{"id":"natyashastra","title":"Bharata's Natyashastra","plain":"Bharata's Natyashastra","label":"Natyashastra","c":"E","tier":1,"vis":2,"x":-135.1,"y":382.5,"side":-1,"facts":[{"h":"Written by <b>Bharata<\/b> (past-paper answer; distractors Bhasa, Visakhadatta, Kalidasa).","tags":["2023","2024"]},{"h":"Dated between the <b>1st century BC and the 1st century AD<\/b>.","tags":[]},{"h":"A theoretical text on the performing arts that sets the ground rules for Sanskrit aesthetic theory, including the <b>Nava Rasas<\/b>.","tags":[]}],"refs":[{"s":"s1","n":37,"id":"s1-37"},{"s":"s3","n":35,"id":"s3-35"}]},{"id":"sanskrit_drama","title":"Sanskrit drama: conventions","plain":"Sanskrit drama: conventions","label":"Sanskrit drama","c":"E","tier":2,"vis":2,"x":0.3,"y":414.0,"side":-1,"facts":[{"h":"Most plays were built around <b>romantic love or heroic valour<\/b>, with a noble or godly hero.","tags":[]},{"h":"They began and ended with a <b>benediction for universal peace and prosperity<\/b>.","tags":[]},{"h":"The hero achieves one of the four goals of life.","tags":[]},{"h":"Destiny mattered, and so did the natural world: birds, flowers, animals, clouds. Sources: the Vedas, the Puranas and history. Characters came from a cross-section of society.","tags":[]},{"h":"Some characters, especially <b>women and servants<\/b>, speak <b>Prakrit<\/b> (past-paper answer; distractors Tamil, Telugu, Kannada).","tags":["2023","2024"]}],"refs":[{"s":"s2","n":35,"id":"s2-35"}]},{"id":"purusharthas","title":"The four goals of life","plain":"The four goals of life","label":"Purusharthas","c":"E","tier":1,"vis":2,"x":40.1,"y":305.4,"side":-1,"facts":[{"h":"<b>Dharma<\/b> (morality, duty) · <b>artha<\/b> (wealth) · <b>kama<\/b> (love, desire) · <b>moksha<\/b> (liberation).","tags":[]}],"refs":[{"s":"s3","n":36,"id":"s3-36"}]},{"id":"dramatists","title":"Sanskrit dramatists","plain":"Sanskrit dramatists","label":"Dramatists","c":"E","tier":1,"vis":2,"x":-69.9,"y":317.6,"side":-1,"facts":[{"h":"<b>Bhasa and Kalidasa<\/b>: romances and heroic plays.","tags":[]},{"h":"<b>Sudraka<\/b>: social comedies. The notes add his play <i>Mricchakatika<\/i>, \"The Little Clay Cart\".","tags":["notes+"]},{"h":"<b>Visakhadatta<\/b>: political intrigue and royal court life. The notes add <i>Mudrarakshasa<\/i>, \"The Signet Ring of the Minister\".","tags":["notes+"]}],"refs":[{"s":"s2","n":36,"id":"s2-36"}]},{"id":"verse_prose_forms","title":"Sanskrit verse and prose forms","plain":"Sanskrit verse and prose forms","label":"Verse & prose forms","c":"E","tier":1,"vis":2,"x":113.2,"y":334.2,"side":1,"facts":[{"h":"<b>Mahakavya<\/b>: long poems following the prescribed rules of good poetry.","tags":[]},{"h":"<b>Laghukavya<\/b>: lyric poetry.","tags":[]},{"h":"<b>Inscriptions<\/b>: show ornate prose and verse in use, and introduce the genre of the <b>Prasasti<\/b>, a eulogy of the ruling king.","tags":[]},{"h":"<b>Gadyakavya<\/b>: literary prose romances.","tags":[]},{"h":"<b>Akhyayika<\/b>: invented stories about historical characters.","tags":[]},{"h":"<b>Scientific prose<\/b>: medicine, astrology, grammar, prosody, astronomy, erotics, politics, performing arts, law.","tags":[]},{"h":"<b>Campu<\/b>: mixed prose and verse.","tags":[]},{"h":"<b>Fables<\/b>: see the Panchatantra and the Kathasaritsagara.","tags":[]}],"refs":[{"s":"s2","n":37,"id":"s2-37"},{"s":"s4","n":35,"id":"s4-35"}]},{"id":"fables","title":"Panchatantra and Kathasaritsagara","plain":"Panchatantra and Kathasaritsagara","label":"Fables","c":"E","tier":1,"vis":2,"x":295.3,"y":347.3,"side":1,"facts":[{"h":"The most popular fables: <b>Vishnusharma's Panchatantra<\/b> and <b>Somadeva's Kathasaritsagara<\/b>.","tags":[]},{"h":"Past paper: the Panchatantra falls under the category of <b>fable<\/b> (distractors gadyakavya, mahakavya, prasasti).","tags":["2023","2024"]}],"refs":[{"s":"s1","n":33,"id":"s1-33"},{"s":"s3","n":37,"id":"s3-37"}]},{"id":"social_tendencies","title":"Social tendencies in Sanskrit thought","plain":"Social tendencies in Sanskrit thought","label":"Taxonomy","c":"E","tier":3,"vis":3,"x":38.7,"y":413.4,"side":1,"facts":[{"h":"<b>Taxonomy<\/b> (classification) is the hallmark of Sanskrit thinkers: they classified language, natural phenomena and even emotions.","tags":[]},{"h":"A hierarchical social order, with life regulated by a <b>dharma that is given and not open to debate<\/b>.","tags":[]},{"h":"By the <b>6th century AD<\/b> knowledge had been codified, with strict rules for literary composition and even appreciation. That changed with the growing influence of <b>Buddhism and Jainism<\/b>.","tags":[]}],"refs":[{"s":"s4","n":36,"id":"s4-36"}]},{"id":"prakrit","title":"Prakrit","plain":"Prakrit","label":"Prakrit","c":"E","tier":1,"vis":2,"x":0.7,"y":346.1,"side":-1,"facts":[{"h":"Prakrit means <b>\"natural\" or \"common\"<\/b>: the language of everyday conversation and commerce. Sanskrit was the refined language of literary speech and ritual, and took training. The two grew side by side in complex negotiation and exchange.","tags":[]},{"h":"In many Sanskrit plays some characters, especially <b>women and servants<\/b>, speak Prakrit.","tags":["2023","2024"]},{"h":"Prakrit texts took Sanskrit literary themes and rewrote them in the context of folk traditions.","tags":[]},{"h":"The main evidence of Prakrit in literary composition: the <b>Ashokan Inscriptions<\/b>, the earliest dated Indian literary records.","tags":[]},{"h":"By the <b>5th century AD<\/b>: songs, Buddhist <b>gathas<\/b>, Jaina writings, doctrinal treatises, and secular literature like the <b>Sattasai<\/b> anthologies, to which <b>women also contributed<\/b>; plus grammars, lexicons, poetics, metrics, astronomy and medicine.","tags":[]}],"refs":[{"s":"s1","n":28,"id":"s1-28"},{"s":"s3","n":38,"id":"s3-38"},{"s":"s4","n":37,"id":"s4-37"}]},{"id":"apabhramsa","title":"Apabhramsa","plain":"Apabhramsa","label":"Apabhramsa","c":"E","tier":2,"vis":3,"x":94.7,"y":361.4,"side":1,"facts":[{"h":"A literary language by the <b>7th century AD<\/b>, first used in <b>Jaina<\/b> writings (so an openly religious tone).","tags":[]},{"h":"Later used for <b>sandhi bandhas<\/b> (stories from the Puranas), biographies and religious narratives, and for <b>rasa bandhas<\/b> (lyrics with a fixed metre for the main body and other metres for variety).","tags":[]}],"refs":[{"s":"s3","n":39,"id":"s3-39"}]},{"id":"kannada","title":"Early Kannada","plain":"Early Kannada","label":"Early Kannada","c":"E","tier":1,"vis":2,"x":113.9,"y":431.1,"side":1,"facts":[{"h":"Rock edicts and inscriptions suggest Kannada existed as early as the <b>3rd century BC<\/b>.","tags":[]},{"h":"Influences: Sanskrit, Prakrit, Vedic and Jaina legends, the Ramayana and the Mahabharata.","tags":[]},{"h":"The earliest known literary work is the <b>Kavirajamargam<\/b> (around <b>850 AD<\/b>), a treatise on rhetoric, grammar, language and prosody that also comments on society, religion and culture. Past-paper answer (distractors Rajasekharavilasa, Lilavati, Vacanakavyas).","tags":["2024"]},{"h":"The parallel: Tamil and Kannada literature both begin with a grammar book.","tags":[]}],"refs":[{"s":"s1","n":68,"id":"s1-68"},{"s":"s4","n":38,"id":"s4-38"}]},{"id":"kannada_golden","title":"The Golden Age of Kannada (10th century)","plain":"The Golden Age of Kannada (10th century)","label":"Pampa · Ponna · Ranna","c":"E","tier":1,"vis":2,"x":252.7,"y":288.3,"side":1,"facts":[{"h":"Its three great writers: <b>Pampa, Ponna and Ranna<\/b>, sometimes called the three gems.","tags":[]},{"h":"Grand narratives took famous episodes from the epics and reinterpreted them locally; the works reflect the social, cultural and political life of the time.","tags":[]},{"h":"Most writing of the age sought a distinct identity through language, landscape, myth, literature and culture.","tags":[]}],"refs":[{"s":"s2","n":39,"id":"s2-39"}]},{"id":"jaina_kannada","title":"Jainism and early Kannada","plain":"Jainism and early Kannada","label":"Jaina dual vision","c":"E","tier":2,"vis":3,"x":76.9,"y":387.5,"side":-1,"facts":[{"h":"Jainism was widely accepted. The dilemma of a man torn between living a full life and renunciation shapes all Jaina-inspired writing: the <b>dual vision of affirmation and denial<\/b>.","tags":[]}],"refs":[]},{"id":"two_archetypes","title":"Two archetypes; Bhakti reconciles them","plain":"Two archetypes; Bhakti reconciles them","label":"Here vs hereafter","c":"E","tier":1,"vis":1,"x":43.4,"y":276.3,"side":-1,"facts":[{"h":"The thread binding literature across all these languages: two parallel archetypes, movement <b>towards life<\/b> (erotic and material fulfilment) and <b>renunciation<\/b>.","tags":[]},{"h":"Only the <b>Bhakti<\/b> movement could reconcile the \"here\" and the \"hereafter\".","tags":[]},{"h":"In the <b>Virasaiva<\/b> movement, the <b>Vacanakaras<\/b> (makers of divine poetry in Kannada) blended these emotions into an integral vision.","tags":[]}],"refs":[{"s":"s4","n":39,"id":"s4-39"}]},{"id":"classical_canvas","title":"Classical India: the canvas","plain":"Classical India: the canvas","label":"Classical canvas","c":"F","tier":3,"vis":3,"x":-465.2,"y":320.0,"side":-1,"facts":[{"h":"A vast area of diverse traditions over the last <b>3,500 years<\/b>; every part of India produced classical literature.","tags":[]},{"h":"Ancient India produced the Vedic corpus, the <b>Jain Agamas<\/b> (the sacred scriptures of Jainism) and the huge Buddhist literature, including writing from across Asia.","tags":[]},{"h":"The south's four major languages, all classical with strong literary traditions: <b>Tamil, Kannada, Malayalam and Telugu<\/b>. Tamil's literary history is nearly <b>2,000 years<\/b> long.","tags":[]}],"refs":[{"s":"s4","n":48,"id":"s4-48"}]},{"id":"sangam","title":"Sangam literature","plain":"Sangam literature","label":"Sangam","c":"F","tier":1,"vis":2,"x":-418.7,"y":289.3,"side":-1,"facts":[{"h":"Tamil's claim to classical status rests on it; also called early classical Tamil literature.","tags":[]},{"h":"Dates vary: 400 BCE–250 CE, 300 BCE–300 CE, or 300 BCE–100 CE (Part 5 dates the love and war poems to about 300 BC–100 AD).","tags":[]},{"h":"<b>Over 2,000 poems<\/b>: breathtakingly direct, subtle in nuance, astonishingly contemporary.","tags":[]},{"h":"Also spelled cankam, chankam, shangam. A Sangam is an <b>academy<\/b> where the poetry was composed and later anthologised.","tags":[]}],"refs":[{"s":"s3","n":40,"id":"s3-40"},{"s":"s4","n":40,"id":"s4-40"}]},{"id":"three_sangams","title":"The three Sangams (a legend)","plain":"The three Sangams (a legend)","label":"Three Sangams","c":"F","tier":1,"vis":2,"x":-293.3,"y":225.5,"side":-1,"facts":[{"h":"<b>Three<\/b> academies where poets gathered to debate and approve literary works (past-paper answer; distractors 2, 4, 5).","tags":["2024"]},{"h":"<b>First<\/b>: Then-Madurai (\"South Madurai\"), south of present Kanyakumari, an ancient Pandyan city.","tags":[]},{"h":"<b>Second<\/b>: <b>Kapadapuram<\/b>, near present-day Tiruchendur.","tags":[]},{"h":"Both were swallowed by the sea and their works lost. The <b>Agattiyam<\/b> (the earliest Tamil grammar, from
